name: Set up Linux LLVM
description: Install the verified LLVM release used by compiler and native acceptance tests.
runs:
  using: composite
  steps:
    - name: Reserve space for the LLVM toolchain
      shell: bash
      run: |
        # The hosted runner SDKs are unused by this native compiler lane. LLVM's cache restore
        # needs space for both its compressed archive and extracted installation.
        sudo rm -rf /usr/local/lib/android /usr/share/dotnet
        df -h .
    - uses: actions/cache@v4
      with:
        path: .scratch/llvm-22.1.8
        key: native-supply-llvm-Linux-${{ runner.arch }}-${{ hashFiles('scripts/setup-linux-llvm.sh') }}
    - shell: bash
      run: |
        set -euo pipefail
        bash scripts/setup-linux-llvm.sh
        echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
        echo "SILK_TEST_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
        echo "SILK_TEST_LLVM_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
