name: Check native generation contracts
description: Prepare source compiler identity inputs and run every native contract test
runs:
  using: composite
  steps:
    # Contract tests include a real source frontend probe. Its identity generator hashes
    # the LLVM JavaScript it loads; prepare that package without building the compiler.
    # These ignored distribution inputs never enter the authored native snapshot.
    - shell: bash
      run: |
        pnpm --filter @silklang/llvm build
        pnpm --filter @silklang/compiler toolchain:generate
        pnpm exec vitest run --config compiler/scripts/vitest.config.mjs
