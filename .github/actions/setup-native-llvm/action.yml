name: Set up native LLVM
description: Install the verified LLVM 22 release for the runner's native architecture.
runs:
  using: composite
  steps:
    - name: Select the native LLVM release
      id: release
      shell: bash
      run: |
        set -euo pipefail
        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64) asset=Linux-X64; digest=df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384 ;;
          Linux/ARM64) asset=Linux-ARM64; digest=805efad2bb91cb4967fa569e0881d10c0f69c04461cf671cccbae19f547acc34 ;;
          macOS/ARM64) asset=macOS-ARM64; digest=f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f ;;
          *) echo "Unsupported native runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
        esac
        { echo "asset=$asset"; echo "digest=$digest"; } >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      with:
        path: .scratch/llvm-22.1.8
        key: native-supply-llvm-${{ steps.release.outputs.asset }}-${{ steps.release.outputs.digest }}
    - name: Install LLVM and select the native linker
      shell: bash
      env:
        LLVM_ASSET: ${{ steps.release.outputs.asset }}
        LLVM_DIGEST: ${{ steps.release.outputs.digest }}
      run: |
        set -euo pipefail
        mkdir -p .scratch/llvm-22.1.8
        if [ ! -x .scratch/llvm-22.1.8/bin/clang ]; then
          curl --fail --location --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-$LLVM_ASSET.tar.xz" -o .scratch/llvm.tar.xz
          echo "$LLVM_DIGEST  .scratch/llvm.tar.xz" | shasum -a 256 -c -
          tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
          rm .scratch/llvm.tar.xz
        fi
        echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
        {
          echo "SILKC_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang"
          echo "SILK_TEST_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang"
          echo "SILK_TEST_LLVM_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar"
        } >> "$GITHUB_ENV"
        if [ "$RUNNER_OS" = macOS ]; then
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
        fi
