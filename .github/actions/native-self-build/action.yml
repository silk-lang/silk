name: Build one verified native generation
description: Build N1 and its smoke executable with N0 and the exact clang bound by the seed receipt.
inputs:
  seed:
    description: Restored immutable N0 executable.
    required: true
  seed-receipt:
    description: Restored exact N0 producer receipt.
    required: true
  snapshot:
    description: Restored authored input snapshot directory.
    required: true
  output:
    description: Fresh generation output directory.
    required: true
  clang:
    description: Setup-selected verified clang executable or symlink.
    required: true
  corpus-source:
    description: Authored shared corpus source containing the smoke fixture.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NATIVE_SEED: ${{ inputs.seed }}
        NATIVE_SEED_RECEIPT: ${{ inputs.seed-receipt }}
        NATIVE_SNAPSHOT: ${{ inputs.snapshot }}
        NATIVE_OUTPUT: ${{ inputs.output }}
        NATIVE_CLANG: ${{ inputs.clang }}
        NATIVE_CORPUS: ${{ inputs.corpus-source }}
      run: |
        set -euo pipefail
        node compiler/scripts/NativeBuild.ts \
          --seed "$NATIVE_SEED" \
          --seed-receipt "$NATIVE_SEED_RECEIPT" \
          --clang "$NATIVE_CLANG" \
          --snapshot "$NATIVE_SNAPSHOT" \
          --output "$NATIVE_OUTPUT" \
          --corpus-source "$NATIVE_CORPUS" \
          2>&1 | tee "$RUNNER_TEMP/native-self-build.log"
        cp "$NATIVE_SEED_RECEIPT" "$NATIVE_OUTPUT/producer-seed-receipt.json"
        cp "$NATIVE_SNAPSHOT/input-snapshot.json" "$NATIVE_OUTPUT/input-snapshot.json"
        cp "$NATIVE_SNAPSHOT/authored-inputs.tar" "$NATIVE_OUTPUT/authored-inputs.tar"
