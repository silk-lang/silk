name: Download Silk bootstrap compiler
description: Download a verified main compiler bundle without installing dependencies or building Silk.
inputs:
  repository:
    description: Repository that publishes the bootstrap artifact.
    default: ${{ github.repository }}
  token:
    description: Token with Actions read access to the publishing repository.
    default: ${{ github.token }}
  verification:
    description: >-
      Also download the selfhost verification harness from the same verified main run.
      Invoke with Node 24 from the consuming checkout. The default formatter mode requires
      RUNNER_TEMP, SILKC and SILK_BOOTSTRAP and formats/rebuilds the checkout.
      Use --mode corpus with SILKC to run exactly its live selfhost-track.json pins without
      formatting, rebuilding, SILK_BOOTSTRAP or node_modules; subset configuration is rejected.
      Use --mode corpus-full for the complete regular corpus with its versioned manifest,
      ordered outcomes and timings; pins remain required and other outcomes are observations.
    default: 'false'
  sha:
    description: Optional full main commit SHA to pin; otherwise selects the latest verified main run.
    default: ''
outputs:
  verification-path:
    description: Absolute path to selfhost-verification.mjs; supports --mode formatter (default), corpus and corpus-full.
    value: ${{ runner.temp }}/selfhost-verification/selfhost-verification.mjs
  path:
    description: Absolute path to silk.mjs; invoke with Node 24 or Bun.
    value: ${{ steps.select.outputs.path }}
  sha:
    description: Source commit SHA of the downloaded compiler.
    value: ${{ steps.select.outputs.sha }}
  run-id:
    description: CI run that published this verified compiler.
    value: ${{ steps.select.outputs.run-id }}
runs:
  using: composite
  steps:
    - name: Find the verified main artifact
      id: select
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BOOTSTRAP_REPOSITORY: ${{ inputs.repository }}
        BOOTSTRAP_SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        # Select by workflow run rather than upload time: rerunning an older main build must not
        # make it the latest compiler. Pagination keeps explicit SHA pins discoverable.
        {
          gh api --paginate --slurp "repos/$BOOTSTRAP_REPOSITORY/actions/artifacts?name=silk-bootstrap&per_page=100" |
            jq --arg sha "$BOOTSTRAP_SHA" -er '
              [.[].artifacts[] |
                select(.expired == false and .workflow_run.head_branch == "main") |
                select(.workflow_run.head_repository_id == .workflow_run.repository_id) |
                select($sha == "" or .workflow_run.head_sha == $sha)] |
              max_by([.workflow_run.id, .id]) // error("No retained verified Silk bootstrap artifact matches this selection") |
              "artifact-id=\(.id)\nsha=\(.workflow_run.head_sha)\nrun-id=\(.workflow_run.id)"
            '
          echo "path=$RUNNER_TEMP/silk-bootstrap/silk.mjs"
        } >> "$GITHUB_OUTPUT"
    - uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ steps.select.outputs.artifact-id }}
        repository: ${{ inputs.repository }}
        github-token: ${{ inputs.token }}
        run-id: ${{ steps.select.outputs.run-id }}
        path: ${{ runner.temp }}/silk-bootstrap
        merge-multiple: true
    - uses: actions/download-artifact@v4
      if: inputs.verification == 'true'
      with:
        name: silk-selfhost-verification
        repository: ${{ inputs.repository }}
        github-token: ${{ inputs.token }}
        run-id: ${{ steps.select.outputs.run-id }}
        path: ${{ runner.temp }}/selfhost-verification
