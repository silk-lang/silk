name: Windows native execution

# Separate, non-required Windows lane. Reuse a verified N1 without rebuilding the compiler.
on:
  workflow_call:
    inputs:
      source-run:
        description: Calling Selfhost run containing its verified N1
        type: string
        required: true
      source-sha:
        description: Exact authored revision, including the PR merge revision when applicable
        type: string
        required: true
      compiler-sha:
        description: Verified N1 source revision, including a same-tree run reused by Selfhost
        type: string
        required: true
  workflow_dispatch:
    inputs:
      source-run:
        description: Selfhost run containing a successful selfhost-native-n1 artifact
        type: string
        required: true
      changeset:
        description: Generate the Windows support release note with the native Silk tool
        type: boolean
        default: false
      replay-controls:
        description: Diagnose replay dependency counts against the pre-Windows baseline
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  cross:
    name: Cross-build with an existing N1
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      programs: ${{ steps.build.outcome }}
      compiler: ${{ steps.compiler.outcome }}
      tool: ${{ steps.tool.outcome }}
    steps:
      - name: Resolve the artifact source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source-run }}
          REPOSITORY: ${{ github.repository }}
          CALLER_SHA: ${{ inputs.source-sha }}
          COMPILER_SHA: ${{ inputs.compiler-sha }}
          TEST_SHA: ${{ inputs.source-sha || github.sha }}
          CURRENT_RUN: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN" > "$RUNNER_TEMP/source-run.json"
          test "$(jq -r .path "$RUNNER_TEMP/source-run.json")" = .github/workflows/selfhost.yml
          if [ -n "$CALLER_SHA" ]; then
            # Selfhost supplies its current N1 or the verified same-tree run chosen by reuse.
            # For PRs the compiler revision is the synthetic merge SHA, not the API head SHA.
            test "$CALLER_SHA" = "$CURRENT_SHA"
            [[ "$COMPILER_SHA" =~ ^[a-f0-9]{40}$ ]]
            if [ "$SOURCE_RUN" = "$CURRENT_RUN" ]; then test "$COMPILER_SHA" = "$CALLER_SHA"; fi
            compiler_sha=$COMPILER_SHA
          else
            # Standalone dispatch accepts a branch build whose run head identifies its inputs.
            # PR merge artifacts are consumed only through the bound reusable invocation.
            test "$(jq -r .event "$RUNNER_TEMP/source-run.json")" = workflow_dispatch
            compiler_sha=$(jq -er .head_sha "$RUNNER_TEMP/source-run.json")
          fi
          echo "compiler-sha=$compiler_sha" >> "$GITHUB_OUTPUT"
          echo "sha=$TEST_SHA" >> "$GITHUB_OUTPUT"
          echo "run=$SOURCE_RUN" >> "$GITHUB_OUTPUT"
          echo "Testing source $TEST_SHA with N1 built from $compiler_sha in run $SOURCE_RUN." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v6
      - name: Free runner space for the LLVM archive
        run: |
          # This isolated Linux cross-build uses neither the Android SDK nor the .NET SDK.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h .
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/windows-n1
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1-diagnostics
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/windows-n1-receipt
      - name: Verify N1 and its source revision
        id: verify
        env:
          SOURCE_SHA: ${{ steps.source.outputs.compiler-sha }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/windows-n1-receipt/build-receipt.json"
          test "$(jq -er .inputs.sourceCommit "$receipt")" = "$SOURCE_SHA"
          digest=$(jq -er .output.sha256 "$receipt")
          echo "$digest  $RUNNER_TEMP/windows-n1/N1" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/windows-n1/N1"
      - name: Cross-build and inspect the Windows executables
        id: build
        working-directory: source
        run: bash compiler/fixtures/windows-runtime/cross-build.sh "$RUNNER_TEMP/windows-n1/N1" "$RUNNER_TEMP/windows-programs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-no-crt-programs
          path: ${{ runner.temp }}/windows-programs/
          if-no-files-found: warn
      - name: Run host-independent Windows codecs and time conversions
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: source
        run: |
          set -euo pipefail
          for name in windows-host-codecs system-clock-make-carries-nanoseconds; do
            package="$RUNNER_TEMP/$name-package"
            mkdir -p "$package/src"
            cp "corpus/native/$name/main.silk" "$package/src/main.silk"
            printf '[package]\nname = "%s"\nversion = "0.0.0"\nsilk-version = "0.0.0"\n' "$name" > "$package/silk.toml"
            "$RUNNER_TEMP/windows-n1/N1" build "$package/src/main.silk" \
              -o "$RUNNER_TEMP/$name" --stdlib "$PWD/stdlib" --clang "$SILK_TEST_CLANG" \
              --optimization none --debug false
            "$RUNNER_TEMP/$name"
          done
      - name: Cross-build the Windows compiler
        id: compiler
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: source
        run: bash compiler/fixtures/windows-runtime/cross-host.sh "$RUNNER_TEMP/windows-n1/N1" "$RUNNER_TEMP/windows-compiler" compiler
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-compiler
          path: ${{ runner.temp }}/windows-compiler/
          if-no-files-found: warn
      - name: Cross-build the Windows Silk tool and mapped-image fixture
        id: tool
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: source
        run: bash compiler/fixtures/windows-runtime/cross-host.sh "$RUNNER_TEMP/windows-n1/N1" "$RUNNER_TEMP/windows-tool" tool
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tool
          path: ${{ runner.temp }}/windows-tool/
          if-no-files-found: warn
      - name: Generate the source revision's reference pages
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: source
        run: '"$RUNNER_TEMP/windows-n1/N1" doc-reference --stdlib-root "$PWD/stdlib" --output "$RUNNER_TEMP/windows-reference"'
      - name: Generate the Windows support changeset with Silk
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && inputs.changeset }}
        working-directory: source
        run: |
          set -euo pipefail
          (cd tool && "$RUNNER_TEMP/windows-n1/N1" build src/main.silk \
            -o "$RUNNER_TEMP/windows-silk-tool" --stdlib "$GITHUB_WORKSPACE/source/stdlib" --clang "$SILK_TEST_CLANG")
          "$RUNNER_TEMP/windows-silk-tool" change --dir "$PWD/compiler" minor \
            "Add the Windows x86_64 target, no-CRT runtime, and native filesystem, process, and thread providers."
          mkdir -p "$RUNNER_TEMP/windows-changeset"
          git ls-files --others --exclude-standard compiler/.changes/ | while IFS= read -r note; do
            cp "$note" "$RUNNER_TEMP/windows-changeset/"
          done
      - uses: actions/upload-artifact@v4
        if: always() && inputs.changeset
        with:
          name: windows-generated-changeset
          path: ${{ runner.temp }}/windows-changeset/
          if-no-files-found: error
      - name: Check the Win64 ABI against the Clang oracle
        if: ${{ !cancelled() && steps.verify.outcome == 'success' }}
        working-directory: source
        run: |
          "$RUNNER_TEMP/windows-n1/N1" test compiler/src/semantic/SemanticLoweringCases.silk \
            -o "$RUNNER_TEMP/windows-abi-tests" --stdlib "$PWD/stdlib" --filter win64 --no-cache
      - name: Isolate the source revision's replay dependencies
        if: ${{ !cancelled() && steps.verify.outcome == 'success' && inputs.replay-controls }}
        working-directory: source
        run: |
          baseline=97f009270c31c0a14cdbbe6b407a3d8b26eacbdc
          git fetch --depth=1 origin "$baseline"
          bash compiler/fixtures/windows-runtime/replay-controls.sh "$RUNNER_TEMP/windows-n1/N1" \
            "$RUNNER_TEMP/windows-replay-controls" "$baseline"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-generated-reference
          path: ${{ runner.temp }}/windows-reference/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always() && inputs.replay-controls
        with:
          name: windows-replay-controls
          path: |
            ${{ runner.temp }}/windows-replay-controls/*.log
            ${{ runner.temp }}/windows-replay-controls/*commit.txt
          if-no-files-found: warn

  compiler-native:
    name: Run the cross-built compiler on Windows
    needs: cross
    if: ${{ !cancelled() && needs.cross.outputs.compiler == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.cross.outputs.sha }}
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: windows-compiler
          path: ${{ runner.temp }}/windows-compiler
      - name: Check the production floating remainder against Windows math
        shell: pwsh
        run: |
          & compiler/fixtures/windows-runtime/remainder-proof.ps1 `
            -LlvmBin (Split-Path -Parent $env:SILK_TEST_CLANG) `
            -OutputDirectory "$env:RUNNER_TEMP/windows-compiler-native/remainder"
      - name: Build hello and verify the native compiler fixpoint
        shell: pwsh
        run: |
          & compiler/fixtures/windows-runtime/run-compiler.ps1 `
            -Compiler "$env:RUNNER_TEMP/windows-compiler/silk.exe" `
            -OutputDirectory "$env:RUNNER_TEMP/windows-compiler-native" `
            -SelfHost `
            -LlvmBin (Split-Path -Parent $env:SILK_TEST_CLANG)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-compiler-native
          path: |
            ${{ runner.temp }}/windows-compiler-native/*.txt
            ${{ runner.temp }}/windows-compiler-native/*.json
            ${{ runner.temp }}/windows-compiler-native/remainder/*.json
            ${{ runner.temp }}/windows-compiler-native/remainder/*.txt
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-n2
          path: ${{ runner.temp }}/windows-compiler-native/N2.exe
          if-no-files-found: warn

  native-corpus:
    name: Run the shared corpus with native Windows N2
    needs: [cross, compiler-native]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.cross.outputs.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-n2
          path: ${{ runner.temp }}/windows-n2
      - name: Run every native and rejection scenario, retaining unsupported outcomes
        shell: pwsh
        run: |
          node .github/scripts/bundle-selfhost-verification.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Corpus harness build failed' }
          $env:SILK_COMPILER = "$env:RUNNER_TEMP/windows-n2/N2.exe"
          $env:SILK_CLANG = $env:SILK_TEST_CLANG
          node .scratch/selfhost-verification.mjs --mode corpus-full 2>&1 | Tee-Object -FilePath .scratch/windows-corpus.log
          if ($LASTEXITCODE -ne 0) { throw 'Windows corpus verification failed; inspect windows-corpus.log' }
      - name: Require every classified corpus case to have no failure
        shell: pwsh
        run: |
          $lines = Get-Content -LiteralPath .scratch/windows-corpus.log
          $failures = @($lines | Where-Object { $_ -cmatch '^FAIL ' })
          if ($failures.Count -gt 0) { throw "Corpus failures:`n$($failures -join "`n")" }
          if ($lines | Where-Object { $_ -cmatch '(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)' }) {
            throw 'Corpus has a runtime mismatch, runner failure, or module-source gap'
          }
          $timings = @($lines | Where-Object { $_ -cmatch '^SELFHOST_CASE_TIMING=' })
          $outcomes = @($lines | Where-Object { $_ -cmatch '^(?:PASS|FAIL|UNSUPPORTED) ' })
          if ($timings.Count -ne $outcomes.Count -or $outcomes.Count -eq 0) { throw 'Incomplete corpus timing receipt' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-corpus-results
          path: .scratch/windows-corpus.log
          if-no-files-found: error

  native-tool:
    name: Run Windows tool commands and mapped-image publication
    needs: cross
    if: ${{ !cancelled() && needs.cross.outputs.tool == 'success' && needs.cross.outputs.compiler == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.cross.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: windows-tool
          path: ${{ runner.temp }}/windows-tool
      - uses: actions/download-artifact@v4
        with:
          name: windows-compiler
          path: ${{ runner.temp }}/windows-compiler
      - name: Exercise the actual Windows tool
        shell: pwsh
        run: |
          & compiler/fixtures/windows-runtime/run-tool.ps1 -ToolDirectory "$env:RUNNER_TEMP/windows-tool" `
            -Compiler "$env:RUNNER_TEMP/windows-compiler/silk.exe" -OutputDirectory "$env:RUNNER_TEMP/windows-tool-results"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-tool-results
          path: |
            ${{ runner.temp }}/windows-tool-results/*.json
            ${{ runner.temp }}/windows-tool-results/*.txt
          if-no-files-found: warn

  native:
    name: Execute cross-built Silk on Windows
    needs: cross
    if: ${{ !cancelled() && needs.cross.outputs.programs == 'success' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.cross.outputs.sha }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: windows-no-crt-programs
          path: ${{ runner.temp }}/windows-programs
      - name: Check the artifact revision and run the Silk programs
        shell: pwsh
        working-directory: source
        env:
          SOURCE_SHA: ${{ needs.cross.outputs.sha }}
        run: |
          $programs = Join-Path $env:RUNNER_TEMP 'windows-programs'
          $revision = (Get-Content -Raw -LiteralPath (Join-Path $programs 'source-commit.txt')).Trim()
          if ($revision -ne $env:SOURCE_SHA) { throw 'Cross-build source revision mismatch' }
          $llvm = Split-Path -Parent $env:SILK_TEST_CLANG
          & compiler/fixtures/windows-runtime/run.ps1 -ArtifactDirectory $programs -LlvmBin $llvm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-results
          path: |
            ${{ runner.temp }}/windows-programs/*results.json
            ${{ runner.temp }}/windows-programs/*native-pe.txt
            ${{ runner.temp }}/windows-programs/*-native/*.json
            ${{ runner.temp }}/windows-programs/*-native/*.txt
            ${{ runner.temp }}/windows-programs/source-commit.txt
          if-no-files-found: warn
