name: Windows native execution

# Separate, non-required Windows lane. Consume one cross-build without rebuilding N1.
on:
  workflow_dispatch:
    inputs:
      source-run:
        description: Selfhost run containing windows-no-crt-programs
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  native:
    name: Execute cross-built Silk on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Resolve the artifact source
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source-run }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:SOURCE_RUN -notmatch '^[0-9]+$') { throw 'source-run must be a workflow run id' }
          $raw = gh api "repos/$env:REPOSITORY/actions/runs/$env:SOURCE_RUN"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the source workflow run' }
          $run = ($raw -join "`n") | ConvertFrom-Json
          if ($run.path -ne '.github/workflows/selfhost.yml') { throw 'The source must be a Selfhost run' }
          "sha=$($run.head_sha)" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: windows-no-crt-programs
          run-id: ${{ inputs.source-run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/windows-programs
      - name: Check the artifact revision and run the Silk programs
        shell: pwsh
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          $programs = Join-Path $env:RUNNER_TEMP 'windows-programs'
          $revision = (Get-Content -Raw -LiteralPath (Join-Path $programs 'source-commit.txt')).Trim()
          if ($revision -ne $env:SOURCE_SHA) { throw 'Cross-build source revision mismatch' }
          $llvm = Split-Path -Parent $env:SILK_TEST_CLANG
          & compiler/fixtures/windows-runtime/run.ps1 -ArtifactDirectory $programs -LlvmBin $llvm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-native-results
          path: |
            ${{ runner.temp }}/windows-programs/*results.json
            ${{ runner.temp }}/windows-programs/*native-pe.txt
            ${{ runner.temp }}/windows-programs/*-native/*.json
            ${{ runner.temp }}/windows-programs/*-native/*.txt
            ${{ runner.temp }}/windows-programs/source-commit.txt
          if-no-files-found: warn
