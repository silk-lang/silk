name: Bootstrap

# The TypeScript bootstrap is frozen: it only has to compile the anchored first native compiler
# (bootstrap/anchor.json), and the native compiler builds itself from there. Like n0, it is only
# touched in an emergency, so this workflow runs on a manual dispatch alone.
#
# n0 is the anchor's compiler built from the bootstrap: the bundle builds T1, T1 emits the anchor
# compiler's IR for every target, each target links that IR into N1, and N1 builds n0. N1 and n0
# must emit T1's IR byte for byte. Once n0 is published, every run must rebuild its exact bytes.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the bootstrap and n0 releases (main only)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Preserve the original frozen n0 identity while giving future bootstrap publications their own namespace.
  FROZEN_N0_RELEASE: v0.1.0-dev.8624+5081812

jobs:
  bootstrap:
    name: Bundle the bootstrap and emit the anchor compiler's IR
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      anchor: ${{ steps.release.outputs.anchor }}
      version: ${{ steps.t1.outputs.version }}
      bootstrap-version: ${{ steps.release.outputs.bootstrap-version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for stage receipts
        run: sudo apt-get install -y time
      - run: pnpm bundle:bootstrap
      - run: node bootstrap/packages/cli/scripts/test-bundle.mjs node --native
      - run: node bootstrap/packages/cli/scripts/test-bundle.mjs bun --native
      - name: Read the frozen bootstrap anchor
        id: release
        run: |
          set -euo pipefail
          anchor=$(jq -er .commit bootstrap/anchor.json)
          # The anchor must stay reachable from main, or nothing keeps its commit alive.
          git merge-base --is-ancestor "$anchor" HEAD
          {
            echo "anchor=$anchor"
            echo "bootstrap-version=$(jq -er .version bootstrap/packages/cli/package.json)"
          } | tee -a "$GITHUB_OUTPUT"
      - name: Build T1 with the bootstrap and emit the anchor compiler's IR for every target
        id: t1
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
          NODE_OPTIONS: --max-old-space-size=12288
          ANCHOR: ${{ steps.release.outputs.anchor }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/t1"
          mkdir -p "$out/ir"
          stage() {
            local name="$1"
            shift
            /usr/bin/time -f '%e %M' -o "$out/$name-time.txt" "$@" > "$out/$name.log" 2>&1 || {
              tail -n 60 "$out/$name.log"
              echo "::error title=Bootstrap stage $name failed::See the bootstrap-t1 artifact."
              exit 1
            }
          }
          bootstrap="$PWD/bootstrap/packages/cli/dist/silk.mjs"
          anchor="$RUNNER_TEMP/anchor"
          git worktree add --detach "$anchor" "$ANCHOR"
          cd "$anchor/compiler"
          stage t1 node "$bootstrap" build --manifest-path silk.toml --release --target x86_64-unknown-linux-gnu
          t1="$(find "$anchor/compiler/build/llvm/x86_64-unknown-linux-gnu" -type f -name 'silk-compiler*' -perm -u+x | head -n 1)"
          [ -n "$t1" ] || { echo "::error title=T1 missing::The bootstrap build produced no compiler executable."; exit 1; }
          version=$("$t1" --version)
          echo "version=${version#silk v}" >> "$GITHUB_OUTPUT"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            stage "ir-$target" "$t1" build src/main.silk -o "$out/ir/$target.ll" --emit llvm-ir --target "$target" \
              --stdlib ../packages/compiler/stdlib --optimization speed --debug false
          done
          sha256sum "$out"/ir/*.ll
      - name: Preserve the T1 logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-t1
          path: |
            ${{ runner.temp }}/t1/*.log
            ${{ runner.temp }}/t1/*.txt
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-anchor-ir
          path: ${{ runner.temp }}/t1/ir/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-${{ github.sha }}
          path: bootstrap/packages/cli/dist/silk.mjs
          if-no-files-found: error
          retention-days: 7

  n0:
    name: Build n0 / ${{ matrix.target }}
    needs: bootstrap
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      ANCHOR: ${{ needs.bootstrap.outputs.anchor }}
      VERSION: ${{ needs.bootstrap.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-anchor-ir
          path: ${{ runner.temp }}/ir
      - name: Link N1 from T1's IR, build n0 with it, and compare their compiler IR
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/n0"
          mkdir -p "$out"
          anchor="$RUNNER_TEMP/anchor"
          git worktree add --detach "$anchor" "$ANCHOR"
          # Relative paths keep the emitted IR independent of where each runner checks out the anchor.
          args=(--stdlib ../packages/compiler/stdlib --optimization speed --debug false)
          stage() {
            local name="$1"
            shift
            "$@" > "$out/$name.log" 2>&1 || {
              tail -n 60 "$out/$name.log"
              echo "::error title=n0 stage $name failed::See the bootstrap-n0 artifact."
              exit 1
            }
          }
          stage n1 "$SILK_CLANG" -O2 -x ir "$RUNNER_TEMP/ir/$TARGET.ll" -x none -o "$out/N1" -lc -lm
          chmod 0555 "$out/N1"
          cd "$anchor/compiler"
          stage n0 "$out/N1" build src/main.silk -o "$out/n0" "${args[@]}"
          chmod 0555 "$out/n0"
          stage n1-ir "$out/N1" build src/main.silk -o "$out/n1.ll" --emit llvm-ir "${args[@]}"
          stage n0-ir "$out/n0" build src/main.silk -o "$out/n0.ll" --emit llvm-ir "${args[@]}"
          cmp "$RUNNER_TEMP/ir/$TARGET.ll" "$out/n1.ll"
          cmp "$out/n1.ll" "$out/n0.ll"
          ir=$(shasum -a 256 "$out/n0.ll" | cut -d' ' -f1)
          jq -n --arg target "$TARGET" --arg source "$ANCHOR" \
            --arg n1 "$(shasum -a 256 "$out/N1" | cut -d' ' -f1)" \
            --arg n0 "$(shasum -a 256 "$out/n0" | cut -d' ' -f1)" --arg ir "$ir" \
            '{status: "passed", target: $target, inputs: {sourceCommit: $source}, origin: "bootstrap-T1-IR",
              producer: {generation: "N1", sha256: $n1}, output: {generation: "n0", sha256: $n0},
              fixpoint: {producerIrSha256: $ir, outputIrSha256: $ir}}' | tee "$out/chain-receipt.json"
      # n0 becomes the pinned seed, so it must build the compiler of this checkout.
      - name: n0 builds this checkout's compiler
        run: |
          set -euo pipefail
          cd compiler
          "$RUNNER_TEMP/n0/n0" build src/main.silk -o "$RUNNER_TEMP/n0/next" --stdlib ../stdlib \
            --optimization speed --debug false > "$RUNNER_TEMP/n0/next.log" 2>&1 || {
            tail -n 60 "$RUNNER_TEMP/n0/next.log"
            echo "::error title=n0 cannot build this checkout::Pinning n0 would break the native chain."
            exit 1
          }
          "$RUNNER_TEMP/n0/next" --version
      - name: Package the release archive and run a new project from it
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release" "$RUNNER_TEMP/installed"
          archive=$(node compiler/scripts/ReleaseArchive.ts --compiler "$RUNNER_TEMP/n0/n0" \
            --stdlib "$RUNNER_TEMP/anchor/packages/compiler/stdlib" --target "$TARGET" --version "$VERSION" \
            --output "$RUNNER_TEMP/release")
          tar -xzf "$archive" -C "$RUNNER_TEMP/installed"
          silk=$(echo "$RUNNER_TEMP"/installed/silk-*/bin/silk)
          test "$("$silk" --version)" = "silk v$VERSION"
          cd "$RUNNER_TEMP/installed"
          env -u SILK_CLANG -u SDKROOT "$silk" init hello
          # `run` reports the build on standard output before the program's own output.
          output=$(cd hello && env -u SILK_CLANG -u SDKROOT "$silk" run)
          printf '%s\n' "$output" | head -n 1 | grep -q '^Compiled src/main.silk -> '
          test "$(printf '%s\n' "$output" | tail -n 1)" = 'Hello, world!'
      - name: Prepare the n0 seed candidate
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/n0/n0" "$RUNNER_TEMP/candidate/silk-compiler-$TARGET"
          cp "$RUNNER_TEMP/n0/chain-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt-$TARGET.json"
          cp "$RUNNER_TEMP"/release/*.tar.gz "$RUNNER_TEMP/candidate/"
          node compiler/scripts/NativeSeed.mjs candidate "$RUNNER_TEMP/n0/chain-receipt.json" "$GITHUB_RUN_ID" "bootstrap-native-v$VERSION" \
            > "$RUNNER_TEMP/candidate/native-seed-$TARGET.json"
      # Once n0 is published, the bootstrap must still produce its exact bytes.
      - name: Rebuild the published n0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          built=$(jq -er .output.sha256 "$RUNNER_TEMP/n0/chain-receipt.json")
          for tag in "$FROZEN_N0_RELEASE" "bootstrap-native-v$VERSION"; do
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              test "$tag" != "$FROZEN_N0_RELEASE"
              echo "### $TARGET: $tag is not published yet" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            directory="$RUNNER_TEMP/published-$tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern native-seed.json --dir "$directory"
            published=$(jq -er --arg target "$TARGET" '.seeds[$target].sha256' "$directory/native-seed.json")
            test "$(jq -er --arg target "$TARGET" '.seeds[$target].sourceCommit' "$directory/native-seed.json")" = "$ANCHOR"
            if [ "$built" != "$published" ]; then
              echo "::error title=n0 is not reproducible::The bootstrap built n0 with SHA-256 $built, but $tag publishes $published."
              exit 1
            fi
            echo "### $TARGET: rebuilt the published $tag byte for byte" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-n0-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the n0 receipt, logs, and IR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-n0-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/n0/*.json
            ${{ runner.temp }}/n0/*.log
            ${{ runner.temp }}/n0/*.ll
          if-no-files-found: ignore
          retention-days: 7

  # A manual dispatch of main with `publish` set publishes the bundle as `bootstrap-v<version>` and
  # n0 as `bootstrap-native-v<version>`. Neither is a compiler release or a history baseline.
  # silk.mjs runs with Node 24 or Bun and needs no checkout, dependencies or build.
  publish:
    name: Publish the bootstrap and n0 releases
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [bootstrap, n0]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      ANCHOR: ${{ needs.bootstrap.outputs.anchor }}
      VERSION: ${{ needs.bootstrap.outputs.version }}
      BOOTSTRAP_VERSION: ${{ needs.bootstrap.outputs.bootstrap-version }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-${{ github.sha }}
          path: ${{ runner.temp }}/bootstrap
      - uses: actions/download-artifact@v4
        with:
          pattern: bootstrap-n0-candidate-*
          path: ${{ runner.temp }}/n0
          merge-multiple: true
      - name: Publish the bootstrap
        working-directory: ${{ runner.temp }}/bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bootstrap-v$BOOTSTRAP_VERSION"
          sha256sum silk.mjs > silk.mjs.sha256
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published
            cmp silk.mjs published/silk.mjs
            echo "Release $tag already holds this bundle"
          else
            gh release create "$tag" silk.mjs silk.mjs.sha256 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Bootstrap $BOOTSTRAP_VERSION" \
              --notes "The frozen TypeScript bootstrap compiler, bundled from main $GITHUB_SHA. Run it with Node 24 or Bun: \`node silk.mjs --help\`. Its only job is to build n0, the anchor commit $ANCHOR's compiler, released as bootstrap-native-v$VERSION; the native compiler builds itself from there."
          fi
      - name: Publish n0
        working-directory: ${{ runner.temp }}/n0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="bootstrap-native-v$VERSION"
          jq -s '{schemaVersion: 2, seeds: (map(.seeds) | add)}' native-seed-*.json > native-seed.json
          rm native-seed-*.json
          files=(native-seed.json)
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            asset="silk-compiler-$target"
            receipt="chain-receipt-$target.json"
            node "$GITHUB_WORKSPACE/compiler/scripts/NativeSeed.mjs" outputs native-seed.json "$target" > /dev/null
            test "$(jq -er --arg target "$target" '.seeds[$target].tag' native-seed.json)" = "$tag"
            test "$(jq -er --arg target "$target" '.seeds[$target].sourceCommit' native-seed.json)" = "$ANCHOR"
            sha=$(jq -er --arg target "$target" '.seeds[$target].sha256' native-seed.json)
            echo "$sha  $asset" | sha256sum -c -
            test "$sha" = "$(jq -er .output.sha256 "$receipt")"
            archives=(silk-*-"$target".tar.gz)
            test "${#archives[@]}" = 1 && test -f "${archives[0]}"
            test "$(tar -xzOf "${archives[0]}" "${archives[0]%.tar.gz}/bin/silk" | sha256sum | cut -d' ' -f1)" = "$sha"
            files+=("$asset" "$receipt" "${archives[0]}")
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
              cmp "silk-compiler-$target" "published/silk-compiler-$target"
              for archive in silk-*-"$target".tar.gz; do cmp "$archive" "published/$archive"; done
            done
            echo "Release $tag already holds these compilers"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$ANCHOR" \
              --prerelease --latest=false --title "Native bootstrap $VERSION (n0)" \
              --notes "n0, the first native Silk compiler: the anchor commit $ANCHOR's compiler, built from bootstrap-v$BOOTSTRAP_VERSION for x86-64 Linux, ARM64 Linux, and macOS arm64 (run $GITHUB_RUN_ID). The bootstrap builds T1, T1 emits the compiler's IR, and N1 linked from that IR builds n0; all three emit identical compiler IR. To install one, extract its silk-<version>-<target>.tar.gz, which holds bin/silk and the standard library it finds at lib/silk/stdlib. To pin them, commit native-seed.json as compiler/native-seed.json."
          fi
          {
            echo "### Releases"
            echo "Bootstrap: \`bootstrap-v$BOOTSTRAP_VERSION\`, n0: \`$tag\`"
            echo '```json'
            cat native-seed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
