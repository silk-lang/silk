name: Windows release chain

on:
  workflow_call:
    inputs:
      n1-sha256:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  SILK_VERIFY_MIR: '1'

jobs:
  cross:
    name: Cross-build Windows from the verified Linux N1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - name: Cross-build from the exact immutable inputs
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          echo "$N1_SHA256  $RUNNER_TEMP/n1/N1" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/n1/N1"
          mkdir "$RUNNER_TEMP/windows-cross"
          (cd "$RUNNER_TEMP/authored-inputs/compiler" && "$RUNNER_TEMP/n1/N1" build src/main.silk \
            -o "$RUNNER_TEMP/windows-cross/W1.exe" --target x86_64-pc-windows-msvc \
            --stdlib ../stdlib --clang "$SILK_TEST_CLANG" --optimization speed --debug false)
          node compiler/scripts/SourceSnapshot.mjs verify "$RUNNER_TEMP/authored-inputs" > /dev/null
          jq -n --arg producer "$N1_SHA256" --arg output "$(sha256sum "$RUNNER_TEMP/windows-cross/W1.exe" | cut -d' ' -f1)" \
            '{producer: $producer, output: $output}' > "$RUNNER_TEMP/windows-cross/cross-producer.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-cross
          path: ${{ runner.temp }}/windows-cross/
          if-no-files-found: error
          retention-days: 7

  native:
    name: Windows native release fixpoint
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: windows-release-cross
          path: ${{ runner.temp }}/windows-cross
      - name: Verify the native chain and build its tool
        shell: pwsh
        run: |
          node compiler/scripts/SourceSnapshot.mjs restore "$env:RUNNER_TEMP/build-inputs" "$env:RUNNER_TEMP/authored-inputs" > $null
          if ($LASTEXITCODE -ne 0) { throw 'Input snapshot restore failed' }
          & .github/scripts/windows-release.ps1 -ProducerDirectory "$env:RUNNER_TEMP/windows-cross" `
            -Snapshot "$env:RUNNER_TEMP/authored-inputs" -OutputDirectory "$env:RUNNER_TEMP/windows-native"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-release
          path: |
            ${{ runner.temp }}/windows-native/N2.exe
            ${{ runner.temp }}/windows-native/silk.exe
            ${{ runner.temp }}/windows-native/version.txt
            ${{ runner.temp }}/windows-native/chain-receipt.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-diagnostics
          path: |
            ${{ runner.temp }}/windows-native/*.json
            ${{ runner.temp }}/windows-native/*.txt
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package the verified Windows ZIP on Linux
    needs: native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-release
          path: ${{ runner.temp }}/windows-native
      - name: Package ZIP and stage the per-target candidate
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          out="$RUNNER_TEMP/windows-native"
          version=$(tr -d '\r\n' < "$out/version.txt")
          mkdir "$RUNNER_TEMP/release" "$RUNNER_TEMP/candidate"
          args=(--compiler "$out/N2.exe" --tool "$out/silk.exe" --stdlib "$RUNNER_TEMP/authored-inputs/stdlib"
            --target x86_64-pc-windows-msvc --version "$version" --output "$RUNNER_TEMP/release")
          if [ -f "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml" ]; then
            args+=(--snapshot "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml")
          fi
          node compiler/scripts/ReleaseArchive.ts "${args[@]}"
          cp "$out/N2.exe" "$RUNNER_TEMP/candidate/silk-compiler-x86_64-pc-windows-msvc.exe"
          cp "$out/chain-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt-x86_64-pc-windows-msvc.json"
          node compiler/scripts/NativeSeed.mjs candidate "$out/chain-receipt.json" "$GITHUB_RUN_ID" "v$version" \
            > "$RUNNER_TEMP/candidate/native-seed-x86_64-pc-windows-msvc.json"
      - uses: actions/upload-artifact@v4
        with:
          name: silk-release-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: Run a new project from the Windows ZIP
    needs: package
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Check installer release selection in PowerShell 7
        shell: pwsh
        run: '& .github/scripts/test-windows-installer-selection.ps1'
      - name: Check installer release selection in Windows PowerShell
        shell: powershell
        run: '& .github/scripts/test-windows-installer-selection.ps1'
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/windows-release
      - shell: pwsh
        run: |
          $archives = @(Get-ChildItem "$env:RUNNER_TEMP/windows-release" -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected one Windows release ZIP' }
          & .github/scripts/smoke-release-archive.ps1 -Archive $archives[0].FullName -OutputDirectory "$env:RUNNER_TEMP/installed"
          & .github/scripts/test-windows-installer.ps1 -Archive $archives[0].FullName -OutputDirectory "$env:RUNNER_TEMP/installer-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-results
          path: ${{ runner.temp }}/installer-tests/results.json
          if-no-files-found: warn
