name: CI

on:
  push:
    branches:
      - main
  # Only pull requests into main run CI. A stack's upper PRs target another branch; the stack is
  # checked once, by the pull request that lands its top into main.
  pull_request:
    branches:
      - main
  merge_group:
  schedule:
    - cron: '17 4 * * 1-5'
  workflow_dispatch:
    inputs:
      full_verification:
        description: Run the exact-head full verification lane
        required: true
        type: boolean
        default: false
      expected_sha:
        description: Exact workflow head authorized for manual verification
        required: true
        type: string

permissions:
  contents: read
  actions: read

# A newer pull_request run of the same PR cancels the older one; push, merge_group, schedule and
# workflow_dispatch runs each keep a unique group, so they are never cancelled by it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The merge queue runs the main lanes below on the exact commit it then fast-forwards main to. A
  # main push of that commit reuses the green merge-group run instead of running them again: it
  # publishes that run's bootstrap and runs only validate. Any other run checks every lane its event
  # selects.
  reuse:
    name: Reuse the merge queue run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      reused: ${{ steps.find.outputs.reused }}
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find the green merge-group run of this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          id=
          if [ "$EVENT" = push ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=merge_group&head_sha=$GITHUB_SHA&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty') || id=
          fi
          if [ -z "$id" ]; then
            echo "reused=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "reused=true"
            echo "run-id=$id"
          } >> "$GITHUB_OUTPUT"
          printf '### Reused the merge queue run\nRun [%s](%s) checked this commit `%s`; this push publishes its bootstrap.\n' \
            "$id" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  bundled-cli:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-bundle
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm bundle:cli
      # Inventory mode consumes SILK_INVENTORY_REQUEST as a versioned immutable request file.
      # Full compiler capture records its explicit heap setup separately (currently 8GiB);
      # these isolated small-source checks do not claim full inventory/native readiness.
      - name: Check standalone formatter, corpus and inventory verification modes
        run: |
          pnpm --filter @silklang/compiler exec tsx --test ../../compiler/scripts/runSelfhostCorpus.test.ts
          pnpm --filter @silklang/compiler exec vitest run --root ../.. --config packages/compiler/vitest.config.ts compiler/scripts/BootstrapClosureInventory.test.ts --maxWorkers=1
          node .github/scripts/bundle-selfhost-verification.mjs
          node .github/scripts/test-selfhost-verification.mjs
      - run: node packages/cli/scripts/test-bundle.mjs node --native
      - run: node packages/cli/scripts/test-bundle.mjs bun --native
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-cli-${{ github.sha }}
          path: packages/cli/dist/silk.mjs
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  bundled-cli-arm64:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Bundled CLI / ARM64 Linux
    needs: bundled-cli
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-cli-${{ github.sha }}
          path: packages/cli/dist
      - run: node packages/cli/scripts/test-bundle.mjs node --native

  publish-bootstrap:
    # Distribution is checked by the isolated Node/Bun bundle smoke, including native builds, in
    # this run or in the merge-group run it reuses. Other repository checks still report failures
    # without suppressing this CI input.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && (needs.reuse.outputs.reused == 'true'
      || (needs.bundled-cli.result == 'success' && needs.bundled-cli-arm64.result == 'success'))
    needs: [reuse, bundled-cli, bundled-cli-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused != 'true'
        with:
          name: bootstrap-cli-${{ github.sha }}
          path: bootstrap
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused == 'true'
        with:
          name: bootstrap-cli-${{ github.sha }}
          path: bootstrap
          run-id: ${{ needs.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      # Publish the compiler checked for this exact commit after its isolated checks succeed.
      - uses: actions/upload-artifact@v4
        with:
          name: silk-bootstrap
          path: bootstrap/silk.mjs
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  # Spike (openspec/changes/spike-ci-test-sharding): the compiler vitest payload runs in the
  # compiler-tests matrix below; validate keeps everything else `pnpm check` ran.
  # Validate also runs on a main push that reuses the merge queue run. Caches saved by a merge-group
  # run belong to the queue's temporary branch, so this run keeps main's pnpm store and Turbo cache
  # current for pull requests and the queue.
  validate:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Cache keys end in github.sha so every run saves a fresh cache; restore-keys
      # fall back to the newest cache whose lockfile/config hash still matches.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node scripts/turbo.mjs run build
      # Oxlint resolves public workspace subpaths through their emitted declaration files.
      - run: pnpm lint
      - run: node scripts/turbo.mjs run typecheck
      # Heavy compiler consumers have dedicated runners below. The remaining suites finish in
      # roughly the time it takes the docs app to build.
      - run: >
          node scripts/turbo.mjs run test
          --filter='!@silklang/compiler'
          --filter='!@silklang/lsp'
          --filter='!@silklang/cli'
      - run: pnpm test:scripts
      - name: Check native generation receipt and verified tool contracts
        uses: ./.github/actions/check-native-contracts
      - name: Type-check native generation contracts
        run: |
          pnpm --filter @silklang/compiler exec tsc --ignoreConfig --noEmit --strict --exactOptionalPropertyTypes --skipLibCheck --allowImportingTsExtensions --allowJs --module nodenext --target es2022 --typeRoots node_modules/@types --types node ../../compiler/scripts/NativeBuild.ts ../../compiler/scripts/NativeProcess.ts

  package-tests:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Package tests / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lsp
            package: '@silklang/lsp'
            llvm: false
          - name: cli
            package: '@silklang/cli'
            llvm: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-${{ matrix.name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - uses: ./.github/actions/setup-linux-llvm
        if: matrix.llvm
      - run: pnpm install --frozen-lockfile
      # These compiler consumers exceeded their 60 s assertion deadlines while competing with
      # another test file. Preserve every test and give each file the dedicated runner.
      - run: node scripts/turbo.mjs run build --filter=${{ matrix.package }}...
      - run: pnpm --filter ${{ matrix.package }} exec vitest run --passWithNoTests --maxWorkers=1
        env:
          # The LSP worker reached the default V8 heap limit after 150 passing tests.
          NODE_OPTIONS: ${{ matrix.name == 'lsp' && '--max-old-space-size=6144' || '' }}

  compiler-documentation:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Each independent check gets the existing bound; generation must not consume doctest time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [check, examples]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-documentation-${{ matrix.check }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/cli... run build
      # Generation and maintained policy still share one project-analysis pass in the check leg.
      # Six profile analyses each carry the lowered authored stdlib; the default heap is marginal.
      - run: pnpm --filter @silklang/compiler run documentation:${{ matrix.check }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Pull requests run a representative compile/link/execute smoke set, including one portable Wasm
  # case so the LLVM-to-Wasm leg under the shared host-resolved toolchain stays covered. The bounded
  # TLS witnesses use separate processes so their realized compiler graphs do not accumulate in one
  # V8 heap.
  # The merge queue and main keep the complete corpus, split by SILK_NATIVE_SHARD because every case
  # lives in one Vitest file.
  native-acceptance:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Native acceptance / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # Cold source-runtime corpus shards exceed 30 minutes, including toolchain/build setup.
    # Each test still enforces its own bounded compile/run deadline.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"smoke","cases":"trivial-features,scalar-reference-argument-order,effect-ensuring-outcomes-and-order,suspension-native-depth-and-unit-retry,foreign-c-layout-clock,scheduler-fiber-semantics,independent-execution-finalized-destroy,bounded-byte-duplex,certificate-profile-and-trust-anchor,tls-record,certificate-path-validation,owned-trust-snapshots,checked-conversion-pointer-width-wasm"},{"name":"tls-connection","cases":"authenticated-tls-connection"},{"name":"tls-client-driving","cases":"authenticated-tls-client-core,authenticated-tls-client-demand-request,authenticated-tls-client-key-update"},{"name":"tls-client-policy","cases":"authenticated-tls-client-closure-control,authenticated-tls-client-handshake-policy,authenticated-tls-client-resource-policy"}]' || '[{"name":"1-of-3","shard":"1/3"},{"name":"2-of-3","shard":"2/3"},{"name":"3-of-3","shard":"3/3"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      # Distinct per-shard keys avoid same-key save races; each shard restores its own newest
      # archive first (the one holding its cases' artifacts), then any native cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-na-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            silk-native-${{ runner.os }}-na-${{ matrix.name }}-
            silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # The corpus imports the CLI sources; the docs site builds only in validate.
      - run: node scripts/turbo.mjs run build --filter=@silklang/cli...
      - run: pnpm --filter @silklang/compiler run test:native-acceptance
        env:
          # The bounded TLS programs peak just above V8's default ~4 GiB old-space limit. Keep the
          # extra headroom scoped to their fresh-process jobs; the ordinary smoke lane stays at the
          # default so it continues to expose unrelated regressions.
          NODE_OPTIONS: ${{ startsWith(matrix.name, 'tls-') && '--max-old-space-size=6144' || '' }}
          SILK_NATIVE_SHARD: ${{ matrix.shard }}
          SILK_NATIVE_CORPUS_CASES: ${{ matrix.cases }}
          SILK_NATIVE_FIXED_TESTS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

  compiler-tests:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      # Compiler tests import the compiler, docgen, and CLI outputs; docs build only in validate.
      - run: node scripts/turbo.mjs run build --filter=@silklang/cli...
      # Select each file once by reviewed CI timings; the selector assigns new files a median cost.
      # Vitest treats positional file filters as substrings, so exclude every unassigned path
      # exactly. Invoke vitest directly because `pnpm --filter … run script -- args` drops the args.
      - run: |
          compiler_excludes=$(node scripts/compiler-shards.mjs --exclude-for-shard=${{ matrix.shard }}/4)
          readarray -t compiler_excludes <<< "$compiler_excludes"
          pnpm --filter @silklang/compiler exec vitest run "${compiler_excludes[@]}" \
            --passWithNoTests --exclude test/DriverNativeAcceptance.test.ts \
            --exclude test/DriverTlsClientWasmAcceptance.test.ts \
            --exclude test/DriverTlsConnectionWasmAcceptance.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=compiler-shard-${{ matrix.shard }}.json
        env:
          # The composite HTTP witness retains one full provider graph; its cold worker exceeds 4 GiB.
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Report compiler shard timings
        if: always()
        run: node scripts/compiler-timing-report.mjs packages/compiler/compiler-shard-${{ matrix.shard }}.json ${{ matrix.shard }} "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # run_attempt suffix keeps reruns from colliding with v4's immutable artifact names.
          name: compiler-shard-${{ matrix.shard }}-timings-a${{ github.run_attempt }}
          path: packages/compiler/compiler-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  tls-wasm:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: TLS Wasm / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            script: test:tls-client-wasm
          - name: connection
            script: test:tls-connection-wasm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-tls-wasm-${{ matrix.name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build --filter=@silklang/compiler...
      - run: pnpm --filter @silklang/compiler run ${{ matrix.script }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  macos-native-os:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .scratch/llvm-22.1.8
          key: native-supply-llvm-macOS-ARM64-f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
      - name: Select the complete LLVM tool installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/llvm-22.1.8
          if [ ! -x .scratch/llvm-22.1.8/bin/llvm-ar ]; then
            curl --fail --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz -o .scratch/llvm.tar.xz
            echo "f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f  .scratch/llvm.tar.xz" | shasum -a 256 -c -
            tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
          fi
          echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
          echo "SILK_TEST_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
          echo "SILK_TEST_LLVM_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
          SDK=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk
          test -f "$SDK/SDKSettings.json"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/compiler... run build
      - run: >
          pnpm --filter @silklang/compiler exec vitest run
          test/OsClockRuntime.test.ts test/OsRandomRuntime.test.ts
          -t 'runs the forced non-Linux absolute-deadline fallback harness|runs the forced macOS one-call exact-fill harness'
          --maxWorkers=1
      - run: >
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'links and runs the native system and monotonic clock ABI' --maxWorkers=1
      # Darwin selects bzero instead of bcmp; run the no-libc memory providers on this target too.
      - run: >
          pnpm --filter @silklang/compiler exec vitest run test/NativeToolchain.test.ts
          -t 'executes the no-libc source memory providers' --maxWorkers=1
      - run: >
          SILK_NATIVE_CORPUS_CASES=secure-random-provider
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'secure-random-provider'
          --maxWorkers=1

  webcontainer-browser:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/platform-webcontainer exec playwright install --with-deps chromium
      - run: pnpm --filter @silklang/platform-webcontainer test:browser

  full-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.full_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: full-verification-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Confirm the authorized exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-full
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-full-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITEST_MAX_WORKERS: 1

  platform-supplies:
    needs: reuse
    if: needs.reuse.outputs.reused != 'true' && (github.event_name != 'workflow_dispatch' || !inputs.full_verification)
    name: Platform supply / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Darwin file trust conformance reached the default ~2 GiB V8 heap on 2026-09-23.
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            llvm: macOS-ARM64
            digest: f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            llvm: Linux-X64
            digest: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            llvm: Linux-ARM64
            digest: 805efad2bb91cb4967fa569e0881d10c0f69c04461cf671cccbae19f547acc34
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .scratch/llvm-22.1.8
          key: native-supply-llvm-${{ matrix.llvm }}-${{ matrix.digest }}
      - name: Install the exact LLVM release
        shell: bash
        env:
          LLVM_ASSET: LLVM-22.1.8-${{ matrix.llvm }}.tar.xz
          LLVM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p .scratch/llvm-22.1.8
          if [ ! -x .scratch/llvm-22.1.8/bin/clang ]; then
            curl --fail --location --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET" -o .scratch/llvm.tar.xz
            echo "$LLVM_DIGEST  .scratch/llvm.tar.xz" | shasum -a 256 -c -
            tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
          fi
          echo "SILK_SUPPLY_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_READOBJ=$PWD/.scratch/llvm-22.1.8/bin/llvm-readobj" >> "$GITHUB_ENV"
      - name: Select the pinned Darwin SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SDK=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk
          test -f "$SDK/SDKSettings.json"
          echo "SILK_SUPPLY_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_LINKER=$PWD/.scratch/llvm-22.1.8/bin/ld64.lld" >> "$GITHUB_ENV"
      - name: Build and inspect the pinned GNU installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker build -t silk-platform-conformance packages/compiler/conformance/platform-supplies
          container=$(docker create silk-platform-conformance)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p .scratch/sysroot
          docker export "$container" | tar -x -C .scratch/sysroot
          gccdir=$(docker run --rm silk-platform-conformance gcc -print-file-name=crtbeginS.o)
          test -f ".scratch/sysroot$gccdir"
          echo "SILK_SUPPLY_ROOT=$PWD/.scratch/sysroot" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_GCC=$PWD/.scratch/sysroot$(dirname "$gccdir")" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_IMAGE=silk-platform-conformance" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_LINKER=$PWD/.scratch/llvm-22.1.8/bin/ld.lld" >> "$GITHUB_ENV"
          docker run --rm silk-platform-conformance dpkg-query -W > .scratch/gnu-packages.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/compiler... build
      - name: Native listener fixture on the host architecture
        env:
          SILK_TEST_CLANG: ${{ env.SILK_SUPPLY_CLANG }}
          SILK_TEST_LLVM_AR: ${{ env.SILK_SUPPLY_AR }}
          SILK_NATIVE_CORPUS_CASES: native-socket-listeners
        run: pnpm --filter @silklang/compiler run test:native-acceptance
      - name: Required real supply conformance
        if: github.event_name != 'pull_request'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
        run: |
          node packages/compiler/conformance/platform-supplies/run.mjs
          node packages/compiler/conformance/integer-variadics/run.mjs
          node packages/compiler/conformance/llvm-helpers/run.mjs
          node packages/compiler/conformance/standard-streams/run.mjs
          node packages/compiler/conformance/native-clocks/run.mjs
          node packages/compiler/conformance/native-entropy/run.mjs
          node packages/compiler/conformance/native-filesystem/run.mjs
          SILK_NATIVE_FILE_TRUST_ONLY=true node packages/compiler/conformance/native-filesystem/run.mjs
          pnpm --filter @silklang/compiler run test:native-process:full
          node packages/compiler/conformance/hosted-start/run.mjs
          SILK_STARTUP_FAULTS=true node packages/compiler/conformance/hosted-start/run.mjs
          node packages/compiler/conformance/native-host-input/run.mjs
          node packages/compiler/conformance/native-report/run.mjs
          node packages/compiler/conformance/execution-storage/run.mjs
          SILK_STORAGE_FAULTS=true node packages/compiler/conformance/execution-storage/run.mjs
      - name: Required native file trust conformance
        if: github.event_name == 'pull_request'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
          SILK_NATIVE_FILE_TRUST_ONLY: true
        run: node packages/compiler/conformance/native-filesystem/run.mjs
      - name: Required Wasm storage conformance
        if: github.event_name != 'pull_request' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: node packages/compiler/conformance/execution-storage/wasm.mjs
      - name: Required raw Linux conformance
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
        run: node packages/compiler/conformance/raw-linux/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-supply-${{ matrix.target }}
          path: |
            .scratch/platform-supplies
            .scratch/integer-variadics
            .scratch/llvm-helpers
            .scratch/standard-streams
            .scratch/native-clocks
            .scratch/native-entropy
            .scratch/native-filesystem
            .scratch/native-file-trust-source
            .scratch/native-process
            .scratch/hosted-start
            .scratch/hosted-start-faults
            .scratch/native-host-input
            .scratch/native-report
            .scratch/execution-storage
            .scratch/raw-linux-conformance
            .scratch/gnu-packages.txt
          if-no-files-found: error

  # The single required check for this workflow: every job above passed or did not apply to this
  # event, and at least one besides the reuse lookup ran. A failed or cancelled job fails it, and so
  # does a run where every other job was skipped, so it never reports green for a head nothing
  # checked.
  result:
    name: CI result
    if: always()
    needs:
      [
        reuse,
        bundled-cli,
        bundled-cli-arm64,
        publish-bootstrap,
        validate,
        package-tests,
        compiler-documentation,
        native-acceptance,
        compiler-tests,
        tls-wasm,
        macos-native-os,
        webcontainer-browser,
        full-verification,
        platform-supplies,
      ]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<<"$RESULTS" > /dev/null
          jq -e 'del(.reuse) | any(.[]; .result == "success")' <<<"$RESULTS" > /dev/null
