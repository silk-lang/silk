name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - selfhost
      - 'selfhost-*'
  schedule:
    - cron: '17 4 * * 1-5'
  workflow_dispatch:
    inputs:
      full_verification:
        description: Run the exact-head full verification lane
        required: true
        type: boolean
        default: false
      expected_sha:
        description: Exact commit SHA authorized for full verification
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Spike (openspec/changes/spike-ci-test-sharding): the compiler vitest payload runs in the
  # compiler-tests matrix below; validate keeps everything else `pnpm check` ran.
  validate:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # Cache keys end in github.sha so every run saves a fresh cache; restore-keys
      # fall back to the newest cache whose lockfile/config hash still matches.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: node scripts/turbo.mjs run build
      # Oxlint resolves public workspace subpaths through their emitted declaration files.
      - run: pnpm lint
      - run: node scripts/turbo.mjs run typecheck
      # Heavy compiler consumers have dedicated runners below. The remaining suites finish in
      # roughly the time it takes the docs app to build.
      - run: >
          node scripts/turbo.mjs run test
          --filter='!@silklang/compiler'
          --filter='!@silklang/lsp'
          --filter='!@silklang/cli'
      - run: pnpm test:scripts
      - run: pnpm release:candidate

  package-tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Package tests / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lsp
            package: '@silklang/lsp'
            llvm: false
          - name: cli
            package: '@silklang/cli'
            llvm: true
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-${{ matrix.name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - uses: actions/cache@v4
        if: matrix.llvm
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-package-${{ matrix.name }}-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - uses: ./.github/actions/setup-linux-llvm
        if: matrix.llvm
      - run: pnpm install --frozen-lockfile
      # These compiler consumers exceeded their 60 s assertion deadlines while competing with
      # another test file. Preserve every test and give each file the dedicated runner.
      - run: node scripts/turbo.mjs run build --filter=${{ matrix.package }}...
      - run: pnpm --filter ${{ matrix.package }} exec vitest run --passWithNoTests --maxWorkers=1
        env:
          # The LSP worker reached the default V8 heap limit after 150 passing tests.
          NODE_OPTIONS: ${{ matrix.name == 'lsp' && '--max-old-space-size=6144' || '' }}

  compiler-documentation:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Each independent check gets the existing bound; generation must not consume doctest time.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [check, examples]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-documentation-${{ matrix.check }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/cli... run build
      # Generation and maintained policy still share one project-analysis pass in the check leg.
      # Six profile analyses each carry the lowered authored stdlib; the default heap is marginal.
      - run: pnpm --filter @silklang/compiler run documentation:${{ matrix.check }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Pull requests run a representative compile/link/execute smoke set. The bounded TLS witnesses
  # use separate processes so their realized compiler graphs do not accumulate in one V8 heap.
  # Main keeps the complete corpus, split by SILK_NATIVE_SHARD because every case lives in one
  # Vitest file.
  native-acceptance:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: Native acceptance / ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Cold source-runtime corpus shards exceed 30 minutes, including toolchain/build setup.
    # Each test still enforces its own bounded compile/run deadline.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"name":"smoke","cases":"literal,direct-recursion,effect-ensuring-outcomes-and-order,foreign-c-layout-clock,scheduler-fiber-semantics,independent-execution-finalized-destroy,bounded-byte-duplex,certificate-profile-and-trust-anchor,tls-record,certificate-path-validation,owned-trust-snapshots"},{"name":"tls-connection","cases":"authenticated-tls-connection"},{"name":"tls-client-driving","cases":"authenticated-tls-client-core,authenticated-tls-client-demand-request,authenticated-tls-client-key-update"},{"name":"tls-client-policy","cases":"authenticated-tls-client-closure-control,authenticated-tls-client-handshake-policy,authenticated-tls-client-resource-policy"}]' || '[{"name":"1-of-3","shard":"1/3"},{"name":"2-of-3","shard":"2/3"},{"name":"3-of-3","shard":"3/3"}]') }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      # Distinct per-shard keys avoid same-key save races; each shard restores its own newest
      # archive first (the one holding its cases' artifacts), then any native cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-na-${{ matrix.name }}-${{ github.sha }}
          restore-keys: |
            silk-native-${{ runner.os }}-na-${{ matrix.name }}-
            silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build
      - run: pnpm --filter @silklang/compiler run test:native-acceptance
        env:
          # The bounded TLS programs peak just above V8's default ~4 GiB old-space limit. Keep the
          # extra headroom scoped to their fresh-process jobs; the ordinary smoke lane stays at the
          # default so it continues to expose unrelated regressions.
          NODE_OPTIONS: ${{ startsWith(matrix.name, 'tls-') && '--max-old-space-size=6144' || '' }}
          SILK_NATIVE_SHARD: ${{ matrix.shard }}
          SILK_NATIVE_CORPUS_CASES: ${{ matrix.cases }}
          SILK_NATIVE_FIXED_TESTS: ${{ github.event_name == 'pull_request' && 'false' || 'true' }}

  compiler-tests:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      # Restore-only: the native-executable cache is populated by test:native-acceptance in
      # validate; four shards saving the same key would race for nothing.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build
      # Select each file once by reviewed CI timings; the selector assigns new files a median cost.
      # Vitest treats positional file filters as substrings, so exclude every unassigned path
      # exactly. Invoke vitest directly because `pnpm --filter … run script -- args` drops the args.
      - run: |
          compiler_excludes=$(node scripts/compiler-shards.mjs --exclude-for-shard=${{ matrix.shard }}/4)
          readarray -t compiler_excludes <<< "$compiler_excludes"
          pnpm --filter @silklang/compiler exec vitest run "${compiler_excludes[@]}" \
            --passWithNoTests --exclude test/DriverNativeAcceptance.test.ts \
            --exclude test/DriverTlsClientWasmAcceptance.test.ts \
            --exclude test/DriverTlsConnectionWasmAcceptance.test.ts \
            --reporter=default --reporter=json \
            --outputFile.json=compiler-shard-${{ matrix.shard }}.json
        env:
          # The composite HTTP witness retains one full provider graph; its cold worker exceeds 4 GiB.
          NODE_OPTIONS: --max-old-space-size=6144
          SILK_VERIFY_CORPUS_LIMIT: ${{ github.event_name == 'pull_request' && '2' || '' }}
      - name: Report compiler shard timings
        if: always()
        run: node scripts/compiler-timing-report.mjs packages/compiler/compiler-shard-${{ matrix.shard }}.json ${{ matrix.shard }} "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          # run_attempt suffix keeps reruns from colliding with v4's immutable artifact names.
          name: compiler-shard-${{ matrix.shard }}-timings-a${{ github.run_attempt }}
          path: packages/compiler/compiler-shard-${{ matrix.shard }}.json
          if-no-files-found: warn

  tls-wasm:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    name: TLS Wasm / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            script: test:tls-client-wasm
          - name: connection
            script: test:tls-connection-wasm
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-tls-wasm-${{ matrix.name }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: node scripts/turbo.mjs run build
      - run: pnpm --filter @silklang/compiler run ${{ matrix.script }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  macos-native-os:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .scratch/llvm-22.1.8
          key: native-supply-llvm-macOS-ARM64-f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
      - name: Select the complete LLVM tool installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .scratch/llvm-22.1.8
          if [ ! -x .scratch/llvm-22.1.8/bin/llvm-ar ]; then
            curl --fail --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz -o .scratch/llvm.tar.xz
            echo "f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f  .scratch/llvm.tar.xz" | shasum -a 256 -c -
            tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
          fi
          echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
          echo "SILK_TEST_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
          echo "SILK_TEST_LLVM_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
          SDK=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk
          test -f "$SDK/SDKSettings.json"
          echo "SDKROOT=$SDK" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/compiler... run build
      - run: >
          pnpm --filter @silklang/compiler exec vitest run
          test/OsClockRuntime.test.ts test/OsRandomRuntime.test.ts
          -t 'runs the forced non-Linux absolute-deadline fallback harness|runs the forced macOS one-call exact-fill harness'
          --maxWorkers=1
      - run: >
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'links and runs the native system and monotonic clock ABI' --maxWorkers=1
      - run: >
          SILK_NATIVE_CORPUS_CASES=secure-random-provider
          pnpm --filter @silklang/compiler exec vitest run test/DriverNativeAcceptance.test.ts
          -t 'secure-random-provider'
          --maxWorkers=1

  webcontainer-browser:
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/platform-webcontainer exec playwright install --with-deps chromium
      - run: pnpm --filter @silklang/platform-webcontainer test:browser

  full-verification:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.full_verification
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    concurrency:
      group: full-verification-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - name: Confirm the authorized exact head
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${{ github.sha }}" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-${{ github.sha }}-full
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json', 'vitest.shared.ts') }}-
            turbo-${{ runner.os }}-
      - uses: actions/cache@v4
        with:
          path: ~/.cache/silk-effect/native
          key: silk-native-${{ runner.os }}-full-${{ github.sha }}
          restore-keys: silk-native-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITEST_MAX_WORKERS: 1
      - run: pnpm release:candidate

  platform-supplies:
    if: github.event_name != 'workflow_dispatch' || (github.ref == 'refs/heads/main' && !inputs.full_verification)
    name: Platform supply / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      # Darwin file trust conformance reached the default ~2 GiB V8 heap on 2026-09-23.
      NODE_OPTIONS: --max-old-space-size=6144
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            llvm: macOS-ARM64
            digest: f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            llvm: Linux-X64
            digest: df0e1ecf16caf3489a272a5eea4eec9b0d82878f6477fa309504f918a0006384
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            llvm: Linux-ARM64
            digest: 805efad2bb91cb4967fa569e0881d10c0f69c04461cf671cccbae19f547acc34
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .scratch/llvm-22.1.8
          key: native-supply-llvm-${{ matrix.llvm }}-${{ matrix.digest }}
      - name: Install the exact LLVM release
        shell: bash
        env:
          LLVM_ASSET: LLVM-22.1.8-${{ matrix.llvm }}.tar.xz
          LLVM_DIGEST: ${{ matrix.digest }}
        run: |
          set -euo pipefail
          mkdir -p .scratch/llvm-22.1.8
          if [ ! -x .scratch/llvm-22.1.8/bin/clang ]; then
            curl --fail --location --retry 3 "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/$LLVM_ASSET" -o .scratch/llvm.tar.xz
            echo "$LLVM_DIGEST  .scratch/llvm.tar.xz" | shasum -a 256 -c -
            tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
          fi
          echo "SILK_SUPPLY_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_AR=$PWD/.scratch/llvm-22.1.8/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_READOBJ=$PWD/.scratch/llvm-22.1.8/bin/llvm-readobj" >> "$GITHUB_ENV"
      - name: Select the pinned Darwin SDK
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          SDK=/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX15.5.sdk
          test -f "$SDK/SDKSettings.json"
          echo "SILK_SUPPLY_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_LINKER=$PWD/.scratch/llvm-22.1.8/bin/ld64.lld" >> "$GITHUB_ENV"
      - name: Build and inspect the pinned GNU installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          docker build -t silk-platform-conformance packages/compiler/conformance/platform-supplies
          container=$(docker create silk-platform-conformance)
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p .scratch/sysroot
          docker export "$container" | tar -x -C .scratch/sysroot
          gccdir=$(docker run --rm silk-platform-conformance gcc -print-file-name=crtbeginS.o)
          test -f ".scratch/sysroot$gccdir"
          echo "SILK_SUPPLY_ROOT=$PWD/.scratch/sysroot" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_GCC=$PWD/.scratch/sysroot$(dirname "$gccdir")" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_IMAGE=silk-platform-conformance" >> "$GITHUB_ENV"
          echo "SILK_SUPPLY_LINKER=$PWD/.scratch/llvm-22.1.8/bin/ld.lld" >> "$GITHUB_ENV"
          docker run --rm silk-platform-conformance dpkg-query -W > .scratch/gnu-packages.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @silklang/compiler... build
      - name: Required real supply conformance
        if: github.event_name != 'pull_request'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
        run: |
          node packages/compiler/conformance/platform-supplies/run.mjs
          node packages/compiler/conformance/integer-variadics/run.mjs
          node packages/compiler/conformance/llvm-helpers/run.mjs
          node packages/compiler/conformance/standard-streams/run.mjs
          node packages/compiler/conformance/native-clocks/run.mjs
          node packages/compiler/conformance/native-entropy/run.mjs
          node packages/compiler/conformance/native-filesystem/run.mjs
          SILK_NATIVE_FILE_TRUST_ONLY=true node packages/compiler/conformance/native-filesystem/run.mjs
          pnpm --filter @silklang/compiler run test:native-process:full
          node packages/compiler/conformance/hosted-start/run.mjs
          SILK_STARTUP_FAULTS=true node packages/compiler/conformance/hosted-start/run.mjs
          node packages/compiler/conformance/native-host-input/run.mjs
          node packages/compiler/conformance/native-report/run.mjs
          node packages/compiler/conformance/execution-storage/run.mjs
          SILK_STORAGE_FAULTS=true node packages/compiler/conformance/execution-storage/run.mjs
      - name: Required native file trust conformance
        if: github.event_name == 'pull_request'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
          SILK_NATIVE_FILE_TRUST_ONLY: true
        run: node packages/compiler/conformance/native-filesystem/run.mjs
      - name: Required Wasm storage conformance
        if: github.event_name != 'pull_request' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: node packages/compiler/conformance/execution-storage/wasm.mjs
      - name: Required raw Linux conformance
        if: github.event_name != 'pull_request' && runner.os == 'Linux'
        env:
          SILK_SUPPLY_TARGET: ${{ matrix.target }}
        run: node packages/compiler/conformance/raw-linux/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-supply-${{ matrix.target }}
          path: |
            .scratch/platform-supplies
            .scratch/integer-variadics
            .scratch/llvm-helpers
            .scratch/standard-streams
            .scratch/native-clocks
            .scratch/native-entropy
            .scratch/native-filesystem
            .scratch/native-file-trust-source
            .scratch/native-process
            .scratch/hosted-start
