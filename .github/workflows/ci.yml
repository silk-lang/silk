name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# A newer pull_request run of the same PR cancels the older one; push and workflow_dispatch runs
# each keep a unique group, so they are never cancelled by it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Format, lint and the native tooling's own tests. The native compiler is checked by
  # selfhost.yml and the frozen bootstrap by bootstrap.yml.
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - run: pnpm test:scripts

  # The single required check for this workflow: every job above passed.
  result:
    name: CI result
    if: always()
    needs: [validate]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value.result)"' <<<"$RESULTS"
          jq -e 'all(.[]; .result == "success")' <<<"$RESULTS" > /dev/null
