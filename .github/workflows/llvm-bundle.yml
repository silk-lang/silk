name: Bundled LLVM

# Builds the LLVM every release archive carries at lib/silk/llvm (scripts/build-llvm.sh), one
# archive per release target, each on its own target's runner. It runs only when the build's
# inputs change. A pull request from this repository publishes the bundle the pin names as a
# prerelease tagged `<pin tag>` once, when no such release exists; a published bundle is never
# replaced, so a different build needs a new revision in compiler/llvm-bundle.json. The release
# workflow downloads the pinned bundle and checks every archive's SHA-256 against the pin.
on:
  pull_request:
    paths:
      - scripts/build-llvm.sh
      - compiler/llvm-bundle.json
      - .github/workflows/llvm-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llvm-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A published bundle is never rebuilt, so a pin change that only records its digests builds
  # nothing.
  pending:
    name: Check whether the pinned bundle is published
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(sed -n 's/.*"tag": *"\([^"]*\)".*/\1/p' compiler/llvm-bundle.json)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is published already."
            echo build=false >> "$GITHUB_OUTPUT"
          else
            echo build=true >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build the bundled LLVM / ${{ matrix.target }}
    needs: pending
    if: needs.pending.outputs.build == 'true'
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - name: Download and verify the LLVM source release
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' compiler/llvm-bundle.json)
          source=$(sed -n 's/.*"sourceSha256": *"\([^"]*\)".*/\1/p' compiler/llvm-bundle.json)
          tag=$(sed -n 's/.*"tag": *"\([^"]*\)".*/\1/p' compiler/llvm-bundle.json)
          echo "LLVM_TAG=$tag" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/llvm.src.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/llvm-project-$version.src.tar.xz"
          if command -v sha256sum > /dev/null; then digest=$(sha256sum "$RUNNER_TEMP/llvm.src.tar.xz"); else digest=$(shasum -a 256 "$RUNNER_TEMP/llvm.src.tar.xz"); fi
          test "${digest%% *}" = "$source"
          mkdir "$RUNNER_TEMP/llvm-src"
          # Windows tar cannot make the source's symbolic links, which the build never reads.
          tar -xJf "$RUNNER_TEMP/llvm.src.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/llvm-src" 2> "$RUNNER_TEMP/untar.log" || {
            if [ "$RUNNER_OS" != Windows ]; then cat "$RUNNER_TEMP/untar.log"; exit 1; fi
          }
          rm "$RUNNER_TEMP/llvm.src.tar.xz"
      - name: Install the build tools
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          pipx install cmake
          pipx install ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install the build tools
        if: runner.os == 'macOS'
        run: brew list ninja > /dev/null 2>&1 || brew install ninja
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-llvm.sh "$RUNNER_TEMP/llvm-src" "$RUNNER_TEMP/llvm"
      - name: Build
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set CC=cl
          set CXX=cl
          "C:\Program Files\Git\bin\bash.exe" scripts/build-llvm.sh "%RUNNER_TEMP%/llvm-src" "%RUNNER_TEMP%/llvm"
      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          name="silk-llvm-${LLVM_TAG#llvm-}-$TARGET"
          mkdir -p "$RUNNER_TEMP/pack"
          mv "$RUNNER_TEMP/llvm" "$RUNNER_TEMP/pack/$name"
          tar -C "$RUNNER_TEMP/pack" -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
          if command -v sha256sum > /dev/null; then sha256sum "$RUNNER_TEMP/$name.tar.gz"; else shasum -a 256 "$RUNNER_TEMP/$name.tar.gz"; fi
          ls -l "$RUNNER_TEMP/$name.tar.gz" "$RUNNER_TEMP/pack/$name/bin"
          echo "BUNDLE=$RUNNER_TEMP/$name.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: llvm-bundle-${{ matrix.target }}
          path: ${{ env.BUNDLE }}
          if-no-files-found: error

  publish:
    name: Publish the bundled LLVM
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: llvm-bundle-*
          merge-multiple: true
          path: ${{ runner.temp }}/bundles
      - name: Publish once, as a prerelease that is never the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          tag=$(sed -n 's/.*"tag": *"\([^"]*\)".*/\1/p' compiler/llvm-bundle.json)
          (cd "$RUNNER_TEMP/bundles" && sha256sum *.tar.gz | tee SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already published; a different build needs a new revision in compiler/llvm-bundle.json."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$COMMIT" --prerelease --latest=false \
            --title "Bundled LLVM $tag" \
            --notes "The LLVM Silk release archives carry at lib/silk/llvm, built by scripts/build-llvm.sh. Not a Silk release." \
            "$RUNNER_TEMP"/bundles/*.tar.gz "$RUNNER_TEMP/bundles/SHA256SUMS"
