name: Release archives from one Linux runner

# One Linux job builds every host's release compiler and silk tool from the verified Linux N1 and
# packs the archives, with no SDK or sysroot: Linux and macOS links use Silk's own stubs and
# Windows its own import libraries. Each target's runner then only verifies: the compiler from the
# archive rebuilds itself and the tool natively, and both must be the cross-built bytes; then the
# runner smokes the archive and runs the corpus. Publication takes the cross-built archives.
on:
  workflow_call:
    inputs:
      n1-sha256:
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  SILK_VERIFY_MIR: '1'

jobs:
  cross:
    name: Cross-build every release archive on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      # The profile the Linux N2 was optimized by, from its training on x86-64 Linux. The emitted IR
      # names no target, so the same profile optimizes every target's compiler.
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-compiler-profile
          path: ${{ runner.temp }}/profile
      - name: Build every target's compiler and tool from the exact immutable inputs
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          echo "$N1_SHA256  $RUNNER_TEMP/n1/N1" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/n1/N1"
          mkdir "$RUNNER_TEMP/cross"
          cp "$RUNNER_TEMP/profile/compiler.profdata" "$RUNNER_TEMP/cross/compiler.profdata"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            # Windows has no profile-guided build yet.
            profile="$RUNNER_TEMP/cross/compiler.profdata"
            if [ "$target" = x86_64-pc-windows-msvc ]; then profile=-; fi
            .github/scripts/release-build.sh "$RUNNER_TEMP/n1/N1" "$target" "$RUNNER_TEMP/authored-inputs" "$profile" \
              "$RUNNER_TEMP/cross/$target"
            sha256sum "$RUNNER_TEMP/cross/$target/compiler.ll" | cut -d' ' -f1 > "$RUNNER_TEMP/cross/$target/compiler.ll.sha256"
            rm "$RUNNER_TEMP/cross/$target/compiler.ll"
            (cd "$RUNNER_TEMP/cross/$target" && sha256sum silkc* silk silk.exe 2> /dev/null || true)
          done
          node compiler/scripts/SourceSnapshot.mjs verify "$RUNNER_TEMP/authored-inputs" > /dev/null
          file "$RUNNER_TEMP/cross/aarch64-unknown-linux-gnu/silkc" | grep -q 'ARM aarch64'
          file "$RUNNER_TEMP/cross/aarch64-apple-darwin/silkc" | grep -q arm64
          file "$RUNNER_TEMP/cross/x86_64-apple-darwin/silkc" | grep -q x86_64
          file "$RUNNER_TEMP/cross/x86_64-pc-windows-msvc/silkc.exe" | grep -q PE32+
      # The archives: each target's compiler as `bin/silkc` and the silk tool as `bin/silk` beside its
      # standard library. The x86-64 Linux compiler runs here, so it names the version.
      - name: Pack the release archives
        run: |
          set -euo pipefail
          compiler="$RUNNER_TEMP/cross/x86_64-unknown-linux-gnu/silkc"
          node compiler/scripts/CompilerRelease.mjs verify-build "$compiler" "$RUNNER_TEMP/authored-inputs"
          version=$("$compiler" --version)
          version=${version#silk v}
          echo "$version" > "$RUNNER_TEMP/cross/version.txt"
          mkdir "$RUNNER_TEMP/release"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            suffix=
            if [ "$target" = x86_64-pc-windows-msvc ]; then suffix=.exe; fi
            args=(--compiler "$RUNNER_TEMP/cross/$target/silkc$suffix" --tool "$RUNNER_TEMP/cross/$target/silk$suffix"
              --stdlib "$RUNNER_TEMP/authored-inputs/stdlib" --target "$target" --version "$version" --output "$RUNNER_TEMP/release")
            if [ -f "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml" ]; then
              args+=(--snapshot "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml")
            fi
            node compiler/scripts/ReleaseArchive.ts "${args[@]}"
          done
          ls -l "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-cross
          path: ${{ runner.temp }}/cross/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: silk-release-archives
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify the cross-built archive natively / ${{ matrix.target }}
    needs: cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
          # LLVM publishes no Intel macOS release, so an Apple silicon Mac rebuilds the Intel
          # compiler under Rosetta with the pinned arm64 Clang; macos-15-intel runs it natively below.
          - target: x86_64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - name: Install Rosetta
        if: matrix.target == 'x86_64-apple-darwin'
        run: if ! arch -x86_64 /usr/bin/true 2> /dev/null; then sudo softwareupdate --install-rosetta --agree-to-license; fi
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-cross
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archives
          path: ${{ runner.temp }}/release
      - name: Restore exact build inputs
        run: node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
      # The archive's compiler builds itself and the tool here with the release profile, and the
      # results must be the bytes Linux built. A difference is a determinism bug in the compiler or
      # its link, never something to compare around.
      - name: Rebuild the archive's compiler and tool natively and require the same bytes
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/cross/version.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/release/silk-$version-$TARGET.tar.gz"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$archive" -C "$RUNNER_TEMP/unpacked"
          top="$RUNNER_TEMP/unpacked/silk-$version-$TARGET"
          cmp "$top/bin/silkc" "$RUNNER_TEMP/cross/$TARGET/silkc"
          cmp "$top/bin/silk" "$RUNNER_TEMP/cross/$TARGET/silk"
          # Nothing from this Mac's SDK may reach the links: release-build.sh ignores SDKROOT.
          .github/scripts/release-build.sh "$top/bin/silkc" "$TARGET" "$RUNNER_TEMP/authored-inputs" \
            "$RUNNER_TEMP/cross/compiler.profdata" "$RUNNER_TEMP/native"
          node compiler/scripts/SourceSnapshot.mjs verify "$RUNNER_TEMP/authored-inputs" > /dev/null
          status=0
          cmp "$RUNNER_TEMP/native/silkc" "$RUNNER_TEMP/cross/$TARGET/silkc" || status=1
          cmp "$RUNNER_TEMP/native/silk" "$RUNNER_TEMP/cross/$TARGET/silk" || status=1
          producer_ir=$(cat "$RUNNER_TEMP/cross/$TARGET/compiler.ll.sha256")
          output_ir=$(shasum -a 256 "$RUNNER_TEMP/native/compiler.ll" | cut -d' ' -f1)
          if [ "$producer_ir" != "$output_ir" ]; then
            echo "::error title=Compiler IR differs::N1 on Linux emitted $producer_ir for $TARGET, the native compiler $output_ir"
            status=1
          fi
          if [ "$status" != 0 ]; then
            echo "::error title=Native rebuild differs::$TARGET did not rebuild the cross-built bytes; the native binaries are in the diagnostics artifact"
            exit 1
          fi
          node compiler/scripts/CompilerRelease.mjs verify-build "$RUNNER_TEMP/native/silkc" "$RUNNER_TEMP/authored-inputs"
          sha=$(shasum -a 256 "$RUNNER_TEMP/native/silkc" | cut -d' ' -f1)
          jq -n --arg target "$TARGET" --slurpfile snapshot "$RUNNER_TEMP/authored-inputs/input-snapshot.json" \
            --arg n1 "$N1_SHA256" --arg n2 "$sha" --arg producerIr "$producer_ir" --arg outputIr "$output_ir" \
            '{schemaVersion: 2, status: "passed", target: $target,
              profile: {optimization: "speed", debug: false, profileGuided: true},
              inputs: ($snapshot[0] | {sourceCommit, normalizedDigest, archiveSha256, files, projection: (.projection // null)}),
              origin: "linux-cross-native-rebuild",
              producer: {generation: "N1", sha256: $n1}, output: {generation: "N2", sha256: $n2},
              nativeRebuild: {sha256: $n2},
              fixpoint: {producerIrSha256: $producerIr, outputIrSha256: $outputIr}}' > "$RUNNER_TEMP/native/chain-receipt.json"
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/cross/$TARGET/silkc" "$RUNNER_TEMP/candidate/silk-compiler-$TARGET"
          cp "$RUNNER_TEMP/native/chain-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt-$TARGET.json"
          node compiler/scripts/NativeSeed.mjs candidate "$RUNNER_TEMP/native/chain-receipt.json" "$GITHUB_RUN_ID" \
            "v$version" > "$RUNNER_TEMP/candidate/native-seed-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the native rebuild
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-native-rebuild-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native/silkc
            ${{ runner.temp }}/native/silk
            ${{ runner.temp }}/native/*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Run a new project from the archive
        run: |
          mkdir "$RUNNER_TEMP/installed"
          .github/scripts/smoke-release-archive.sh "$RUNNER_TEMP/release/silk-$VERSION-$TARGET.tar.gz" "$VERSION" "$RUNNER_TEMP/installed"
      - name: Build the verification harness
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        run: node .github/scripts/bundle-selfhost-verification.mjs
      - name: Verify native HTTPS trust and upgrade history
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        run: SILK_COMPILER="$RUNNER_TEMP/native/silkc" node .github/scripts/test-native-https.mjs
      # x86-64 Linux runs the corpus with N1 in the corpus job.
      - name: Run the native corpus with the release compiler
        if: matrix.target != 'x86_64-unknown-linux-gnu' && matrix.target != 'x86_64-apple-darwin'
        env:
          SELFHOST_VERIFICATION: ${{ github.workspace }}/.scratch/selfhost-verification.mjs
        run: |
          set -euo pipefail
          SILK_COMPILER="$RUNNER_TEMP/native/silkc" node "$SELFHOST_VERIFICATION" --mode corpus-full | tee "$RUNNER_TEMP/corpus.log"
          node --input-type=module - "$RUNNER_TEMP/corpus.log" <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.argv[2], 'utf8').split('\n')
          const failures = lines.filter((line) => line.startsWith('FAIL '))
          if (failures.length > 0) throw new Error(`Corpus failures:\n${failures.join('\n')}`)
          if (lines.some((line) => /(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)/.test(line))) throw new Error('Corpus runtime mismatch, runner failure, or module-source gap')
          const timings = lines.filter((line) => line.startsWith('SELFHOST_CASE_TIMING='))
          const outcomes = lines.filter((line) => /^(?:PASS|FAIL|UNSUPPORTED) /.test(line))
          if (timings.length !== outcomes.length || outcomes.length === 0) throw new Error('Incomplete corpus timing receipt')
          JS
          node compiler/scripts/SourceSnapshot.mjs verify "$RUNNER_TEMP/authored-inputs" > /dev/null
      # The Intel compiler builds the self-contained corpus under Rosetta, and Rosetta runs it.
      - name: Build and run the self-contained corpus with the Intel compiler
        if: matrix.target == 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          .github/scripts/cross-build-corpus.sh "$RUNNER_TEMP/native/silkc" x86_64-apple-darwin "$RUNNER_TEMP/intel" '{ kind = "automatic" }'
          file "$RUNNER_TEMP/intel/stdout-writer-hello/program" | grep -q x86_64
          .github/scripts/run-cross-corpus.sh "$RUNNER_TEMP/intel" arch -x86_64
      # A build.silk tool step runs under the macOS sandbox, which confines its writes, reads and
      # network; Linux runs the same checks in the native build CLI suite.
      - name: Confine a build tool step with the macOS sandbox
        if: matrix.target == 'aarch64-apple-darwin'
        run: .github/scripts/test-build-tool-sandbox.sh "$RUNNER_TEMP/native/silkc" "$RUNNER_TEMP/authored-inputs/stdlib"
      # Linux programs link without a sysroot through the compiler's glibc 2.28 stubs, on any host;
      # cross-linux-x86-run and cross-linux-darwin-run in Selfhost run them.
      - name: Cross-build the corpus for x86-64 Linux without a sysroot
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          .github/scripts/cross-build-corpus.sh "$RUNNER_TEMP/native/silkc" x86_64-unknown-linux-gnu "$RUNNER_TEMP/linux-x86_64" ''
          .github/scripts/inspect-glibc-programs.sh "$RUNNER_TEMP/linux-x86_64" /lib64/ld-linux-x86-64.so.2
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin'
        with:
          name: cross-linux-x86_64-programs-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-x86_64/
          if-no-files-found: error
          retention-days: 3
      - name: Cross-build the corpus for arm64 Linux without a sysroot
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          .github/scripts/cross-build-corpus.sh "$RUNNER_TEMP/native/silkc" aarch64-unknown-linux-gnu "$RUNNER_TEMP/linux-aarch64" ''
          .github/scripts/inspect-glibc-programs.sh "$RUNNER_TEMP/linux-aarch64" /lib/ld-linux-aarch64.so.1
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'aarch64-apple-darwin'
        with:
          name: cross-linux-aarch64-programs-${{ matrix.target }}
          path: ${{ runner.temp }}/linux-aarch64/
          if-no-files-found: error
          retention-days: 3

  # An Intel Mac runs the Intel archive natively: its compiler and tool start and report the right
  # host, and with an Intel Clang it builds and runs a new project.
  intel:
    name: Run the Intel macOS archive on an Intel Mac
    needs: cross
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-cross
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archives
          path: ${{ runner.temp }}/release
      - name: Start the archive's compiler and tool
        run: |
          set -euo pipefail
          version=$(cat "$RUNNER_TEMP/cross/version.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/hello"
          tar -xzf "$RUNNER_TEMP/release/silk-$version-x86_64-apple-darwin.tar.gz" -C "$RUNNER_TEMP/unpacked"
          top="$RUNNER_TEMP/unpacked/silk-$version-x86_64-apple-darwin"
          test "$("$top/bin/silkc" --version)" = "silk v$version"
          "$top/bin/silk" --version
          cp corpus/native/stdout-writer-hello/main.silk "$RUNNER_TEMP/hello/main.silk"
          printf '[package]\nname = "hello"\nversion = "0.1.0"\nsource = "."\n' > "$RUNNER_TEMP/hello/silk.toml"
          (cd "$RUNNER_TEMP/hello" && "$top/bin/silkc" build main.silk -o hello.ll --emit llvm-ir) | tee "$RUNNER_TEMP/hello/build.log"
          grep -q '(llvm, x86_64-apple-darwin,' "$RUNNER_TEMP/hello/build.log"
      # LLVM publishes no Intel macOS release; Homebrew's llvm and lld are what Intel Mac users
      # install.
      - name: Install Homebrew LLVM
        run: |
          set -euo pipefail
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Run a new project from the archive
        run: |
          set -euo pipefail
          clang --version
          mkdir "$RUNNER_TEMP/installed"
          .github/scripts/smoke-release-archive.sh "$RUNNER_TEMP/release/silk-$VERSION-x86_64-apple-darwin.tar.gz" "$VERSION" "$RUNNER_TEMP/installed"

  verify-windows:
    name: Verify the cross-built archive natively / x86_64-pc-windows-msvc
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-cross
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archives
          path: ${{ runner.temp }}/release
      - name: Rebuild the archive's compiler and tool natively and require the same bytes
        shell: pwsh
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
        run: |
          node compiler/scripts/SourceSnapshot.mjs restore "$env:RUNNER_TEMP/build-inputs" "$env:RUNNER_TEMP/authored-inputs" > $null
          if ($LASTEXITCODE -ne 0) { throw 'Input snapshot restore failed' }
          & .github/scripts/windows-release.ps1 -CrossDirectory "$env:RUNNER_TEMP/cross" -ReleaseDirectory "$env:RUNNER_TEMP/release" `
            -Snapshot "$env:RUNNER_TEMP/authored-inputs" -OutputDirectory "$env:RUNNER_TEMP/windows-native" -ProducerSha256 $env:N1_SHA256
      - name: Stage the per-target candidate
        shell: pwsh
        run: |
          $version = (Get-Content "$env:RUNNER_TEMP/cross/version.txt" -Raw).Trim()
          $candidate = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/candidate"
          Copy-Item "$env:RUNNER_TEMP/cross/x86_64-pc-windows-msvc/silkc.exe" "$candidate/silk-compiler-x86_64-pc-windows-msvc.exe"
          Copy-Item "$env:RUNNER_TEMP/windows-native/chain-receipt.json" "$candidate/chain-receipt-x86_64-pc-windows-msvc.json"
          node compiler/scripts/NativeSeed.mjs candidate "$env:RUNNER_TEMP/windows-native/chain-receipt.json" $env:GITHUB_RUN_ID "v$version" |
            Set-Content -Encoding utf8NoBOM "$candidate/native-seed-x86_64-pc-windows-msvc.json"
          if ($LASTEXITCODE -ne 0) { throw 'Seed candidate failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-native-rebuild-x86_64-pc-windows-msvc
          path: |
            ${{ runner.temp }}/windows-native/*.json
            ${{ runner.temp }}/windows-native/*.txt
            ${{ runner.temp }}/windows-native/silkc.exe
            ${{ runner.temp }}/windows-native/silk.exe
          if-no-files-found: warn
          retention-days: 7
      - name: Check installer release selection in PowerShell 7
        shell: pwsh
        run: '& .github/scripts/test-windows-installer-selection.ps1'
      - name: Check installer release selection in Windows PowerShell
        shell: powershell
        run: '& .github/scripts/test-windows-installer-selection.ps1'
      - name: Run a new project from the ZIP and test the installer
        shell: pwsh
        run: |
          $version = (Get-Content "$env:RUNNER_TEMP/cross/version.txt" -Raw).Trim()
          $archive = "$env:RUNNER_TEMP/release/silk-$version-x86_64-pc-windows-msvc.zip"
          & .github/scripts/smoke-release-archive.ps1 -Archive $archive -OutputDirectory "$env:RUNNER_TEMP/installed"
          & .github/scripts/test-windows-installer.ps1 -Archive $archive -OutputDirectory "$env:RUNNER_TEMP/installer-tests"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installer-results
          path: ${{ runner.temp }}/installer-tests/results.json
          if-no-files-found: warn
