name: Release archives from one Linux runner

# Linux builds every target's release compiler and silk tool from the verified Linux N1 and packs
# the archives, one job per target, with no SDK or sysroot: Linux and macOS links use Silk's own
# stubs and Windows its own import libraries. Each target's runner then checks the shipped bytes:
# the archive's compiler emits its own IR, which must be N1's (a self-host fixpoint on the
# target), the archive installs and runs a new project, and the target runs its programs.
# Publication takes the cross-built archives.
on:
  workflow_call:
    inputs:
      n1-sha256:
        required: true
        type: string
      # Publishing runs optimize every compiler but Windows with the profile compiler-profile
      # trained; other runs build without one, since nothing they build ships.
      profile-guided:
        required: true
        type: boolean

permissions:
  contents: read
  actions: read

env:
  SILK_VERIFY_MIR: '1'

jobs:
  cross:
    name: Cross-build the release archive on Linux / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-pc-windows-msvc
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      # The emitted IR names no target, so the one profile optimizes every target's compiler.
      - uses: actions/download-artifact@v4
        if: inputs.profile-guided && matrix.target != 'x86_64-pc-windows-msvc'
        with:
          name: selfhost-compiler-profile
          path: ${{ runner.temp }}/profile
      - name: Build the compiler and tool from the exact immutable inputs and pack the archive
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          echo "$N1_SHA256  $RUNNER_TEMP/n1/N1" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/n1/N1"
          mkdir "$RUNNER_TEMP/cross"
          profile=-
          if [ -f "$RUNNER_TEMP/profile/compiler.profdata" ]; then profile="$RUNNER_TEMP/profile/compiler.profdata"; fi
          suffix=
          if [ "$TARGET" = x86_64-pc-windows-msvc ]; then suffix=.exe; fi
          .github/scripts/release-build.sh "$RUNNER_TEMP/n1/N1" "$TARGET" "$RUNNER_TEMP/authored-inputs" "$profile" \
            "$RUNNER_TEMP/cross/$TARGET"
          sha256sum "$RUNNER_TEMP/cross/$TARGET/compiler.ll" | cut -d' ' -f1 > "$RUNNER_TEMP/cross/$TARGET/compiler.ll.sha256"
          rm "$RUNNER_TEMP/cross/$TARGET/compiler.ll"
          # The build must leave the inputs that become the release untouched.
          node compiler/scripts/SourceSnapshot.mjs verify "$RUNNER_TEMP/authored-inputs" > /dev/null
          # N1 was built from the same projected inputs, so it names the version.
          version=$("$RUNNER_TEMP/n1/N1" --version)
          version=${version#silk v}
          echo "$version" > "$RUNNER_TEMP/cross/version.txt"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/release"
          args=(--compiler "$RUNNER_TEMP/cross/$TARGET/silkc$suffix" --tool "$RUNNER_TEMP/cross/$TARGET/silk$suffix"
            --stdlib "$RUNNER_TEMP/authored-inputs/stdlib" --target "$TARGET" --version "$version" --output "$RUNNER_TEMP/release")
          if [ -f "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml" ]; then
            args+=(--snapshot "$RUNNER_TEMP/authored-inputs/compiler/changes-snapshot.toml")
          fi
          node compiler/scripts/ReleaseArchive.ts "${args[@]}"
      # x86-64 Linux is this runner, so it checks its own archive here: the shipped compiler is the
      # self-host fixpoint of N1, and the archive installs and runs a new project.
      - name: Check the x86-64 Linux archive
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
          PROFILE_GUIDED: ${{ inputs.profile-guided }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/installed"
          tar -xzf "$RUNNER_TEMP/release/silk-$VERSION-$TARGET.tar.gz" -C "$RUNNER_TEMP/unpacked"
          .github/scripts/release-check.sh "$RUNNER_TEMP/unpacked/silk-$VERSION-$TARGET" "$TARGET" "$RUNNER_TEMP/authored-inputs" \
            "$RUNNER_TEMP/cross" "$N1_SHA256" "$PROFILE_GUIDED" "$RUNNER_TEMP/check"
          .github/scripts/smoke-release-archive.sh "$RUNNER_TEMP/release/silk-$VERSION-$TARGET.tar.gz" "$VERSION" "$RUNNER_TEMP/installed"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: selfhost-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/check/candidate/
          if-no-files-found: error
          retention-days: 7
      # The Intel Mac runs the self-contained corpus; building it here keeps the slow Intel runner to
      # running it. Where a program is built does not change its bytes.
      - name: Cross-build the self-contained corpus for Intel macOS
        if: matrix.target == 'x86_64-apple-darwin'
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: .github/scripts/cross-build-corpus.sh "$RUNNER_TEMP/n1/N1" "$TARGET" "$RUNNER_TEMP/cross/corpus" '{ kind = "automatic" }'
      # Windows runs its no-CRT runtime programs and the tool's mapped-image fixtures natively.
      - name: Cross-build the Windows runtime programs and tool fixtures
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          bash compiler/fixtures/windows-runtime/cross-build.sh "$RUNNER_TEMP/n1/N1" "$RUNNER_TEMP/cross/windows-programs"
          mkdir "$RUNNER_TEMP/cross/windows-tool"
          cp "$RUNNER_TEMP/cross/$TARGET/silk.exe" "$RUNNER_TEMP/cross/windows-tool/silk.exe"
          for fixture in WindowsHostFiles:host-files WindowsInstall:install; do
            "$RUNNER_TEMP/n1/N1" build "tool/src/fixtures/${fixture%%:*}.silk" -o "$RUNNER_TEMP/cross/windows-tool/${fixture##*:}.exe" \
              --target "$TARGET" --stdlib "$PWD/stdlib" --optimization none --debug false
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-cross-${{ matrix.target }}
          path: ${{ runner.temp }}/cross/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: silk-release-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Check the archive natively / ${{ matrix.target }}
    needs: cross
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-cross-${{ matrix.target }}
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archive-${{ matrix.target }}
          path: ${{ runner.temp }}/release
      # The Mac also rebuilds the tool: one full link on the target, which must be the archive's
      # bytes, so nothing from the Mac's SDK reaches a link (release-check.sh ignores SDKROOT).
      - name: Check the archive's compiler is the self-host fixpoint on this target
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
          PROFILE_GUIDED: ${{ inputs.profile-guided }}
          TOOL: ${{ matrix.target == 'aarch64-apple-darwin' && 'tool' || '' }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          version=$(cat "$RUNNER_TEMP/cross/version.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/release/silk-$version-$TARGET.tar.gz" -C "$RUNNER_TEMP/unpacked"
          top="$RUNNER_TEMP/unpacked/silk-$version-$TARGET"
          echo "SILKC=$top/bin/silkc" >> "$GITHUB_ENV"
          .github/scripts/release-check.sh "$top" "$TARGET" "$RUNNER_TEMP/authored-inputs" "$RUNNER_TEMP/cross" \
            "$N1_SHA256" "$PROFILE_GUIDED" "$RUNNER_TEMP/check" $TOOL
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/check/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the native check
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-native-check-${{ matrix.target }}
          path: ${{ runner.temp }}/check/
          if-no-files-found: ignore
          retention-days: 7
      - name: Run a new project from the archive
        run: |
          mkdir "$RUNNER_TEMP/installed"
          .github/scripts/smoke-release-archive.sh "$RUNNER_TEMP/release/silk-$VERSION-$TARGET.tar.gz" "$VERSION" "$RUNNER_TEMP/installed"
      - name: Run the native corpus with the release compiler
        run: |
          set -euo pipefail
          node .github/scripts/bundle-selfhost-verification.mjs
          SILK_COMPILER="$SILKC" node .scratch/selfhost-verification.mjs --mode corpus-full | tee "$RUNNER_TEMP/corpus.log"
          node .github/scripts/check-corpus-log.mjs "$RUNNER_TEMP/corpus.log"
      # Darwin's TLS trust and the build tool sandbox are macOS-only code; Linux runs the same checks
      # with N1.
      - name: Verify native HTTPS trust and upgrade history
        if: matrix.target == 'aarch64-apple-darwin'
        run: SILK_COMPILER="$SILKC" node .github/scripts/test-native-https.mjs
      - name: Confine a build tool step with the macOS sandbox
        if: matrix.target == 'aarch64-apple-darwin'
        run: .github/scripts/test-build-tool-sandbox.sh "$SILKC" "$RUNNER_TEMP/authored-inputs/stdlib"
      # A Mac links Linux programs without a sysroot through the compiler's glibc 2.28 stubs.
      - name: Cross-build programs for both Linux targets without a sysroot
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-gnu:/lib64/ld-linux-x86-64.so.2 aarch64-unknown-linux-gnu:/lib/ld-linux-aarch64.so.1; do
            .github/scripts/cross-build-corpus.sh "$SILKC" "${target%%:*}" "$RUNNER_TEMP/${target%%:*}" '' \
              stdout-writer-hello native-thread-spawn-join
            .github/scripts/inspect-glibc-programs.sh "$RUNNER_TEMP/${target%%:*}" "${target#*:}"
          done

  # An Intel Mac checks the Intel archive natively: its compiler is the self-host fixpoint here,
  # and with Homebrew's LLVM, which Intel Mac users install, it builds and runs a new project. The
  # self-contained corpus, cross-built on Linux, covers the Intel-only runtime branches ($INODE64
  # stat and directory layouts).
  intel:
    name: Check the archive natively / x86_64-apple-darwin
    needs: cross
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      TARGET: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LLVM publishes no Intel macOS release. SourceSnapshot's canonical archive needs GNU tar.
      - name: Install Homebrew LLVM and GNU tar
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
        run: |
          set -euo pipefail
          brew install llvm lld gnu-tar
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-tar)/libexec/gnubin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-cross-x86_64-apple-darwin
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archive-x86_64-apple-darwin
          path: ${{ runner.temp }}/release
      - name: Check the archive's compiler is the self-host fixpoint on this target
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
          PROFILE_GUIDED: ${{ inputs.profile-guided }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          version=$(cat "$RUNNER_TEMP/cross/version.txt")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xzf "$RUNNER_TEMP/release/silk-$version-$TARGET.tar.gz" -C "$RUNNER_TEMP/unpacked"
          .github/scripts/release-check.sh "$RUNNER_TEMP/unpacked/silk-$version-$TARGET" "$TARGET" "$RUNNER_TEMP/authored-inputs" \
            "$RUNNER_TEMP/cross" "$N1_SHA256" "$PROFILE_GUIDED" "$RUNNER_TEMP/check"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-x86_64-apple-darwin
          path: ${{ runner.temp }}/check/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Run a new project from the archive
        run: |
          mkdir "$RUNNER_TEMP/installed"
          .github/scripts/smoke-release-archive.sh "$RUNNER_TEMP/release/silk-$VERSION-$TARGET.tar.gz" "$VERSION" "$RUNNER_TEMP/installed"
      - name: Run the self-contained corpus
        run: .github/scripts/run-cross-corpus.sh "$RUNNER_TEMP/cross/corpus"

  # Windows checks the ZIP natively and runs everything Windows-only: the corpus with the shipped
  # compiler, the no-CRT runtime programs, the compiler's response-file links, the floating
  # remainder against the UCRT, the tool's mapped-image self-update and the installer.
  verify-windows:
    name: Check the archive natively / x86_64-pc-windows-msvc
    needs: cross
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - uses: actions/download-artifact@v4
        with:
          name: release-cross-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/cross
      - uses: actions/download-artifact@v4
        with:
          name: silk-release-archive-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/release
      - name: Check the archive's compiler is the self-host fixpoint on this target
        shell: pwsh
        env:
          N1_SHA256: ${{ inputs.n1-sha256 }}
        run: |
          node compiler/scripts/SourceSnapshot.mjs restore "$env:RUNNER_TEMP/build-inputs" "$env:RUNNER_TEMP/authored-inputs" > $null
          if ($LASTEXITCODE -ne 0) { throw 'Input snapshot restore failed' }
          & .github/scripts/windows-release.ps1 -CrossDirectory "$env:RUNNER_TEMP/cross" -ReleaseDirectory "$env:RUNNER_TEMP/release" `
            -Snapshot "$env:RUNNER_TEMP/authored-inputs" -OutputDirectory "$env:RUNNER_TEMP/windows-native" -ProducerSha256 $env:N1_SHA256
          $version = (Get-Content "$env:RUNNER_TEMP/cross/version.txt" -Raw).Trim()
          "SILKC=$env:RUNNER_TEMP/windows-native/unpacked/silk-$version-x86_64-pc-windows-msvc/bin/silkc.exe" >> $env:GITHUB_ENV
          $candidate = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/candidate"
          Copy-Item "$env:RUNNER_TEMP/cross/x86_64-pc-windows-msvc/silkc.exe" "$candidate/silk-compiler-x86_64-pc-windows-msvc.exe"
          Copy-Item "$env:RUNNER_TEMP/windows-native/chain-receipt.json" "$candidate/chain-receipt-x86_64-pc-windows-msvc.json"
          node compiler/scripts/NativeSeed.mjs candidate "$env:RUNNER_TEMP/windows-native/chain-receipt.json" $env:GITHUB_RUN_ID "v$version" |
            Set-Content -Encoding utf8NoBOM "$candidate/native-seed-x86_64-pc-windows-msvc.json"
          if ($LASTEXITCODE -ne 0) { throw 'Seed candidate failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Run a new project from the ZIP and test the installer
        shell: pwsh
        run: |
          & .github/scripts/test-windows-installer-selection.ps1
          powershell -NoProfile -ExecutionPolicy Bypass -File .github/scripts/test-windows-installer-selection.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer release selection failed in Windows PowerShell' }
          $version = (Get-Content "$env:RUNNER_TEMP/cross/version.txt" -Raw).Trim()
          $archive = "$env:RUNNER_TEMP/release/silk-$version-x86_64-pc-windows-msvc.zip"
          & .github/scripts/smoke-release-archive.ps1 -Archive $archive -OutputDirectory "$env:RUNNER_TEMP/installed"
          & .github/scripts/test-windows-installer.ps1 -Archive $archive -OutputDirectory "$env:RUNNER_TEMP/installer-tests"
      - name: Run the no-CRT runtime programs, response-file links and floating remainder
        shell: pwsh
        run: |
          $llvm = Split-Path -Parent $env:SILK_TEST_CLANG
          & compiler/fixtures/windows-runtime/run.ps1 -ArtifactDirectory "$env:RUNNER_TEMP/cross/windows-programs" -LlvmBin $llvm
          & compiler/fixtures/windows-runtime/run-compiler.ps1 -Compiler $env:SILKC -OutputDirectory "$env:RUNNER_TEMP/windows-compiler" -LlvmBin $llvm
          & compiler/fixtures/windows-runtime/remainder-proof.ps1 -LlvmBin $llvm -OutputDirectory "$env:RUNNER_TEMP/windows-compiler/remainder"
      - name: Exercise the Windows tool and its mapped-image self-update
        shell: pwsh
        run: |
          & compiler/fixtures/windows-runtime/run-tool.ps1 -ToolDirectory "$env:RUNNER_TEMP/cross/windows-tool" `
            -Compiler $env:SILKC -OutputDirectory "$env:RUNNER_TEMP/windows-tool-results"
      - name: Run the native corpus with the release compiler
        shell: pwsh
        run: |
          node .github/scripts/bundle-selfhost-verification.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Corpus harness build failed' }
          $env:SILK_COMPILER = $env:SILKC
          $env:SILK_CLANG = $env:SILK_TEST_CLANG
          node .scratch/selfhost-verification.mjs --mode corpus-full 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/corpus.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows corpus verification failed' }
          node .github/scripts/check-corpus-log.mjs "$env:RUNNER_TEMP/corpus.log"
          if ($LASTEXITCODE -ne 0) { throw 'Windows corpus has failures' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-native-check-x86_64-pc-windows-msvc
          path: |
            ${{ runner.temp }}/windows-native/*.json
            ${{ runner.temp }}/windows-native/silk.exe
            ${{ runner.temp }}/installer-tests/results.json
            ${{ runner.temp }}/cross/windows-programs/*results.json
            ${{ runner.temp }}/windows-compiler/**/*.json
            ${{ runner.temp }}/windows-tool-results/*.json
            ${{ runner.temp }}/corpus.log
          if-no-files-found: ignore
          retention-days: 7
