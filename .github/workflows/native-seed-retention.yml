name: Native seed retention

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-seed-retention
  cancel-in-progress: false

jobs:
  prune:
    name: Report native seed releases outside the retention rule
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fetch main pin history
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Report the union of per-target retention rules. The script has no deletion mode.
      - name: Apply the retention rule
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node .github/scripts/prune-native-seeds.mjs "$GITHUB_REPOSITORY" origin/main | tee -a "$GITHUB_STEP_SUMMARY"
