name: Paired native tracing benchmarks

on:
  push:
    branches: [codex/tracing-perf-run]

permissions:
  contents: read
  actions: read

env:
  MAIN_SHA: 481001cc133071107bb6687384937d07f7d7f8b7
  MAIN_RUN: '44667745093'
  STAGE_SHA: b0ad16caf43d783a45755e8ddf15e714778b2802
  STAGE_RUN: '44678627706'

jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MAIN_SHA }}
          path: sources/main
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.STAGE_SHA }}
          path: sources/stage
          persist-credentials: false
      - uses: ./.github/actions/setup-linux-llvm
      - name: Download the optimized compilers and verify their build receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for side in main stage; do
            if [[ $side == main ]]; then run=$MAIN_RUN; else run=$STAGE_RUN; fi
            repo="$PWD/sources/$side"
            dest="$RUNNER_TEMP/inputs/$side"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n selfhost-native-n1 -D "$dest/bin"
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n selfhost-native-n1-diagnostics -D "$dest/receipt"
            receipt="$dest/receipt/build-receipt.json"
            commit=$(git -C "$repo" rev-parse HEAD)
            seed=$(jq -er '.seeds["x86_64-unknown-linux-gnu"].sha256' "$repo/compiler/native-seed.json")
            jq -e --arg commit "$commit" --arg seed "$seed" '
              .status == "passed" and .inputs.sourceCommit == $commit and
              .producer.sha256 == $seed and .target == "x86_64-unknown-linux-gnu" and
              .profile == {"optimization":"speed","debug":false,"profileGuided":false}
            ' "$receipt"
            printf '%s  %s\n' "$(jq -er .output.sha256 "$receipt")" "$dest/bin/N1" | sha256sum -c -
            printf '%s  %s\n' "$(jq -er .linker.sha256 "$receipt")" "$SILK_TEST_CLANG" | sha256sum -c -
            chmod 0555 "$dest/bin/N1"
          done
      - name: Measure alternating runs on this runner
        run: |
          set -euo pipefail
          args=(--main-repo sources/main --stage-repo sources/stage
                --main-n1 "$RUNNER_TEMP/inputs/main/bin/N1" --stage-n1 "$RUNNER_TEMP/inputs/stage/bin/N1"
                --clang "$SILK_TEST_CLANG")
          script=.github/scripts/trace-handoff-benchmark.py
          mkdir evidence
          python3 "$script" scheduler "${args[@]}" --out evidence/scheduler
          python3 "$script" selfbuild "${args[@]}" --out evidence/selfbuild
          cat evidence/{scheduler,selfbuild}/medians.json
      - name: Archive measurements and compiler logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tracing-benchmark-evidence
          retention-days: 30
          if-no-files-found: warn
          path: |
            evidence/*/inputs.json
            evidence/*/samples.jsonl
            evidence/*/medians.json
            evidence/*/pair-*/run.log
