name: Selfhost Silk

on:
  # A pull request into main runs on every push (one run at a time per PR). Branches
  # without such a PR (stack heads included) run only when dispatched (see .github/CI.md).
  # A main push gates only the managed stable merge: every other commit was gated as a PR, and
  # the nightly gates main's head again before publishing it.
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  # Explicit stable recovery still requires an exact managed release PR merge.
  workflow_dispatch:
    inputs:
      release:
        description: Verify only, publish a dev, or recover the stable merge on main
        type: choice
        options: [none, dev, stable]
        default: none

permissions:
  contents: read
  actions: read

env:
  # The shipped compiler does not verify its own MIR; every build and check in CI does, so a
  # lowering bug fails here instead of slowing every user's compile.
  SILK_VERIFY_MIR: '1'

concurrency:
  # All main gates/publications share one lock, so at most one release is in flight and the next
  # dev counter can come from the published tags. A queued run never cancels a publishing run.
  # Branch verification stays independent.
  group: ${{ github.ref == 'refs/heads/main' && 'compiler-publication' || format('selfhost-{0}', github.event.pull_request.number || github.ref_name) }}
  queue: max
  cancel-in-progress: false

jobs:
  release-plan:
    name: Plan the compiler publication
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      counter: ${{ steps.plan.outputs.counter }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ github.event_name == 'schedule' && 'dev' || inputs.release || 'none' }}
          EVENT: ${{ github.event_name }}
        run: node compiler/scripts/CompilerRelease.mjs plan "$GITHUB_SHA" "$MODE" "$EVENT"

  # The pinned seed builds N1 from the exact committed inputs.
  native-n1:
    name: Native N1 from pinned seed
    needs: release-plan
    # Pull requests and branch dispatches skip release-plan. On main the gate runs for a
    # publication (the nightly with a new head, the stable merge) or an explicit dispatch.
    if: >-
      !cancelled() && (needs.release-plan.result == 'skipped' || (needs.release-plan.result == 'success'
        && (needs.release-plan.outputs.mode == 'dev' || needs.release-plan.outputs.mode == 'stable'
          || github.event_name == 'workflow_dispatch')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.n1.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Read the seed pin
        id: pin
        run: node compiler/scripts/NativeSeed.mjs outputs compiler/native-seed.json x86_64-unknown-linux-gnu >> "$GITHUB_OUTPUT"
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - name: Download and verify the pinned seed before execution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/seed-download"
          mkdir "$RUNNER_TEMP/seed"
          node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json x86_64-unknown-linux-gnu "$RUNNER_TEMP/seed-download/$ASSET" "$RUNNER_TEMP/seed/seed"
          echo "SEED=$RUNNER_TEMP/seed/seed" >> "$GITHUB_ENV"
          echo "SEED_SHA256=${{ steps.pin.outputs.sha256 }}" >> "$GITHUB_ENV"
      - name: Build a planning compiler and project native release metadata
        if: needs.release-plan.outputs.mode == 'dev' || needs.release-plan.outputs.mode == 'stable'
        env:
          RELEASE_MODE: ${{ needs.release-plan.outputs.mode }}
          DEV_COUNTER: ${{ needs.release-plan.outputs.counter }}
        run: |
          set -euo pipefail
          # Release notes and versions belong to the silk tool (`silk change`), built from this
          # checkout outside the snapshot: by the seed, or by a planning N1 when the tool needs a
          # feature the seed lacks. Publication recomputes the release with the released tool.
          mkdir "$RUNNER_TEMP/planning"
          if ! (cd tool && "$SEED" build src/main.silk -o "$RUNNER_TEMP/planning/silk" --stdlib ../stdlib); then
            node compiler/scripts/NativeBuild.ts --producer "$SEED" --producer-sha256 "$SEED_SHA256" \
              --producer-generation seed --generation N1 --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/planning/n1" \
              --corpus-source "$GITHUB_WORKSPACE/corpus/native/trivial-features/main.silk"
            (cd tool && "$RUNNER_TEMP/planning/n1/N1" build src/main.silk -o "$RUNNER_TEMP/planning/silk" --stdlib ../stdlib)
          fi
          args=()
          if [ "$RELEASE_MODE" = dev ]; then args=(--dev "$DEV_COUNTER"); fi
          "$RUNNER_TEMP/planning/silk" change --dir "$RUNNER_TEMP/authored-inputs/compiler" \
            snapshot --commit "$GITHUB_SHA" "${args[@]}" --json > "$RUNNER_TEMP/compiler-release.json"
          mv "$RUNNER_TEMP/authored-inputs" "$RUNNER_TEMP/base-inputs"
          node compiler/scripts/SourceSnapshot.mjs project "$RUNNER_TEMP/base-inputs" \
            "$RUNNER_TEMP/compiler-release.json" "$RUNNER_TEMP/authored-inputs"
      - name: Stage the flat immutable-input artifact
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/build-inputs"
          cp "$RUNNER_TEMP/authored-inputs/input-snapshot.json" "$RUNNER_TEMP/authored-inputs/authored-inputs.tar" "$RUNNER_TEMP/build-inputs/"
          if [ -f "$RUNNER_TEMP/compiler-release.json" ]; then
            cp "$RUNNER_TEMP/compiler-release.json" "$RUNNER_TEMP/build-inputs/"
          fi
      - name: Share exact immutable build inputs
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs/
          if-no-files-found: error
          retention-days: 7
      - name: Build N1 with the seed and smoke it
        id: n1
        run: |
          set -euo pipefail
          if ! node compiler/scripts/NativeBuild.ts --producer "$SEED" --producer-sha256 "$SEED_SHA256" \
              --producer-generation seed --generation N1 --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/n1" \
              --corpus-source "$GITHUB_WORKSPACE/corpus/native/trivial-features/main.silk" \
              > "$RUNNER_TEMP/n1-receipt-stdout.json"; then
            jq -r '.failure // empty' "$RUNNER_TEMP/n1/build-receipt.json" || true
            echo "::error title=Pinned seed cannot build this checkout::If the compiler now uses a language feature the pinned seed lacks, land the compiler support first, advance compiler/native-seed.json to its published seed, then use the feature. For a broken chain, pin an earlier published seed."
            exit 1
          fi
          echo "sha256=$(jq -er .output.sha256 "$RUNNER_TEMP/n1/build-receipt.json")" >> "$GITHUB_OUTPUT"
      - name: Check the compiler's generated version against its manifest
        run: node compiler/scripts/CompilerRelease.mjs verify-build "$RUNNER_TEMP/n1/N1" "$RUNNER_TEMP/authored-inputs"
      # Make a verified compiler available to the independent Windows lane immediately.
      # Downstream Selfhost jobs still require every native-n1 check to pass.
      - name: Publish N1 for the fixpoint and corpus jobs
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1/N1
          if-no-files-found: error
          retention-days: 7
      - name: Preserve N1 receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1-diagnostics
          path: |
            ${{ runner.temp }}/n1/*.json
            ${{ runner.temp }}/n1/*.bin
            ${{ runner.temp }}/n1/*-rss.txt
          retention-days: 7

  # N1's tool, runtime and platform checks run beside the fixpoint instead of delaying it.
  n1-checks:
    name: Native N1 tool and runtime checks
    needs: native-n1
    if: ${{ !cancelled() && needs.native-n1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Static checks first: they need neither LLVM nor N1. The process tests read GNU time receipts.
      - name: Test the build and verification scripts
        run: |
          sudo apt-get install -y time > /dev/null
          pnpm test:scripts
      - name: Check the diagnostic catalog and the C bindings against the glibc 2.28 stubs
        run: |
          node compiler/scripts/DiagnosticCatalog.mjs
          node .github/scripts/check-glibc-baseline.mjs
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "N1=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Test silk change versioning, publication, and recovery with N1
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: '"$N1" test --manifest-path changes/silk.toml --root src/tests.silk --no-cache --stdlib stdlib'
      - name: Test the silk tool and the manifest editor with N1
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          "$N1" test --manifest-path tomledit/silk.toml --root src/tests.silk --no-cache --stdlib stdlib
          "$N1" test --manifest-path tool/silk.toml --root src/tests.silk --no-cache --stdlib stdlib
      - name: Verify native HTTPS trust and upgrade history
        run: SILK_COMPILER="$N1" SILK_CLANG="$SILK_TEST_CLANG" node .github/scripts/test-native-https.mjs
      - name: Verify native silk.http.client requests against loopback servers
        run: SILK_COMPILER="$N1" SILK_CLANG="$SILK_TEST_CLANG" node .github/scripts/test-native-http-client.mjs
      - name: Native HTTP/2 interoperability and conformance
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h2spec"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/summerwind/h2spec/releases/download/v2.6.0/h2spec_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/h2spec.tar.gz"
          echo "157ee0de702e01ad40e752dbf074b366027e550c8e7504f9450da2809e279318  $RUNNER_TEMP/h2spec.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/h2spec.tar.gz" -C "$RUNNER_TEMP/h2spec"
          SILK_COMPILER="$N1" SILK_CLANG="$SILK_TEST_CLANG" \
            SILK_H2SPEC="$RUNNER_TEMP/h2spec/h2spec" node .github/scripts/test-native-http2.mjs
      - name: Check the native build CLI and artifact forms with N1
        run: node compiler/scripts/test-native-build.ts "$N1" "$SILK_TEST_CLANG"
      - name: Verify C aggregate calls, callbacks and exports on wasm32
        run: node compiler/scripts/test-c-aggregates.ts "$N1" "$SILK_TEST_CLANG"
      - name: Install pinned WASI verification tools
        run: bash scripts/setup-wasi-tools.sh "$RUNNER_TEMP/wasi-tools"
      - name: Verify WASI Preview 1 commands and Preview 2 components
        run: node compiler/scripts/test-wasi.ts "$N1" "$SILK_TEST_CLANG" "$RUNNER_TEMP/wasi-tools"
      - name: Run a scripted silk lsp session with N1
        run: node compiler/scripts/test-native-lsp.ts "$N1"
      - name: Verify native filesystem publication and durability boundaries
        run: SILK_COMPILER="$N1" SILK_CLANG="$SILK_TEST_CLANG" node compiler/conformance/native-filesystem/run-publication.mjs
      - name: Verify JSON Schema drafts and the manifest schema
        run: |
          SILK="$N1" SILK_CLANG="$SILK_TEST_CLANG" integration/json-schema-conformance/check-json-schema
          SILK="$N1" SILK_CLANG="$SILK_TEST_CLANG" integration/json-schema-conformance/check-json-schema --manifest-schema

  # Publishing runs optimize the release compilers by a profile: N1 builds an instrumented
  # compiler, which trains on a check and an IR emission of the compiler. The self-host fixpoint
  # itself is release-cross's: every archive's compiler must emit N1's IR on its own target.
  compiler-profile:
    name: Train the release compiler profile
    needs: [release-plan, native-n1]
    if: >-
      !cancelled() && needs.native-n1.result == 'success'
      && (needs.release-plan.outputs.mode == 'dev' || needs.release-plan.outputs.mode == 'stable')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - name: Train the profile on the exact immutable inputs
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          echo "$N1_SHA256  $RUNNER_TEMP/n1/N1" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/n1/N1"
          node compiler/scripts/SourceSnapshot.mjs restore "$RUNNER_TEMP/build-inputs" "$RUNNER_TEMP/authored-inputs" > /dev/null
          (cd "$RUNNER_TEMP/authored-inputs/compiler" && "$GITHUB_WORKSPACE/.github/scripts/profile-guided-build.sh" \
            "$RUNNER_TEMP/profile-guided" "$RUNNER_TEMP/n1/N1" "$RUNNER_TEMP/authored-inputs" src/main.silk - \
            --stdlib ../stdlib --optimization speed --debug false)
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-compiler-profile
          path: ${{ runner.temp }}/profile-guided/compiler.profdata
          if-no-files-found: error
          retention-days: 7

  corpus:
    name: Selfhost native corpus
    needs: native-n1
    if: ${{ !cancelled() && needs.native-n1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      # The verification harness is built from this checkout without the TypeScript compiler; N1
      # compiles every corpus program.
      - name: Build the verification harness
        run: |
          node .github/scripts/bundle-selfhost-verification.mjs
          echo "SELFHOST_VERIFICATION=$GITHUB_WORKSPACE/.scratch/selfhost-verification.mjs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILK_COMPILER=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      # The verification harness checks the intrinsic catalog and that the N1-built gate leaves every
      # tracked source unchanged; it neither builds a compiler nor runs programs.
      - name: Build the formatter safety gate with N1
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          "$SILK_COMPILER" build "$GITHUB_WORKSPACE/compiler/src/format_gate.silk" -o "$RUNNER_TEMP/silk-format-gate" --stdlib "$GITHUB_WORKSPACE/stdlib"
          echo "SILK_FORMAT_GATE=$RUNNER_TEMP/silk-format-gate" >> "$GITHUB_ENV"
      - name: Verify repository formatting
        run: node "$SELFHOST_VERIFICATION"
      # The harness runs one case per core: 419 cases took 4m20s on 2026-10-12 (1033 s of case
      # time; 545 s when it ran them one at a time), so one job is enough.
      - name: Run native corpus with N1
        shell: bash
        run: |
          set -euo pipefail
          node "$SELFHOST_VERIFICATION" --mode corpus-full | tee "$RUNNER_TEMP/selfhost-corpus.log"
      # The language server checks one module at a time; its module roots must reject exactly what
      # the whole-package check rejects. 621 programs took 50 s on 4 cores on 2026-10-21.
      - name: Compare module check roots with the package check on the corpus
        run: compiler/scripts/check-roots-corpus.sh "$SILK_COMPILER" stdlib "$(nproc)"
      # The harness already fails when a pinned program does not pass; every other outcome must
      # pass too.
      - name: Check the corpus has no failures
        run: node .github/scripts/check-corpus-log.mjs "$RUNNER_TEMP/selfhost-corpus.log"
      - name: Check the corpus borrow-check gap baseline
        run: |
          node .github/scripts/check-borrow-gap.mjs self-test
          node .github/scripts/check-borrow-gap.mjs corpus "$RUNNER_TEMP/selfhost-corpus.log"
      # Programs built from repository sources outside the corpus (conformance programs and
      # examples) must keep building; doctest covers the standard library's examples.
      - name: Build the repository's other programs
        run: node compiler/scripts/RepositoryCoverage.ts "$SILK_COMPILER" "$RUNNER_TEMP/repository-coverage"
      # Debian 10 ships glibc 2.28, the oldest glibc the Linux stubs admit; the corpus run above
      # already ran these programs on this runner's glibc.
      - name: Run programs linked without a sysroot on glibc 2.28
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          .github/scripts/cross-build-corpus.sh "$SILK_COMPILER" x86_64-unknown-linux-gnu "$RUNNER_TEMP/glibc-2.28" ''
          .github/scripts/inspect-glibc-programs.sh "$RUNNER_TEMP/glibc-2.28" /lib64/ld-linux-x86-64.so.2
          docker run --rm -v "$PWD/.github/scripts:/scripts:ro" -v "$RUNNER_TEMP/glibc-2.28:/programs" \
            debian:buster bash /scripts/run-cross-corpus.sh /programs
      # A manifest's explicit platform supply links against that sysroot and support files instead
      # of the stubs: the program binds a glibc symbol version newer than the stubs admit.
      - name: Link and run programs through an explicit sysroot
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          gcc=$(ls -d /usr/lib/gcc/x86_64-linux-gnu/* | sort -V | tail -n 1)
          linker="$(dirname "$SILK_TEST_CLANG")/ld.lld"
          supply="{ kind = \"explicit\", target = \"x86_64-unknown-linux-gnu\", root = \"/\", linker = \"$linker\", origin = \"libc6-dev\", support = [{ root = \"$gcc\", target = \"x86_64-unknown-linux-gnu\", origin = \"gcc\" }] }"
          .github/scripts/cross-build-corpus.sh "$SILK_COMPILER" x86_64-unknown-linux-gnu "$RUNNER_TEMP/sysroot" "$supply" \
            stdout-writer-hello native-thread-spawn-join
          .github/scripts/run-cross-corpus.sh "$RUNNER_TEMP/sysroot"
          # Since 2.34 glibc versions pthread_create and __libc_start_main at GLIBC_2.34; the stubs stop at 2.28.
          llvm-readelf --dyn-syms "$RUNNER_TEMP"/sysroot/*/program | grep 'GLIBC_2\.3[4-9]' > /dev/null
      - name: Upload the corpus log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-corpus-log
          path: ${{ runner.temp }}/selfhost-corpus.log
          retention-days: 7

  # Incremental rechecks: N1 replays scripted edits through a revisable semantic store and fails
  # when a step reruns more units, marks more outdated or demands more than its budget in
  # compiler/fixtures/replay/budgets.json. The stdlib and corpus replays also check each revision
  # in a fresh one-shot store and require the same rejections.
  incremental:
    name: Incremental replay budgets
    needs: native-n1
    if: ${{ !cancelled() && needs.native-n1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILK_COMPILER=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Replay the standard library against its budgets
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/stdlib-root"
          cp -a "$PWD/stdlib/." "$RUNNER_TEMP/stdlib-root/"
          cp "$PWD/compiler/fixtures/stdlib-root/silk.toml" \
            "$PWD/compiler/fixtures/stdlib-root/stdlib_check.silk" \
            "$RUNNER_TEMP/stdlib-root/"
          (cd "$RUNNER_TEMP/stdlib-root" && "$SILK_COMPILER" check --stdlib "$RUNNER_TEMP/stdlib-root" \
            --replay "$GITHUB_WORKSPACE/compiler/fixtures/replay/stdlib.toml" --differential) | tee "$RUNNER_TEMP/stdlib-replay.log"
          node .github/scripts/check-replay-budgets.mjs "$RUNNER_TEMP/stdlib-replay.log" \
            compiler/fixtures/replay/budgets.json stdlib
          (cd "$RUNNER_TEMP/stdlib-root" && "$SILK_COMPILER" check --stdlib "$RUNNER_TEMP/stdlib-root" \
            --replay "$GITHUB_WORKSPACE/compiler/fixtures/replay/stdlib-long.toml") | tee "$RUNNER_TEMP/stdlib-long-replay.log"
          node .github/scripts/check-replay-budgets.mjs "$RUNNER_TEMP/stdlib-long-replay.log" \
            compiler/fixtures/replay/budgets.json stdlib-long
      - name: Replay every corpus program in both stores
        run: node .github/scripts/replay-corpus.mjs "$SILK_COMPILER" "$PWD/corpus" "$RUNNER_TEMP/replay-corpus" "$PWD/stdlib"
      # The compiler replay keeps one store; a differential run needs two and more memory than a
      # runner has. The edits apply to a copy, beside the path dependencies it names.
      - name: Replay the compiler against its budgets
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compiler-replay"
          cp -a "$PWD/compiler" "$PWD/changes" "$PWD/tomledit" "$RUNNER_TEMP/compiler-replay/"
          (cd "$RUNNER_TEMP/compiler-replay/compiler" && "$SILK_COMPILER" check --stdlib "$GITHUB_WORKSPACE/stdlib" \
            --replay "$GITHUB_WORKSPACE/compiler/fixtures/replay/compiler.toml") | tee "$RUNNER_TEMP/compiler-replay.log"
          node .github/scripts/check-replay-budgets.mjs "$RUNNER_TEMP/compiler-replay.log" \
            compiler/fixtures/replay/budgets.json compiler

  # Compiler source tests: N1 builds each root's bundled runner with `silk test`. One build per
  # root dominates the time, so two roots import every case module, built without optimization.
  # The optimized compiler's behaviour is proven by release-cross's fixpoint and the corpus, not
  # by these tests. hir/LoweringCases stays optimized: it brings in the parser's stack budget
  # cases, which are calibrated for the optimized compiler.
  native-cases:
    name: Native selfhost cases
    needs: native-n1
    if: ${{ !cancelled() && needs.native-n1.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILK_COMPILER=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Check native standard-library reference and examples
        run: |
          set -euo pipefail
          "$SILK_COMPILER" doc-reference --stdlib-root "$PWD/stdlib" \
            --output "$PWD/reference/stdlib" --check
          "$SILK_COMPILER" doctest --stdlib --stdlib-root "$PWD/stdlib"
      - name: Run the compiler source tests with N1
        env:
          SILK_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          set -euo pipefail
          for root in SemanticRootCases ToolRootCases; do
            echo "::group::$root"
            "$SILK_COMPILER" test "$PWD/compiler/src/$root.silk" -o "$RUNNER_TEMP/$root-tests" --stdlib "$PWD/stdlib" \
              --optimization none --no-cache
            echo "::endgroup::"
          done
          "$SILK_COMPILER" test "$PWD/compiler/src/hir/LoweringCases.silk" -o "$RUNNER_TEMP/hir-tests" --stdlib "$PWD/stdlib" \
            --optimization speed --no-cache

  # Every release archive is cross-built on Linux from this run's N1 and checked on its own target's
  # runner. Publishing runs build them with the trained profile.
  release-cross:
    needs: [release-plan, native-n1, compiler-profile]
    if: >-
      !cancelled() && needs.native-n1.result == 'success'
      && (needs.compiler-profile.result == 'success' || needs.compiler-profile.result == 'skipped')
    uses: ./.github/workflows/release-cross.yml
    with:
      n1-sha256: ${{ needs.native-n1.outputs.sha256 }}
      profile-guided: ${{ needs.release-plan.outputs.mode == 'dev' || needs.release-plan.outputs.mode == 'stable' }}

  # Stable merge and dev publication share the exact same native gates.
  publish-release:
    name: Publish the planned compiler release
    # Focused Linux Silk stands for every gate job.
    needs: [release-plan, silk]
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.release-plan.result == 'success'
      && (needs.release-plan.outputs.mode == 'dev' || needs.release-plan.outputs.mode == 'stable')
      && needs.silk.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every compiler, receipt and pin comes from release-cross, which checked the shipped bytes on
      # each target's runner.
      - uses: actions/download-artifact@v4
        with:
          pattern: selfhost-native-candidate-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      # The release archives: each target's compiler as `bin/silkc` and the silk tool as `bin/silk` beside its standard library.
      - uses: actions/download-artifact@v4
        with:
          pattern: silk-release-archive-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-build-inputs
          path: ${{ runner.temp }}/build-inputs
      - name: Validate exact source projection and compiler identity
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/build-inputs/input-snapshot.json" "$RUNNER_TEMP/build-inputs/authored-inputs.tar" .
          node "$GITHUB_WORKSPACE/compiler/scripts/SourceSnapshot.mjs" restore . "$RUNNER_TEMP/release-source" > /dev/null
          (cd "$GITHUB_WORKSPACE" && node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/publishing-base" "$GITHUB_SHA") > /dev/null
          cp "$RUNNER_TEMP/build-inputs/compiler-release.json" "$RUNNER_TEMP/compiler-release.json"
          test "$(jq -er .sourceCommit input-snapshot.json)" = "$GITHUB_SHA"
          node "$GITHUB_WORKSPACE/compiler/scripts/NativeSeed.mjs" verify native-seed-x86_64-unknown-linux-gnu.json x86_64-unknown-linux-gnu \
            silk-compiler-x86_64-unknown-linux-gnu "$RUNNER_TEMP/release-compiler" > /dev/null
          # The released silk tool recomputes the release the planning tool projected.
          linux=(silk-*-x86_64-unknown-linux-gnu.tar.gz)
          test "${#linux[@]}" = 1
          tar -xzOf "${linux[0]}" "${linux[0]%.tar.gz}/bin/silk" > "$RUNNER_TEMP/release-silk"
          chmod +x "$RUNNER_TEMP/release-silk"
          args=()
          if [ "${{ needs.release-plan.outputs.mode }}" = dev ]; then args=(--dev "${{ needs.release-plan.outputs.counter }}"); fi
          "$RUNNER_TEMP/release-silk" change --dir "$RUNNER_TEMP/publishing-base/compiler" snapshot \
            --commit "$GITHUB_SHA" "${args[@]}" --json > "$RUNNER_TEMP/recomputed-release.json"
          cmp "$RUNNER_TEMP/compiler-release.json" "$RUNNER_TEMP/recomputed-release.json"
          jq -e '.package == "silk-compiler"' "$RUNNER_TEMP/compiler-release.json" > /dev/null
          version=$(jq -er .version "$RUNNER_TEMP/compiler-release.json")
          test "$("$RUNNER_TEMP/release-compiler" --version)" = "silk v$version"
          cp "$RUNNER_TEMP/release-source/compiler/changes-snapshot.toml" changes-snapshot.toml
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # The release's `native-seed.json` names every target's compiler: installers check each
      # archive's compiler against it. The repository pin keeps only its x86-64 Linux entry, since
      # every other target is cross-built from it.
      - name: Assemble the release's compiler list
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          # Every target receipt names the same exact publishing commit and projected inputs.
          jq -s --arg tag "v$VERSION" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schemaVersion: 2, seeds: (map(.seeds) | add | with_entries(.value |=
              (.tag = $tag | .sourceCommit = $sha | .runId = $run)))}' \
            native-seed-*.json > native-seed.json
          rm native-seed-*.json
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Publish the immutable compiler release
        working-directory: ${{ runner.temp }}/candidate
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          files=(native-seed.json input-snapshot.json authored-inputs.tar changes-snapshot.toml)
          # Only the installable binaries are signed: pins and receipts are compared modulo run ids, not byte for byte.
          signed=()
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin x86_64-apple-darwin x86_64-pc-windows-msvc; do
            asset="silk-compiler-$target"
            if [ "$target" = x86_64-pc-windows-msvc ]; then asset+=.exe; fi
            node "$GITHUB_WORKSPACE/compiler/scripts/NativeSeed.mjs" outputs native-seed.json "$target" > /dev/null
            receipt="chain-receipt-$target.json"
            test "$(jq -er --arg target "$target" '.seeds[$target].tag' native-seed.json)" = "$tag"
            test "$(jq -er --arg target "$target" '.seeds[$target].sourceCommit' native-seed.json)" = "$GITHUB_SHA"
            sha=$(jq -er --arg target "$target" '.seeds[$target].sha256' native-seed.json)
            echo "$sha  $asset" | sha256sum -c -
            test "$sha" = "$(jq -er .output.sha256 "$receipt")"
            test "$(jq -er .target "$receipt")" = "$target"
            test "$(jq -er .fixpoint.producerIrSha256 "$receipt")" = "$(jq -er .fixpoint.outputIrSha256 "$receipt")"
            test "$(jq -er .inputs.normalizedDigest "$receipt")" = "$(jq -er .normalizedDigest input-snapshot.json)"
            test "$(jq -er .inputs.sourceCommit "$receipt")" = "$GITHUB_SHA"
            test "$(jq -er .inputs.archiveSha256 "$receipt")" = "$(jq -er .archiveSha256 input-snapshot.json)"
            # The installable archive must carry this exact compiler.
            top="silk-$VERSION-$target"
            if [ "$target" = x86_64-pc-windows-msvc ]; then
              archives=("$top.zip")
              unzip -t "${archives[0]}" > /dev/null
              test "$(unzip -p "${archives[0]}" "$top/bin/silkc.exe" | sha256sum | cut -d' ' -f1)" = "$sha"
              unzip -Z1 "${archives[0]}" | grep -Fx "$top/bin/silk.exe" > /dev/null
              unzip -p "${archives[0]}" "$top/lib/silk/changes-snapshot.toml" > "$RUNNER_TEMP/embedded-snapshot.toml"
            else
              archives=("$top.tar.gz")
              test "$(tar -xzOf "${archives[0]}" "$top/bin/silkc" | sha256sum | cut -d' ' -f1)" = "$sha"
              tar -tzf "${archives[0]}" | grep -Fx "$top/bin/silk" > /dev/null
              tar -xzOf "${archives[0]}" "$top/lib/silk/changes-snapshot.toml" > "$RUNNER_TEMP/embedded-snapshot.toml"
            fi
            cmp changes-snapshot.toml "$RUNNER_TEMP/embedded-snapshot.toml"
            files+=("$asset" "$receipt" "${archives[0]}")
            signed+=("$asset" "${archives[0]}")
          done
          node "$GITHUB_WORKSPACE/compiler/scripts/ScoopManifest.mjs" "$VERSION" \
            "silk-$VERSION-x86_64-pc-windows-msvc.zip" silk.json
          files+=(silk.json)
          signed+=(silk.json)
          # The docs site's playground: the compiler for wasm32-wasip1, the stdlib and the examples.
          playground="silk-$VERSION-playground.tar.gz"
          tar -xzOf "$playground" "${playground%.tar.gz}/manifest.json" | jq -e --arg version "$VERSION" '.version == $version' > /dev/null
          files+=("$playground")
          "$GITHUB_WORKSPACE/scripts/sign-release.sh" "$tag" "${signed[@]}"
          for file in "${signed[@]}"; do files+=("$file.minisig"); done
          node "$GITHUB_WORKSPACE/compiler/scripts/CompilerRelease.mjs" publish \
            "$RUNNER_TEMP/compiler-release.json" "$PWD" "${files[@]}"
          {
            echo "### Silk $VERSION"
            echo "Release: \`$tag\`"
            echo '```json'
            cat native-seed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The one required check: every gate job passed. Main pushes outside a release skip the gate.
  silk:
    name: Focused Linux Silk
    if: always() && (github.event_name == 'pull_request' || needs.native-n1.result != 'skipped')
    needs: [native-n1, n1-checks, corpus, incremental, native-cases, release-cross]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every job
        run: jq -e 'length > 0 and all(.[]; . == "success")' <<< '${{ toJSON(needs.*.result) }}'
