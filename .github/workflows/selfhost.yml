name: Selfhost Silk

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  silk:
    name: Focused Linux Silk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check main-first bootstrap provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - name: Identify bootstrap inputs
        id: bootstrap-key
        shell: bash
        run: |
          set -euo pipefail
          digest=$(git ls-files -s -- packages/ scripts/ config/ .github/actions/setup-linux-llvm/ package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .node-version | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      # Turbo owns the dist output fingerprints. This archive is keyed by tracked bootstrap
      # inputs and the pinned Linux/Node/LLVM host, so native-only changes can replay builds.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: selfhost-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ steps.bootstrap-key.outputs.node }}-llvm22.1.8-${{ steps.bootstrap-key.outputs.digest }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build bootstrap CLI
        run: CI=true node scripts/turbo.mjs run build --filter=@silklang/cli...
      - name: Run M1 semantic cases
        run: node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/M1Cases.silk --no-cache
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Run exact integer HIR cases
        run: node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/hir/LoweringCases.silk --filter integer --no-cache
