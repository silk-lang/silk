name: Selfhost Silk

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost
      # A native stack's upper PRs target another compiler feature branch. Check their complete
      # heads as well; stack merge requires the top head, not each intermediate layer, to pass.
      - selfhost-*
      - julia/step*
  # Runs the whole workflow on a branch, including the macOS leg, for changes to target or ABI code.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A newer PR head supersedes the old one. Every selfhost push gets its own group, so no merge's
  # run is replaced while it waits; a push whose tree a green PR run already tested reuses it.
  group: selfhost-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A selfhost merge usually has exactly the tree its PR's last green run tested (the coordinator
  # merges selfhost into a PR and gets it green right before merging). A push or dispatch on a merge
  # commit whose full tree equals the tree a fully green pull_request run of its second parent
  # checked out reuses that run's verdict and N2 instead of running the gate again. Anything else,
  # including a missing or unverifiable artifact, runs the full gate.
  reuse:
    name: Reuse a green PR run of the same tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reused: ${{ steps.find.outputs.reused }}
      run-id: ${{ steps.find.outputs.run-id }}
      n1-sha256: ${{ steps.find.outputs.n1-sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Find a fully green PR run that tested this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          full() {
            echo "reused=false" >> "$GITHUB_OUTPUT"
            printf '### Full gate\n%s\n\nTree `%s`.\n' "$1" "$tree" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT" = pull_request ] && full 'Pull request runs always run the full gate.'
          head=$(git rev-parse --verify --quiet 'HEAD^2') || full 'HEAD is not a merge commit.'
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/selfhost.yml/runs?event=pull_request&head_sha=$head&per_page=20" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id')
          for id in $runs; do
            dir="$RUNNER_TEMP/reuse-$id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name selfhost-tested-tree --dir "$dir/tree" 2> /dev/null || continue
            [ "$(cat "$dir/tree/tree")" = "$tree" ] || continue
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name selfhost-native-candidate --dir "$dir/candidate" 2> /dev/null || continue
            cd "$dir/candidate"
            sha=$(sha256sum silk-compiler-x86_64-unknown-linux-gnu | cut -d' ' -f1)
            if [ "$sha" = "$(jq -er .seed.sha256 native-seed.json)" ] && [ "$sha" = "$(jq -er .output.sha256 chain-receipt.json)" ] \
                && [ "$(jq -er .fixpoint.producerIrSha256 chain-receipt.json)" = "$(jq -er .fixpoint.outputIrSha256 chain-receipt.json)" ]; then
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              {
                echo "reused=true"
                echo "run-id=$id"
                echo "n1-sha256=$(jq -er .producer.sha256 chain-receipt.json)"
              } >> "$GITHUB_OUTPUT"
              printf '### Reused a green PR run\nRun [%s](%s) tested PR head `%s` with the same tree `%s`. Its verdict and N2 `%s` stand for this commit; the gate jobs are skipped.\n' \
                "$id" "$url" "$head" "$tree" "$sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
          done
          full "No fully green pull_request run of \`$head\` has this tree and a verifiable N2."

  # The pinned seed builds N1 from the exact committed inputs. See compiler/docs/native-seed-chain.md.
  native-n1:
    name: Native N1 from pinned seed
    needs: reuse
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.n1.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check main-first bootstrap provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - name: Check native generation contracts
        uses: ./.github/actions/check-native-contracts
      - name: Read the seed pin
        id: pin
        run: node compiler/scripts/NativeSeed.mjs outputs compiler/native-seed.json >> "$GITHUB_OUTPUT"
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - name: Download and verify the pinned seed before execution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/seed-download"
          mkdir "$RUNNER_TEMP/seed"
          node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json "$RUNNER_TEMP/seed-download/$ASSET" "$RUNNER_TEMP/seed/seed"
          echo "SEED=$RUNNER_TEMP/seed/seed" >> "$GITHUB_ENV"
          echo "SEED_SHA256=${{ steps.pin.outputs.sha256 }}" >> "$GITHUB_ENV"
      - name: Build N1 with the seed and smoke it
        id: n1
        run: |
          set -euo pipefail
          if ! node compiler/scripts/NativeBuild.ts --producer "$SEED" --producer-sha256 "$SEED_SHA256" \
              --producer-generation seed --generation N1 --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/n1" \
              --corpus-source "$GITHUB_WORKSPACE/packages/compiler/test/support/corpus.ts" \
              > "$RUNNER_TEMP/n1-receipt-stdout.json"; then
            jq -r '.failure // empty' "$RUNNER_TEMP/n1/build-receipt.json" || true
            echo "::error title=Pinned seed cannot build this checkout::If the compiler now uses a language feature the pinned seed lacks, land the compiler support first, advance compiler/native-seed.json to its published seed, then use the feature. For a broken chain, pin an earlier published seed. See compiler/docs/native-seed-chain.md#recovery."
            exit 1
          fi
          echo "sha256=$(jq -er .output.sha256 "$RUNNER_TEMP/n1/build-receipt.json")" >> "$GITHUB_OUTPUT"
      - name: Publish N1 for the fixpoint and corpus jobs
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1/N1
          if-no-files-found: error
          retention-days: 7
      # A pull_request run checks out refs/pull/N/merge; a later push of that tree may reuse the run.
      - name: Record the tested tree
        run: |
          mkdir "$RUNNER_TEMP/tested-tree"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree/tree"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-tested-tree
          path: ${{ runner.temp }}/tested-tree/tree
          if-no-files-found: error
          retention-days: 7
      - name: Preserve N1 receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1-diagnostics
          path: |
            ${{ runner.temp }}/n1/*.json
            ${{ runner.temp }}/n1/*.bin
            ${{ runner.temp }}/n1/*-rss.txt
          retention-days: 7

  # The required check: N1 builds N2, both emit the compiler's LLVM IR, and the bytes are equal.
  native-fixpoint:
    name: Native seed chain (N2 fixpoint)
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - name: Build N2 with N1, compare their compiler IR, and smoke N2
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          if ! node compiler/scripts/NativeBuild.ts --producer "$RUNNER_TEMP/compilers/N1" --producer-sha256 "$N1_SHA256" \
              --producer-generation N1 --generation N2 --fixpoint --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/n2" \
              --corpus-source "$GITHUB_WORKSPACE/packages/compiler/test/support/corpus.ts" \
              > "$RUNNER_TEMP/n2-receipt-stdout.json"; then
            jq -r '.failure // empty' "$RUNNER_TEMP/n2/build-receipt.json" || true
            exit 1
          fi
          jq '{output, fixpoint, stages: [.stages[] | {name, wallTimeMs, peakRss: .peakRss.value}]}' "$RUNNER_TEMP/n2/build-receipt.json"
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/n2/N2" "$RUNNER_TEMP/candidate/silk-compiler-x86_64-unknown-linux-gnu"
          cp "$RUNNER_TEMP/n2/build-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt.json"
          node compiler/scripts/NativeSeed.mjs candidate "$RUNNER_TEMP/n2/build-receipt.json" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/candidate/native-seed.json"
      - name: Publish the seed candidate files
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixpoint receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-fixpoint-diagnostics
          path: |
            ${{ runner.temp }}/n2/*.json
            ${{ runner.temp }}/n2/*.bin
            ${{ runner.temp }}/n2/*-rss.txt
          retention-days: 7
      - name: Preserve differing compiler IR
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-fixpoint-ir
          path: ${{ runner.temp }}/n2/*.ll
          retention-days: 7

  corpus:
    name: Selfhost native corpus
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.github/actions/setup-linux-llvm
      # Only the verification harness comes from main; N1 compiles every corpus program.
      - uses: ./.github/actions/download-bootstrap
        id: bootstrap
        with:
          verification: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILKC=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      # The verification harness checks the intrinsic catalog and that the N1-built gate leaves every
      # tracked source unchanged; it neither builds a compiler nor runs programs.
      - name: Build the formatter safety gate with N1
        env:
          SILKC_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          "$SILKC" build "$GITHUB_WORKSPACE/compiler/src/format_gate.silk" -o "$RUNNER_TEMP/silk-format-gate" --stdlib "$GITHUB_WORKSPACE/packages/compiler/stdlib"
          echo "SILK_FORMAT_GATE=$RUNNER_TEMP/silk-format-gate" >> "$GITHUB_ENV"
      - name: Verify repository formatting
        run: node "$SELFHOST_VERIFICATION"
        env:
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
      - name: Capture formatted repository samples
        run: |
          python3 - "$RUNNER_TEMP/formatter-samples.md" <<'PYTHON'
          import pathlib, sys
          samples = ['compiler/src/lexer/Span.silk', 'compiler/src/format/ExpressionLayout.silk', 'packages/compiler/stdlib/silk/option.silk']
          with open(sys.argv[1], 'w') as output:
              for name in samples:
                  lines = pathlib.Path(name).read_text().splitlines()[:65]
                  output.write(f'### {name}\n\n```silk\n' + '\n'.join(lines) + '\n```\n\n')
          PYTHON
      # The native corpus itself is ~40 s of case time: not worth sharding.
      - name: Run native corpus with N1
        shell: bash
        run: |
          set -euo pipefail
          node "$SELFHOST_VERIFICATION" --mode corpus-full | tee "$RUNNER_TEMP/selfhost-corpus.log"
        env:
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
      - name: Check native format command on canonical repository source
        working-directory: compiler
        run: '"$SILKC" format src/lexer/Span.silk --check'
      - name: Check B11 parsed-source retention baseline
        run: |
          node --input-type=module - "$RUNNER_TEMP/selfhost-corpus.log" <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.argv[2], 'utf8').split('\n')
          // Preserve merged #615's baseline and exact-head verified Step 8 callable passes.
          const baselinePasses = [
            'trivial-features',
            'foreign-libc-pointer-roundtrip',
            'foreign-libc-floating',
            'else-if-chain',
            'scalar-reference-read',
            'scalar-reference-write-through',
            'operator-precedence',
            'operator-negation-overflow-trap',
            'mutable-scalar-loop',
            'nested-loops',
            'foreign-libc-abs',
            'retained-if-let-match-binding',
            'scalar-enum-equality-from-borrowed-variant',
            'while-entry-backedge',
            'generic-record-instances',
            'generic-union-instances',
            'generic-lifetime-selected-cleanup',
            'anonymous-callable-capture-modes',
            'captured-exclusive-reference-parameters',
            'staged-callable-bindings',
            'staged-callable-parameter',
            'operator-pipeline',
            'staged-callable-section',
            'native-descriptor-write',
            'callable-return-and-borrow-contracts',
            'borrowed-capture-section',
            'relayed-section',
            'generic-item-pipeline-in-generic-owner',
            'constrained-section-generic-owner',
            'owner-typed-direct-section',
            'option-result-combinators',
            'opaque-callable',
            'effect-nested-failure-propagation',
            'effect-selective-catch-direct-stored',
            'effect-ensuring-fallible-finalizer',
            'role-keyed-service-provider-selection',
            'owned-provider-shared-dispatch',
            'constrained-callable-forwarding',
            'constrained-section-two-applications',
            'stdout-writer-hello',
            'effect-higher-order-values',
            'effect-return-site-join-once',
            'finite-effect-join-capture-arity',
            'match-statement-arm-control',
            'effect-access-forwarding',
            'opaque-effect',
            'ordinary-union-executable-members',
            'static-byte-view-bounds',
          ]
          const acceptedFailures = new Set([
            'ecdsa-p256-verification',
            'http-client-request',
            'json-scanner',
            'toml-scanner',
            'borrowed-temporary-stream-suspension',
            'integer-operation-matrix',
            'float-operation-matrix',
            'chacha20-poly1305',
            'aes-gcm',
            'rsa-verification',
            'fixed-output-sha',
            'pointer-parameter-write',
            'foreign-libc-qsort-callback',
            'foreign-libc-environ-static',
            'secure-random-provider',
          ])
          const passes = new Set(lines.filter((line) => line.startsWith('PASS ')).map((line) => line.slice(5)))
          for (const name of baselinePasses) {
            if (!passes.has(name)) throw new Error(`Baseline PASS lost: ${name}`)
          }
          for (const line of lines.filter((line) => line.startsWith('FAIL '))) {
            const name = line.slice(5).split(':', 1)[0]
            if (!acceptedFailures.has(name)) throw new Error(`New corpus failure: ${line}`)
          }
          if (lines.some((line) => /(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)/.test(line))) {
            throw new Error('Corpus has a runtime mismatch, runner failure, or module-source gap')
          }
          const timings = lines.filter((line) => line.startsWith('SELFHOST_CASE_TIMING='))
          const outcomes = lines.filter((line) => /^(?:PASS|FAIL|UNSUPPORTED) /.test(line))
          if (timings.length !== outcomes.length || outcomes.length === 0) throw new Error('Incomplete corpus timing receipt')
          console.log(`Preserved ${baselinePasses.length} baseline passes; remaining failures are accepted baseline programs`)
          JS
      - name: Upload corpus build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-corpus-timings
          path: ${{ runner.temp }}/selfhost-corpus.log
          retention-days: 7
      - name: Upload native formatter safety and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-formatter-safety
          path: |
            ${{ runner.temp }}/formatter-safety.log
            ${{ runner.temp }}/formatter-samples.md
          retention-days: 7

  # Source test shards: N1 builds each root's bundled runner with `silkc test`. They run on PRs
  # too, since a PR's N1 is the compiler that would run them after merge.
  native-cases:
    name: Native selfhost cases (${{ matrix.shard }})
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: format-m1-hir
            roots: src/format/FormatCases.silk src/M1Cases.silk src/hir/LoweringCases.silk
          - shard: target
            roots: src/semantic/TargetCases.silk
          - shard: callable
            roots: src/semantic/CallableResultCases.silk
          - shard: semantic-signatures
            roots: src/semantic/SemanticSignatureCases.silk
          - shard: semantic-static
            roots: src/semantic/SemanticStaticCases.silk
          - shard: semantic-conformance
            roots: src/semantic/SemanticConformanceCases.silk
          - shard: semantic-lowering
            roots: src/semantic/SemanticLoweringCases.silk
          - shard: semantic-captures
            roots: src/semantic/SemanticCaptureCases.silk
          - shard: semantic-callables
            roots: src/semantic/SemanticCallableCases.silk
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILKC=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.shard }} source tests with N1
        shell: bash
        env:
          ROOTS: ${{ matrix.roots }}
        run: |
          set -euo pipefail
          export SILKC_CLANG="$SILK_TEST_CLANG"
          for root in $ROOTS; do
            name="$(basename "$root" .silk)"
            log="$RUNNER_TEMP/$name.log"
            echo "::group::$root"
            "$SILKC" test "$PWD/compiler/$root" -o "$RUNNER_TEMP/$name-tests" --stdlib "$PWD/packages/compiler/stdlib" \
              --optimization speed --no-cache | tee "$log"
            node .github/scripts/check-selfhost-test-times.mjs "$log"
            echo "::endgroup::"
          done

  # Non-required macOS arm64 leg. The Linux N1 cross-emits the compiler's LLVM IR for
  # aarch64-apple-darwin, so macOS needs no seed of its own. macOS links that IR as M1, M1 emits the
  # compiler again and the bytes must be equal, then M1 runs the native corpus. It runs on selfhost
  # pushes and manual dispatches only, which keeps PR latency and macOS runner minutes down.
  macos-ir:
    name: macOS arm64 compiler IR from N1
    if: >-
      !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (needs.native-n1.result == 'success' || needs.reuse.outputs.reused == 'true')
    needs: [reuse, native-n1]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused != 'true'
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      # A reused tree has no N1 of its own; the reused run's N1 is the one its N2 receipt names.
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused == 'true'
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
          run-id: ${{ needs.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Cross-emit the compiler for aarch64-apple-darwin
        working-directory: compiler
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 || needs.reuse.outputs.n1-sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          mkdir "$RUNNER_TEMP/macos-ir"
          /usr/bin/time -v "$RUNNER_TEMP/compilers/N1" build src/main.silk -o "$RUNNER_TEMP/macos-ir/compiler.ll" \
            --emit llvm-ir --target aarch64-apple-darwin --stdlib ../packages/compiler/stdlib \
            --optimization speed --debug false 2> "$RUNNER_TEMP/macos-ir/emit-time.txt" \
            || { cat "$RUNNER_TEMP/macos-ir/emit-time.txt"; exit 1; }
          grep -E 'Elapsed|Maximum resident' "$RUNNER_TEMP/macos-ir/emit-time.txt"
          shasum -a 256 "$RUNNER_TEMP/macos-ir/compiler.ll"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-macos-ir
          path: ${{ runner.temp }}/macos-ir/compiler.ll
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS arm64 native chain and corpus
    # A reused tree skips native-n1 upstream of macos-ir; an implicit success() would skip this too.
    if: ${{ !cancelled() && needs.macos-ir.result == 'success' }}
    needs: macos-ir
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/cache@v4
        with:
          path: .scratch/llvm-22.1.8
          key: native-supply-llvm-macOS-ARM64-f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f
      - name: Set up macOS LLVM and SDK
        run: |
          set -euo pipefail
          mkdir -p .scratch/llvm-22.1.8
          if [ ! -x .scratch/llvm-22.1.8/bin/clang ]; then
            curl --fail --location --retry 3 https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz -o .scratch/llvm.tar.xz
            echo 'f260f4f7c0d430828a81ae8a3826a1d63fc0963ec2459489308cc23b1f7eab4f  .scratch/llvm.tar.xz' | shasum -a 256 -c -
            tar -xf .scratch/llvm.tar.xz --strip-components=1 -C .scratch/llvm-22.1.8
            rm .scratch/llvm.tar.xz
          fi
          echo "$PWD/.scratch/llvm-22.1.8/bin" >> "$GITHUB_PATH"
          echo "SILKC_CLANG=$PWD/.scratch/llvm-22.1.8/bin/clang" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-macos-ir
          path: ${{ runner.temp }}/macos-ir
      # Clang receives the arguments silkc's own link step passes for a speed, non-debug build.
      - name: Link M1 from the cross-emitted IR
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/compilers"
          "$SILKC_CLANG" -O2 -x ir "$RUNNER_TEMP/macos-ir/compiler.ll" -x none -o "$RUNNER_TEMP/compilers/M1" -lc -lm
          chmod 0555 "$RUNNER_TEMP/compilers/M1"
          shasum -a 256 "$RUNNER_TEMP/compilers/M1"
      - name: M1 emits the compiler and matches the cross-emitted IR
        working-directory: compiler
        run: |
          set -euo pipefail
          /usr/bin/time -l "$RUNNER_TEMP/compilers/M1" build src/main.silk -o "$RUNNER_TEMP/m1.ll" \
            --emit llvm-ir --stdlib ../packages/compiler/stdlib --optimization speed --debug false \
            2> "$RUNNER_TEMP/m1-time.txt" || { cat "$RUNNER_TEMP/m1-time.txt"; exit 1; }
          grep -E 'real|maximum resident' "$RUNNER_TEMP/m1-time.txt"
          if ! cmp "$RUNNER_TEMP/macos-ir/compiler.ll" "$RUNNER_TEMP/m1.ll"; then
            diff "$RUNNER_TEMP/macos-ir/compiler.ll" "$RUNNER_TEMP/m1.ll" | head -n 40 | cut -c 1-300 || true
            echo "::error title=macOS fixpoint::M1 compiler IR differs from the IR N1 cross-emitted for aarch64-apple-darwin"
            exit 1
          fi
      - name: Preserve differing macOS compiler IR
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-macos-fixpoint-ir
          path: ${{ runner.temp }}/m1.ll
          if-no-files-found: ignore
          retention-days: 7
      - uses: ./.github/actions/download-bootstrap
        id: bootstrap
        with:
          verification: 'true'
      - name: Run native corpus with M1
        env:
          SILKC: ${{ runner.temp }}/compilers/M1
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
        run: node "$SELFHOST_VERIFICATION" --mode corpus-full

  # Every green selfhost push publishes its N2 as the next seed candidate. Only a reviewed commit
  # to compiler/native-seed.json makes a candidate the pinned seed.
  publish-seed:
    name: Publish native seed candidate
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/selfhost'
      && (needs.reuse.outputs.reused == 'true' || (needs.native-fixpoint.result == 'success'
      && needs.corpus.result == 'success' && needs.native-cases.result == 'success'))
    needs: [reuse, native-fixpoint, corpus, native-cases]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused != 'true'
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused == 'true'
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ needs.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      # The reused N2 was built from this exact tree under the PR's merge ref; the pin names this commit.
      - name: Name this commit in the reused pin
        if: needs.reuse.outputs.reused == 'true'
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          jq --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.seed.tag = "native-seed-" + $sha | .seed.sourceCommit = $sha | .seed.runId = $run' \
            native-seed.json > pin.json
          mv pin.json native-seed.json
      - name: Create the immutable candidate release
        working-directory: ${{ runner.temp }}/candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_RUN: ${{ needs.reuse.outputs.run-id }}
        run: |
          set -euo pipefail
          asset=silk-compiler-x86_64-unknown-linux-gnu
          tag=$(jq -er .seed.tag native-seed.json)
          test "$tag" = "native-seed-$GITHUB_SHA"
          echo "$(jq -er .seed.sha256 native-seed.json)  $asset" | sha256sum -c -
          files=("$asset" chain-receipt.json native-seed.json)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun may only confirm the published bytes, never replace them.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir published
            cmp "$asset" "published/$asset"
            echo "Release $tag already holds these seed bytes"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Native seed candidate ${GITHUB_SHA:0:12}" \
              --notes "N2 of selfhost $GITHUB_SHA (run $GITHUB_RUN_ID${REUSED_RUN:+, reusing the N2 of PR run $REUSED_RUN, which tested the same tree}), at an N1/N2 compiler IR fixpoint. To pin it, commit native-seed.json as compiler/native-seed.json."
          fi
          {
            echo "### Native seed candidate"
            echo "Release: \`$tag\`"
            echo '```json'
            cat native-seed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check: green only when every shard is green, or when the run reused a fully green
  # PR run of the same tree.
  silk:
    name: Focused Linux Silk
    if: always()
    needs: [reuse, native-fixpoint, corpus, native-cases]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard
        env:
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          CHAIN: ${{ needs.native-fixpoint.result }}
          CORPUS: ${{ needs.corpus.result }}
          NATIVE_CASES: ${{ needs.native-cases.result }}
        run: |
          echo "reuse=$REUSE reused=$REUSED chain=$CHAIN corpus=$CORPUS native-cases=$NATIVE_CASES"
          test "$REUSE" = success
          if [ "$REUSED" = true ]; then exit 0; fi
          # One test per line: under `bash -e` a failing test before the last `&&` does not end the step.
          test "$CHAIN" = success
          test "$CORPUS" = success
          test "$NATIVE_CASES" = success
