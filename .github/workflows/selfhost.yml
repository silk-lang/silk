name: Selfhost Silk

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost
      # A native stack's upper PRs target another compiler feature branch. Check their complete
      # heads as well; stack merge requires the top head, not each intermediate layer, to pass.
      - selfhost-*
      - julia/step*
  # Runs the whole workflow on a branch, including the macOS leg, for changes to target or ABI code.
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # A newer PR head supersedes the old one. Every selfhost push gets its own group, so no merge's
  # run is replaced while it waits; a push whose tree a green PR run already tested reuses it.
  group: selfhost-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A selfhost merge usually has exactly the tree its PR's last green run tested (the coordinator
  # merges selfhost into a PR and gets it green right before merging). A push or dispatch on a merge
  # commit whose full tree equals the tree a fully green pull_request run of its second parent
  # checked out reuses that run's verdict and N2 instead of running the gate again. Anything else,
  # including a missing or unverifiable artifact, runs the full gate.
  reuse:
    name: Reuse a green PR run of the same tree
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      reused: ${{ steps.find.outputs.reused }}
      run-id: ${{ steps.find.outputs.run-id }}
      n1-sha256: ${{ steps.find.outputs.n1-sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Find a fully green PR run that tested this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          full() {
            echo "reused=false" >> "$GITHUB_OUTPUT"
            printf '### Full gate\n%s\n\nTree `%s`.\n' "$1" "$tree" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          [ "$EVENT" = pull_request ] && full 'Pull request runs always run the full gate.'
          head=$(git rev-parse --verify --quiet 'HEAD^2') || full 'HEAD is not a merge commit.'
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/selfhost.yml/runs?event=pull_request&head_sha=$head&per_page=20" \
            --jq '.workflow_runs[] | select(.status == "completed" and .conclusion == "success") | .id')
          for id in $runs; do
            dir="$RUNNER_TEMP/reuse-$id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name selfhost-tested-tree --dir "$dir/tree" 2> /dev/null || continue
            [ "$(cat "$dir/tree/tree")" = "$tree" ] || continue
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --name selfhost-native-candidate --dir "$dir/candidate" 2> /dev/null || continue
            cd "$dir/candidate"
            sha=$(sha256sum silk-compiler-x86_64-unknown-linux-gnu | cut -d' ' -f1)
            if [ "$sha" = "$(jq -er '.seeds["x86_64-unknown-linux-gnu"].sha256' native-seed.json)" ] && [ "$sha" = "$(jq -er .output.sha256 chain-receipt.json)" ] \
                && [ "$(jq -er .fixpoint.producerIrSha256 chain-receipt.json)" = "$(jq -er .fixpoint.outputIrSha256 chain-receipt.json)" ]; then
              url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"
              {
                echo "reused=true"
                echo "run-id=$id"
                echo "n1-sha256=$(jq -er .producer.sha256 chain-receipt.json)"
              } >> "$GITHUB_OUTPUT"
              printf '### Reused a green PR run\nRun [%s](%s) tested PR head `%s` with the same tree `%s`. Its verdict and N2 `%s` stand for this commit; the gate jobs are skipped.\n' \
                "$id" "$url" "$head" "$tree" "$sha" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
          done
          full "No fully green pull_request run of \`$head\` has this tree and a verifiable N2."

  # The pinned seed builds N1 from the exact committed inputs. See compiler/docs/native-seed-chain.md.
  native-n1:
    name: Native N1 from pinned seed
    needs: reuse
    if: needs.reuse.outputs.reused != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      sha256: ${{ steps.n1.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check main-first bootstrap provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - name: Check native generation contracts
        uses: ./.github/actions/check-native-contracts
      - name: Check native diagnostic catalog and coverage
        run: node compiler/scripts/DiagnosticCatalog.mjs
      - name: Read the seed pin
        id: pin
        run: node compiler/scripts/NativeSeed.mjs outputs compiler/native-seed.json x86_64-unknown-linux-gnu >> "$GITHUB_OUTPUT"
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - name: Download and verify the pinned seed before execution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/seed-download"
          mkdir "$RUNNER_TEMP/seed"
          node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json x86_64-unknown-linux-gnu "$RUNNER_TEMP/seed-download/$ASSET" "$RUNNER_TEMP/seed/seed"
          echo "SEED=$RUNNER_TEMP/seed/seed" >> "$GITHUB_ENV"
          echo "SEED_SHA256=${{ steps.pin.outputs.sha256 }}" >> "$GITHUB_ENV"
      - name: Check type construction goes through Types
        run: node compiler/scripts/TypesCapabilityCodemod.mjs --check
      - name: Build N1 with the seed and smoke it
        id: n1
        run: |
          set -euo pipefail
          if ! node compiler/scripts/NativeBuild.ts --producer "$SEED" --producer-sha256 "$SEED_SHA256" \
              --producer-generation seed --generation N1 --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/n1" \
              --corpus-source "$GITHUB_WORKSPACE/packages/compiler/test/support/corpus.ts" \
              > "$RUNNER_TEMP/n1-receipt-stdout.json"; then
            jq -r '.failure // empty' "$RUNNER_TEMP/n1/build-receipt.json" || true
            echo "::error title=Pinned seed cannot build this checkout::If the compiler now uses a language feature the pinned seed lacks, land the compiler support first, advance compiler/native-seed.json to its published seed, then use the feature. For a broken chain, pin an earlier published seed. See compiler/docs/native-seed-chain.md#recovery."
            exit 1
          fi
          echo "sha256=$(jq -er .output.sha256 "$RUNNER_TEMP/n1/build-receipt.json")" >> "$GITHUB_OUTPUT"
      - name: Publish N1 for the fixpoint and corpus jobs
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1/N1
          if-no-files-found: error
          retention-days: 7
      # A pull_request run checks out refs/pull/N/merge; a later push of that tree may reuse the run.
      - name: Record the tested tree
        run: |
          mkdir "$RUNNER_TEMP/tested-tree"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/tested-tree/tree"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-tested-tree
          path: ${{ runner.temp }}/tested-tree/tree
          if-no-files-found: error
          retention-days: 7
      - name: Preserve N1 receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-n1-diagnostics
          path: |
            ${{ runner.temp }}/n1/*.json
            ${{ runner.temp }}/n1/*.bin
            ${{ runner.temp }}/n1/*-rss.txt
          retention-days: 7

  # The required check: N1 builds N2, both emit the compiler's LLVM IR, and the bytes are equal.
  native-fixpoint:
    name: Native seed chain (N2 fixpoint)
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - name: Build N2 with N1, compare their compiler IR, and smoke N2
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          if ! node compiler/scripts/NativeBuild.ts --producer "$RUNNER_TEMP/compilers/N1" --producer-sha256 "$N1_SHA256" \
              --producer-generation N1 --generation N2 --fixpoint --clang "$SILK_TEST_CLANG" \
              --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/n2" \
              --corpus-source "$GITHUB_WORKSPACE/packages/compiler/test/support/corpus.ts" \
              > "$RUNNER_TEMP/n2-receipt-stdout.json"; then
            jq -r '.failure // empty' "$RUNNER_TEMP/n2/build-receipt.json" || true
            exit 1
          fi
          jq '{output, fixpoint, stages: [.stages[] | {name, wallTimeMs, peakRss: .peakRss.value}]}' "$RUNNER_TEMP/n2/build-receipt.json"
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/n2/N2" "$RUNNER_TEMP/candidate/silk-compiler-x86_64-unknown-linux-gnu"
          cp "$RUNNER_TEMP/n2/build-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt.json"
          node compiler/scripts/NativeSeed.mjs candidate "$RUNNER_TEMP/n2/build-receipt.json" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/candidate/native-seed.json"
      # The self-build's unchecked bodies grow with the compiler: a receipt, gated only on retired
      # reasons staying at zero.
      - name: Report the self-build borrow-check gap
        run: node .github/scripts/check-borrow-gap.mjs self-build "$RUNNER_TEMP/n2"
      - name: Publish the seed candidate files
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve fixpoint receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-fixpoint-diagnostics
          path: |
            ${{ runner.temp }}/n2/*.json
            ${{ runner.temp }}/n2/*.bin
            ${{ runner.temp }}/n2/*-rss.txt
          retention-days: 7
      - name: Preserve differing compiler IR
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-fixpoint-ir
          path: ${{ runner.temp }}/n2/*.ll
          retention-days: 7

  corpus:
    name: Selfhost native corpus
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.github/actions/setup-linux-llvm
      # Only the verification harness comes from main; N1 compiles every corpus program.
      - uses: ./.github/actions/download-bootstrap
        id: bootstrap
        with:
          verification: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILKC=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      # The verification harness checks the intrinsic catalog and that the N1-built gate leaves every
      # tracked source unchanged; it neither builds a compiler nor runs programs.
      - name: Build the formatter safety gate with N1
        env:
          SILKC_CLANG: ${{ env.SILK_TEST_CLANG }}
        run: |
          "$SILKC" build "$GITHUB_WORKSPACE/compiler/src/format_gate.silk" -o "$RUNNER_TEMP/silk-format-gate" --stdlib "$GITHUB_WORKSPACE/packages/compiler/stdlib"
          echo "SILK_FORMAT_GATE=$RUNNER_TEMP/silk-format-gate" >> "$GITHUB_ENV"
      - name: Verify repository formatting
        run: node "$SELFHOST_VERIFICATION"
        env:
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
      - name: Capture formatted repository samples
        run: |
          python3 - "$RUNNER_TEMP/formatter-samples.md" <<'PYTHON'
          import pathlib, sys
          samples = ['compiler/src/lexer/Span.silk', 'compiler/src/format/ExpressionLayout.silk', 'packages/compiler/stdlib/silk/option.silk']
          with open(sys.argv[1], 'w') as output:
              for name in samples:
                  lines = pathlib.Path(name).read_text().splitlines()[:65]
                  output.write(f'### {name}\n\n```silk\n' + '\n'.join(lines) + '\n```\n\n')
          PYTHON
      # The harness runs one case per core: 419 cases took 4m20s on 2026-10-12 (1033 s of case
      # time; 545 s when it ran them one at a time), so one job is enough.
      - name: Run native corpus with N1
        shell: bash
        run: |
          set -euo pipefail
          node "$SELFHOST_VERIFICATION" --mode corpus-full | tee "$RUNNER_TEMP/selfhost-corpus.log"
        env:
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
      - name: Check native format command on canonical repository source
        working-directory: compiler
        run: '"$SILKC" format src/lexer/Span.silk --check'
      # The harness already fails when a pinned program does not pass; every other outcome must
      # pass too, with a complete timing receipt.
      - name: Check the corpus has no failures
        run: |
          node --input-type=module - "$RUNNER_TEMP/selfhost-corpus.log" <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.argv[2], 'utf8').split('\n')
          const failures = lines.filter((line) => line.startsWith('FAIL '))
          if (failures.length > 0) throw new Error(`Corpus failures:\n${failures.join('\n')}`)
          if (lines.some((line) => /(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)/.test(line))) {
            throw new Error('Corpus has a runtime mismatch, runner failure, or module-source gap')
          }
          const timings = lines.filter((line) => line.startsWith('SELFHOST_CASE_TIMING='))
          const outcomes = lines.filter((line) => /^(?:PASS|FAIL|UNSUPPORTED) /.test(line))
          if (timings.length !== outcomes.length || outcomes.length === 0) throw new Error('Incomplete corpus timing receipt')
          JS
      - name: Check the corpus borrow-check gap baseline
        run: |
          node .github/scripts/check-borrow-gap.mjs self-test
          node .github/scripts/check-borrow-gap.mjs corpus "$RUNNER_TEMP/selfhost-corpus.log"
      - name: Upload corpus build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-corpus-timings
          path: ${{ runner.temp }}/selfhost-corpus.log
          retention-days: 7
      - name: Upload native formatter safety and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-formatter-safety
          path: |
            ${{ runner.temp }}/formatter-safety.log
            ${{ runner.temp }}/formatter-samples.md
          retention-days: 7

  # Compile the standard library as the root package so its loaded, closed declarations receive
  # the same sweep as application source. The fixture imports every non-startup library module;
  # test mode selects the ordinary test runner and supplies its discovery context. The selected
  # hosted startup is still reached; the compiler self-build covers synchronous startup. Main's
  # bootstrap conformance builds exercise raw Linux and Wasm startup with their target profiles.
  stdlib-root:
    name: Standard library as root
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILKC=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Check the standard-library root inventory
        run: node .github/scripts/check-stdlib-root.mjs
      - name: Assemble the standard-library root package
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/stdlib-root"
          cp -a "$PWD/packages/compiler/stdlib/." "$RUNNER_TEMP/stdlib-root/"
          cp "$PWD/compiler/fixtures/stdlib-root/silk.toml" \
            "$PWD/compiler/fixtures/stdlib-root/stdlib_check.silk" \
            "$RUNNER_TEMP/stdlib-root/"
      - name: Compile the standard library as a root package with N1
        run: |
          set -euo pipefail
          export SILKC_CLANG="$SILK_TEST_CLANG"
          "$SILKC" test "$RUNNER_TEMP/stdlib-root/stdlib_check.silk" \
            -o "$RUNNER_TEMP/stdlib-check-tests" \
            --stdlib "$RUNNER_TEMP/stdlib-root" --no-cache

  # Source test shards: N1 builds each root's bundled runner with `silkc test`. They run on PRs
  # too, since a PR's N1 is the compiler that would run them after merge.
  native-cases:
    name: Native selfhost cases (${{ matrix.shard }})
    needs: native-n1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Four jobs of similar length. Measured native test step times (s), e96a317 on
          # 2026-10-12: conformance 160, signatures 151, lowering 114, callables 110, captures 107,
          # static 105, callable results 102, target 99, M1 19, HIR lowering 14, format 10. Each
          # job pays the setup (checkout, LLVM, N1 download, about 1 min) once for 3.5-4.5 min of
          # tests.
          - shard: conformance-target
            roots: >-
              src/semantic/SemanticConformanceCases.silk src/semantic/TargetCases.silk
          - shard: signatures-static
            roots: >-
              src/semantic/SemanticSignatureCases.silk src/semantic/SemanticStaticCases.silk
          - shard: lowering-callables-m1
            roots: >-
              src/semantic/SemanticLoweringCases.silk src/semantic/SemanticCallableCases.silk
              src/M1Cases.silk src/hir/LoweringCases.silk
          # The source store and query cases are small and run in the shortest job.
          - shard: captures-results-format
            roots: >-
              src/semantic/SemanticCaptureCases.silk src/semantic/CallableResultCases.silk
              src/format/FormatCases.silk src/semantic/SourceIndexCases.silk src/semantic/QueryCases.silk
          # Each root builds its own test binary (about 2 min here), so the strict inventory's two
          # roots and the build of its entry get their own job rather than lengthening another.
          - shard: strict-inventory
            roots: >-
              src/diagnostic/StrictInventoryCases.silk src/diagnostic/StrictInventoryResultCases.silk
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-linux-llvm
      - uses: actions/download-artifact@v4
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - name: Install verified N1
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          echo "SILKC=$RUNNER_TEMP/compilers/N1" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.shard }} source tests with N1
        shell: bash
        env:
          ROOTS: ${{ matrix.roots }}
        run: |
          set -euo pipefail
          export SILKC_CLANG="$SILK_TEST_CLANG"
          for root in $ROOTS; do
            name="$(basename "$root" .silk)"
            log="$RUNNER_TEMP/$name.log"
            echo "::group::$root"
            "$SILKC" test "$PWD/compiler/$root" -o "$RUNNER_TEMP/$name-tests" --stdlib "$PWD/packages/compiler/stdlib" \
              --optimization speed --no-cache | tee "$log"
            node .github/scripts/check-selfhost-test-times.mjs "$log"
            echo "::endgroup::"
          done
      # A test build compiles only what its cases reach, so this job builds the strict inventory's whole entry.
      - name: Build the strict inventory entry with N1
        if: matrix.shard == 'strict-inventory'
        run: |
          set -euo pipefail
          export SILKC_CLANG="$SILK_TEST_CLANG"
          "$SILKC" build "$PWD/compiler/src/diagnostic_main.silk" -o "$RUNNER_TEMP/diagnostic_main.ll" --emit llvm-ir \
            --stdlib "$PWD/packages/compiler/stdlib"

  # Anti-lock-in gate (compiler/docs/native-seed-chain.md#bootstrap-ddc): the TypeScript bootstrap
  # that selfhost last synced from main builds this compiler (T1), and T1 must emit the compiler's
  # LLVM IR byte for byte as the seed chain's N1 does. Every push runs it and records a receipt; a
  # pull request runs it only when it bumps the seed pin, and a bump merges only with it green.
  bootstrap-ddc:
    name: Bootstrap builds the compiler (T1 DDC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether this run checks the bootstrap
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          run=true
          if [ "$EVENT" = pull_request ] && ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx compiler/native-seed.json; then
            run=false
            echo "Not a seed bump; the bootstrap DDC runs on selfhost pushes and seed-bump pull requests."
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
      # The newest main commit this tree contains carries the bootstrap matching its language and
      # standard library; main HEAD can be ahead of the last sync.
      - name: Find the main commit selfhost last synced
        if: steps.scope.outputs.run == 'true'
        id: sync
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          echo "sha=$(git merge-base HEAD origin/main)" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # The seed tooling (NativeSeed.mjs) imports workspace packages.
      - if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scope.outputs.run == 'true'
        uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        if: steps.scope.outputs.run == 'true'
        run: sudo apt-get install -y time
      - if: steps.scope.outputs.run == 'true'
        id: bootstrap
        continue-on-error: true
        uses: ./.github/actions/download-bootstrap
        with:
          sha: ${{ steps.sync.outputs.sha }}
      - name: Require the synced bootstrap
        if: steps.scope.outputs.run == 'true' && steps.bootstrap.outcome != 'success'
        env:
          SYNC_SHA: ${{ steps.sync.outputs.sha }}
        run: |
          echo "::error title=No verified bootstrap for the synced main commit::Main CI published no verified silk-bootstrap artifact for $SYNC_SHA (it expires after 90 days, or main was red there). Sync main into selfhost so a verified bootstrap artifact exists."
          exit 1
      - name: Read the seed pin
        if: steps.scope.outputs.run == 'true'
        id: pin
        run: node compiler/scripts/NativeSeed.mjs outputs compiler/native-seed.json x86_64-unknown-linux-gnu >> "$GITHUB_OUTPUT"
      - name: Download and verify the pinned seed before execution
        if: steps.scope.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/seed-download"
          mkdir "$RUNNER_TEMP/seed"
          node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json x86_64-unknown-linux-gnu "$RUNNER_TEMP/seed-download/$ASSET" "$RUNNER_TEMP/seed/seed"
      - name: Build T1 with the synced bootstrap and N1 with the seed, then compare their compiler IR
        if: steps.scope.outputs.run == 'true'
        env:
          BOOTSTRAP: ${{ steps.bootstrap.outputs.path }}
          BOOTSTRAP_RUN: ${{ steps.bootstrap.outputs.run-id }}
          SYNC_SHA: ${{ steps.sync.outputs.sha }}
          SILKC_CLANG: ${{ env.SILK_TEST_CLANG }}
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/ddc"
          mkdir -p "$out"
          stage() {
            local name="$1"
            shift
            /usr/bin/time -f '%e %M' -o "$out/$name-time.txt" "$@" > "$out/$name.log" 2>&1 || {
              tail -n 60 "$out/$name.log"
              echo "::error title=Bootstrap DDC stage $name failed::See the bootstrap-ddc artifact."
              exit 1
            }
          }
          (cd compiler && stage t1 node "$BOOTSTRAP" build --manifest-path silk.toml --release --target x86_64-unknown-linux-gnu)
          t1="$(find "$PWD/compiler/build/llvm/x86_64-unknown-linux-gnu" -type f -name 'silk-compiler*' -perm -u+x | head -n 1)"
          [ -n "$t1" ] || { echo "::error title=T1 missing::The bootstrap build produced no compiler executable."; exit 1; }
          args=(--stdlib "$PWD/packages/compiler/stdlib" --optimization speed --debug false)
          (cd compiler && stage n1 "$RUNNER_TEMP/seed/seed" build src/main.silk -o "$out/N1" "${args[@]}")
          (cd compiler && stage t1-ir "$t1" build src/main.silk -o "$out/t1.ll" --emit llvm-ir "${args[@]}")
          (cd compiler && stage n1-ir "$out/N1" build src/main.silk -o "$out/n1.ll" --emit llvm-ir "${args[@]}")
          identical=true
          if ! cmp -s "$out/t1.ll" "$out/n1.ll"; then
            identical=false
            diff "$out/n1.ll" "$out/t1.ll" | head -n 200 | cut -c 1-300 > "$out/ir-diff.txt" || true
          fi
          jq -n --arg sync "$SYNC_SHA" --arg run "$BOOTSTRAP_RUN" --arg head "$(git rev-parse HEAD)" \
            --arg t1 "$(cat "$out/t1-time.txt")" --arg n1 "$(cat "$out/n1-time.txt")" \
            --arg t1ir "$(cat "$out/t1-ir-time.txt")" --arg n1ir "$(cat "$out/n1-ir-time.txt")" \
            --arg t1sha "$(sha256sum "$out/t1.ll" | cut -d' ' -f1)" --arg n1sha "$(sha256sum "$out/n1.ll" | cut -d' ' -f1)" \
            --argjson identical "$identical" \
            '{head: $head, syncedMain: $sync, bootstrapRun: $run, identical: $identical,
              stages: {t1: $t1, n1: $n1, t1Ir: $t1ir, n1Ir: $n1ir}, irSha256: {t1: $t1sha, n1: $n1sha}}' \
            | tee "$out/receipt.json"
          if [ "$identical" != true ]; then
            cat "$out/ir-diff.txt"
            echo "::error title=Bootstrap DDC mismatch::T1 and N1 emit different compiler IR; see ir-diff.txt in the bootstrap-ddc artifact."
            exit 1
          fi
      - name: Preserve the DDC receipt and logs
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-bootstrap-ddc
          path: |
            ${{ runner.temp }}/ddc/*.json
            ${{ runner.temp }}/ddc/*.log
            ${{ runner.temp }}/ddc/*.txt
          if-no-files-found: ignore
          retention-days: 90

  target-plan:
    name: Select native ARM64 seed origins
    runs-on: ubuntu-24.04
    outputs:
      linux-pinned: ${{ steps.pins.outputs.linux-pinned }}
      macos-pinned: ${{ steps.pins.outputs.macos-pinned }}
    steps:
      - uses: actions/checkout@v6
      - id: pins
        run: |
          echo "linux-pinned=$(jq '.seeds | has("aarch64-unknown-linux-gnu")' compiler/native-seed.json)" >> "$GITHUB_OUTPUT"
          echo "macos-pinned=$(jq '.seeds | has("aarch64-apple-darwin")' compiler/native-seed.json)" >> "$GITHUB_OUTPUT"

  # Before the first reviewed target pin, verified x86-64 N1 supplies native compiler IR.
  # Once pinned, each target builds directly with its own verified seed and needs no cross IR.
  target-ir:
    name: Initial native compiler IR / ${{ matrix.target }}
    if: ${{ !cancelled() && (needs.native-n1.result == 'success' || needs.reuse.outputs.reused == 'true') }}
    needs: [reuse, native-n1, target-plan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            pinned-output: linux-pinned
          - target: aarch64-apple-darwin
            pinned-output: macos-pinned
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        if: needs.target-plan.outputs[matrix.pinned-output] != 'true'
      - uses: actions/download-artifact@v4
        if: needs.target-plan.outputs[matrix.pinned-output] != 'true' && needs.reuse.outputs.reused != 'true'
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
      - uses: actions/download-artifact@v4
        if: needs.target-plan.outputs[matrix.pinned-output] != 'true' && needs.reuse.outputs.reused == 'true'
        with:
          name: selfhost-native-n1
          path: ${{ runner.temp }}/n1-download
          run-id: ${{ needs.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Cross-emit the compiler with verified Linux N1
        if: needs.target-plan.outputs[matrix.pinned-output] != 'true'
        working-directory: compiler
        env:
          N1_SHA256: ${{ needs.native-n1.outputs.sha256 || needs.reuse.outputs.n1-sha256 }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          install -D -m 0555 "$RUNNER_TEMP/n1-download/N1" "$RUNNER_TEMP/compilers/N1"
          echo "$N1_SHA256  $RUNNER_TEMP/compilers/N1" | sha256sum -c -
          mkdir "$RUNNER_TEMP/target-ir"
          "$RUNNER_TEMP/compilers/N1" build src/main.silk -o "$RUNNER_TEMP/target-ir/compiler.ll" \
            --emit llvm-ir --target "$TARGET" --stdlib ../packages/compiler/stdlib \
            --optimization speed --debug false
          shasum -a 256 "$RUNNER_TEMP/target-ir/compiler.ll"
      - uses: actions/upload-artifact@v4
        if: needs.target-plan.outputs[matrix.pinned-output] != 'true'
        with:
          name: selfhost-ir-${{ matrix.target }}
          path: ${{ runner.temp }}/target-ir/compiler.ll
          if-no-files-found: error
          retention-days: 7

  native-targets:
    name: Native chain and corpus / ${{ matrix.target }}
    if: ${{ !cancelled() && needs.target-ir.result == 'success' }}
    needs: [target-plan, target-ir]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            pinned-output: linux-pinned
          - target: aarch64-apple-darwin
            runner: macos-15
            pinned-output: macos-pinned
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
      PINNED: ${{ needs.target-plan.outputs[matrix.pinned-output] }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-native-llvm
      - name: Export exact committed authored inputs
        run: node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
      - uses: actions/download-artifact@v4
        if: env.PINNED != 'true'
        with:
          name: selfhost-ir-${{ matrix.target }}
          path: ${{ runner.temp }}/target-ir
      - name: Obtain N1 from the pinned seed or initial cross-emitted IR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/chain"
          mkdir -p "$out"
          if [ "$PINNED" = true ]; then
            tag=$(jq -er --arg target "$TARGET" '.seeds[$target].tag' compiler/native-seed.json)
            asset=$(jq -er --arg target "$TARGET" '.seeds[$target].asset' compiler/native-seed.json)
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/seed-download"
            node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json "$TARGET" \
              "$RUNNER_TEMP/seed-download/$asset" "$out/seed"
            (cd "$RUNNER_TEMP/authored-inputs/compiler" && "$out/seed" build src/main.silk -o "$out/N1" \
              --stdlib ../packages/compiler/stdlib --optimization speed --debug false)
          else
            "$SILKC_CLANG" -O2 -x ir "$RUNNER_TEMP/target-ir/compiler.ll" -x none -o "$out/N1" -lc -lm
          fi
          chmod 0555 "$out/N1"
      - name: N1 builds N2 and both emit identical compiler IR
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/chain"
          args=(--stdlib "$RUNNER_TEMP/authored-inputs/packages/compiler/stdlib" --optimization speed --debug false)
          cd "$RUNNER_TEMP/authored-inputs/compiler"
          "$out/N1" build src/main.silk -o "$out/N2" "${args[@]}" > "$out/n2.log" 2>&1 || { tail -n 60 "$out/n2.log"; exit 1; }
          chmod 0555 "$out/N2"
          "$out/N1" build src/main.silk -o "$out/n1.ll" --emit llvm-ir "${args[@]}" > "$out/n1-ir.log" 2>&1 || { tail -n 60 "$out/n1-ir.log"; exit 1; }
          "$out/N2" build src/main.silk -o "$out/n2.ll" --emit llvm-ir "${args[@]}" > "$out/n2-ir.log" 2>&1 || { tail -n 60 "$out/n2-ir.log"; exit 1; }
          cmp "$out/n1.ll" "$out/n2.ll"
          if [ "$PINNED" != true ]; then cmp "$RUNNER_TEMP/target-ir/compiler.ll" "$out/n1.ll"; fi
          jq -n --arg target "$TARGET" --arg source "$GITHUB_SHA" \
            --arg n1 "$(shasum -a 256 "$out/N1" | cut -d' ' -f1)" \
            --arg n2 "$(shasum -a 256 "$out/N2" | cut -d' ' -f1)" \
            --arg ir "$(shasum -a 256 "$out/n2.ll" | cut -d' ' -f1)" --arg pinned "$PINNED" \
            '{status: "passed", target: $target, inputs: {sourceCommit: $source},
              origin: (if $pinned == "true" then "pinned-seed" else "cross-emitted-N1" end),
              producer: {generation: "N1", sha256: $n1}, output: {generation: "N2", sha256: $n2},
              fixpoint: {producerIrSha256: $ir, outputIrSha256: $ir}}' > "$out/chain-receipt.json"
      - uses: ./.github/actions/download-bootstrap
        id: bootstrap
        with:
          verification: 'true'
      - name: Run the native corpus with N1 and smoke N2
        env:
          SELFHOST_VERIFICATION: ${{ steps.bootstrap.outputs.verification-path }}
        run: |
          set -euo pipefail
          SILKC="$RUNNER_TEMP/chain/N1" node "$SELFHOST_VERIFICATION" --mode corpus-full | tee "$RUNNER_TEMP/chain/corpus.log"
          node --input-type=module - "$RUNNER_TEMP/chain/corpus.log" <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.argv[2], 'utf8').split('\n')
          const failures = lines.filter((line) => line.startsWith('FAIL '))
          if (failures.length > 0) throw new Error(`Corpus failures:\n${failures.join('\n')}`)
          if (lines.some((line) => /(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)/.test(line))) throw new Error('Corpus runtime mismatch, runner failure, or module-source gap')
          const timings = lines.filter((line) => line.startsWith('SELFHOST_CASE_TIMING='))
          const outcomes = lines.filter((line) => /^(?:PASS|FAIL|UNSUPPORTED) /.test(line))
          if (timings.length !== outcomes.length || outcomes.length === 0) throw new Error('Incomplete corpus timing receipt')
          JS
          node --input-type=module - "$RUNNER_TEMP/chain" <<'JS'
          import { readFileSync, mkdirSync, writeFileSync } from 'node:fs'
          const source = readFileSync('packages/compiler/test/support/corpus.ts', 'utf8')
          const matches = [...source.matchAll(/^const trivialFeatures = `([^`]*)`\n/gm)]
          const program = matches[0]?.[1]
          if (matches.length !== 1 || program === undefined || /\\|\$\{/.test(program)) throw new Error('Expected the trivialFeatures smoke fixture')
          const root = `${process.argv[2]}/smoke`
          mkdirSync(root)
          writeFileSync(`${root}/main.silk`, program)
          writeFileSync(`${root}/silk.toml`, '[package]\nname = "trivial-features"\nroot = "main.silk"\n')
          JS
          "$RUNNER_TEMP/chain/N2" build "$RUNNER_TEMP/chain/smoke/main.silk" -o "$RUNNER_TEMP/chain/smoke/program" \
            --stdlib "$RUNNER_TEMP/authored-inputs/packages/compiler/stdlib" --optimization speed --debug false
          status=0
          "$RUNNER_TEMP/chain/smoke/program" > "$RUNNER_TEMP/chain/smoke.log" || status=$?
          test "$status" = 42
          test ! -s "$RUNNER_TEMP/chain/smoke.log"
      - name: Prepare the per-target seed candidate
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/chain/N2" "$RUNNER_TEMP/candidate/silk-compiler-$TARGET"
          cp "$RUNNER_TEMP/chain/chain-receipt.json" "$RUNNER_TEMP/candidate/chain-receipt-$TARGET.json"
          node compiler/scripts/NativeSeed.mjs candidate "$RUNNER_TEMP/chain/chain-receipt.json" "$GITHUB_RUN_ID" \
            > "$RUNNER_TEMP/candidate/native-seed-$TARGET.json"
      - uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-candidate-${{ matrix.target }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native chain receipts, logs, and differing IR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-native-diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/chain/*.json
            ${{ runner.temp }}/chain/*.log
            ${{ runner.temp }}/chain/*.ll
          if-no-files-found: ignore
          retention-days: 7

  # Every green selfhost push publishes its N2 as the next seed candidate. Only a reviewed commit
  # to compiler/native-seed.json makes a candidate the pinned seed.
  publish-seed:
    name: Publish native seed candidate
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/selfhost'
      && (needs.reuse.outputs.reused == 'true' || (needs.native-fixpoint.result == 'success'
      && needs.corpus.result == 'success' && needs.stdlib-root.result == 'success'
      && needs.native-cases.result == 'success')) && needs.native-targets.result == 'success'
      && needs.bootstrap-ddc.result == 'success'
    needs:
      [reuse, native-fixpoint, corpus, stdlib-root, native-cases, native-targets, bootstrap-ddc]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused != 'true'
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        if: needs.reuse.outputs.reused == 'true'
        with:
          name: selfhost-native-candidate
          path: ${{ runner.temp }}/candidate
          run-id: ${{ needs.reuse.outputs.run-id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          pattern: selfhost-native-candidate-*
          path: ${{ runner.temp }}/candidate
          merge-multiple: true
      - name: Assemble the ready-to-commit per-target pin
        working-directory: ${{ runner.temp }}/candidate
        run: |
          set -euo pipefail
          mv native-seed.json native-seed-x86_64-unknown-linux-gnu.json
          mv chain-receipt.json chain-receipt-x86_64-unknown-linux-gnu.json
          # Reused x86-64 N2 has this exact tree; name the publishing commit in every target pin.
          jq -s --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '{schemaVersion: 2, seeds: (map(.seeds) | add | with_entries(.value |=
              (.tag = "native-seed-" + $sha | .sourceCommit = $sha | .runId = $run)))}' \
            native-seed-*.json > native-seed.json
          rm native-seed-*.json
      - name: Create the immutable candidate release
        working-directory: ${{ runner.temp }}/candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REUSED_RUN: ${{ needs.reuse.outputs.run-id }}
        run: |
          set -euo pipefail
          tag="native-seed-$GITHUB_SHA"
          files=(native-seed.json)
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            asset="silk-compiler-$target"
            receipt="chain-receipt-$target.json"
            test "$(jq -er --arg target "$target" '.seeds[$target].tag' native-seed.json)" = "$tag"
            sha=$(jq -er --arg target "$target" '.seeds[$target].sha256' native-seed.json)
            echo "$sha  $asset" | sha256sum -c -
            test "$sha" = "$(jq -er .output.sha256 "$receipt")"
            test "$(jq -er .target "$receipt")" = "$target"
            test "$(jq -er .fixpoint.producerIrSha256 "$receipt")" = "$(jq -er .fixpoint.outputIrSha256 "$receipt")"
            files+=("$asset" "$receipt")
          done
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # A rerun may confirm all published assets, never replace or add bytes.
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir published
            cmp native-seed.json published/native-seed.json
            for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
              cmp "silk-compiler-$target" "published/silk-compiler-$target"
              # Receipt timings and runner paths can vary on a rerun; compiler identities cannot.
              jq '{target, output: {sha256: .output.sha256}, fixpoint}' "chain-receipt-$target.json" > expected.json
              jq '{target, output: {sha256: .output.sha256}, fixpoint}' "published/chain-receipt-$target.json" > actual.json
              cmp expected.json actual.json
            done
            echo "Release $tag already holds these seed and receipt bytes"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --title "Native seed candidate ${GITHUB_SHA:0:12}" \
              --notes "Native N2 candidates for x86-64 Linux, ARM64 Linux, and macOS arm64 of selfhost $GITHUB_SHA (run $GITHUB_RUN_ID${REUSED_RUN:+, reusing x86-64 N2 of PR run $REUSED_RUN with the same tree}). Each target passed N1/N2 compiler IR identity and its native corpus. To pin them, commit native-seed.json as compiler/native-seed.json."
          fi
          {
            echo "### Native seed candidates"
            echo "Release: \`$tag\`"
            echo '```json'
            cat native-seed.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The required check includes both ARM64 targets, even when x86-64 reuses a green PR tree.
  silk:
    name: Focused Linux Silk
    if: always()
    needs: [reuse, native-fixpoint, corpus, stdlib-root, native-cases, native-targets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every shard
        env:
          REUSE: ${{ needs.reuse.result }}
          REUSED: ${{ needs.reuse.outputs.reused }}
          CHAIN: ${{ needs.native-fixpoint.result }}
          CORPUS: ${{ needs.corpus.result }}
          STDLIB_ROOT: ${{ needs.stdlib-root.result }}
          NATIVE_CASES: ${{ needs.native-cases.result }}
          TARGETS: ${{ needs.native-targets.result }}
        run: |
          echo "reuse=$REUSE reused=$REUSED chain=$CHAIN corpus=$CORPUS stdlib-root=$STDLIB_ROOT native-cases=$NATIVE_CASES"
          test "$TARGETS" = success
          test "$REUSE" = success
          if [ "$REUSED" = true ]; then exit 0; fi
          # One test per line: under `bash -e` a failing test before the last `&&` does not end the step.
          test "$CHAIN" = success
          test "$CORPUS" = success
          test "$STDLIB_ROOT" = success
          test "$NATIVE_CASES" = success
