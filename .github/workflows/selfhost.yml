name: Selfhost Silk

on:
  push:
    branches:
      - selfhost
  pull_request:
    branches:
      - selfhost
      # A native stack's upper PRs target another compiler feature branch. Check their complete
      # heads as well; stack merge requires the top head, not each intermediate layer, to pass.
      - selfhost-*
      - julia/step*

permissions:
  contents: read

concurrency:
  group: selfhost-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  silk:
    name: Focused Linux Silk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check main-first bootstrap provenance
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          node .github/scripts/check-selfhost-bootstrap.mjs "$BASE_SHA" "$HEAD_SHA" origin/main
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ./.github/actions/setup-linux-llvm
      - name: Identify bootstrap inputs
        id: bootstrap-key
        shell: bash
        run: |
          set -euo pipefail
          digest=$(git ls-files -s -- packages/ scripts/ config/ .github/actions/setup-linux-llvm/ package.json pnpm-lock.yaml pnpm-workspace.yaml turbo.json tsconfig.base.json .npmrc .node-version | sha256sum | cut -d ' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
      # Turbo owns the dist output fingerprints. This archive is keyed by tracked bootstrap
      # inputs and the pinned Linux/Node/LLVM host, so native-only changes can replay builds.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: selfhost-bootstrap-${{ runner.os }}-${{ runner.arch }}-${{ steps.bootstrap-key.outputs.node }}-llvm22.1.8-${{ steps.bootstrap-key.outputs.digest }}
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check selfhost corpus runner
        run: pnpm --filter @silklang/compiler exec tsx --test ../../compiler/scripts/runSelfhostCorpus.test.ts
      - name: Build bootstrap CLI
        run: CI=true node scripts/turbo.mjs run build --filter=@silklang/cli...
      # Temporary headroom until the bootstrap LLVM-emission memory fix lands (see memory handoff).
      - name: Build self-hosted compiler CLI
        run: node packages/cli/dist/bin.js build --manifest-path compiler/silk.toml --optimization release-with-debug
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Build native formatter safety gate
        run: node packages/cli/dist/bin.js build --manifest-path compiler/format-gate.toml --optimization release-with-debug
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Verify repository formatting, rebuild and run native corpus
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @silklang/compiler exec node --import tsx --input-type=module <<'JS' | tee "$RUNNER_TEMP/selfhost-corpus.log"
          import * as Effect from 'effect/Effect'
          import * as NodeRuntime from '@effect/platform-node/NodeRuntime'
          import * as NodeServices from '@effect/platform-node/NodeServices'
          import * as Verification from '../../compiler/scripts/FormatterVerification.ts'
          NodeRuntime.runMain(Verification.runConfigured(process.execPath).pipe(Effect.provide(NodeServices.layer)))
          JS
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          SILKC: ${{ github.workspace }}/compiler/build/llvm/x86_64-unknown-linux-gnu/release-with-debug/silk-compiler
      - name: Capture formatted repository samples
        run: |
          python3 - "$RUNNER_TEMP/formatter-samples.md" <<'PYTHON'
          import pathlib, sys
          samples = ['compiler/src/lexer/Span.silk', 'compiler/src/format/ExpressionLayout.silk', 'packages/compiler/stdlib/silk/option.silk']
          with open(sys.argv[1], 'w') as output:
              for name in samples:
                  lines = pathlib.Path(name).read_text().splitlines()[:65]
                  output.write(f'### {name}\n\n```silk\n' + '\n'.join(lines) + '\n```\n\n')
          PYTHON
      - name: Check native format command on canonical repository source
        working-directory: compiler
        run: build/llvm/x86_64-unknown-linux-gnu/release-with-debug/silk-compiler format src/lexer/Span.silk --check
      # All following source tests exercise the formatted checkout.
      - name: Run native formatter cases
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/format/FormatCases.silk --no-cache | tee "$RUNNER_TEMP/formatter-tests.log"
          node .github/scripts/check-selfhost-test-times.mjs "$RUNNER_TEMP/formatter-tests.log"
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run M1 query and source-index cases
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/M1Cases.silk --no-cache | tee "$RUNNER_TEMP/m1-tests.log"
          node .github/scripts/check-selfhost-test-times.mjs "$RUNNER_TEMP/m1-tests.log"
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run M1 semantic cases
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/semantic/SemanticCases.silk --no-cache | tee "$RUNNER_TEMP/semantic-tests.log"
          node .github/scripts/check-selfhost-test-times.mjs "$RUNNER_TEMP/semantic-tests.log"
        env:
          NODE_OPTIONS: --max-old-space-size=10240
      - name: Run frozen target cases
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/semantic/TargetCases.silk --no-cache | tee "$RUNNER_TEMP/target-tests.log"
          node .github/scripts/check-selfhost-test-times.mjs "$RUNNER_TEMP/target-tests.log"
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - name: Run HIR lowering and fingerprint cases
        run: |
          set -o pipefail
          node packages/cli/dist/bin.js test --manifest-path compiler/silk.toml --root src/hir/LoweringCases.silk --no-cache | tee "$RUNNER_TEMP/hir-tests.log"
          node .github/scripts/check-selfhost-test-times.mjs "$RUNNER_TEMP/hir-tests.log"
      - name: Check B11 parsed-source retention baseline
        run: |
          node --input-type=module - "$RUNNER_TEMP/selfhost-corpus.log" <<'JS'
          import { readFileSync } from 'node:fs'
          const lines = readFileSync(process.argv[2], 'utf8').split('\n')
          // Preserve merged #615's baseline and exact-head verified Step 8 callable passes.
          const baselinePasses = [
            'trivial-features',
            'foreign-libc-pointer-roundtrip',
            'foreign-libc-floating',
            'else-if-chain',
            'scalar-reference-read',
            'scalar-reference-write-through',
            'operator-precedence',
            'operator-negation-overflow-trap',
            'mutable-scalar-loop',
            'nested-loops',
            'foreign-libc-abs',
            'retained-if-let-match-binding',
            'scalar-enum-equality-from-borrowed-variant',
            'while-entry-backedge',
            'generic-record-instances',
            'generic-union-instances',
            'generic-lifetime-selected-cleanup',
            'anonymous-callable-capture-modes',
            'captured-exclusive-reference-parameters',
            'staged-callable-bindings',
            'staged-callable-parameter',
            'operator-pipeline',
            'staged-callable-section',
            'native-descriptor-write',
            'callable-return-and-borrow-contracts',
            'borrowed-capture-section',
            'relayed-section',
            'generic-item-pipeline-in-generic-owner',
            'constrained-section-generic-owner',
            'owner-typed-direct-section',
            'option-result-combinators',
            'opaque-callable',
            'effect-nested-failure-propagation',
            'effect-selective-catch-direct-stored',
          ]
          const acceptedFailures = new Set([
            'ecdsa-p256-verification',
            'http-client-request',
            'json-scanner',
            'toml-scanner',
            'borrowed-temporary-stream-suspension',
            'integer-operation-matrix',
            'float-operation-matrix',
            'chacha20-poly1305',
            'aes-gcm',
            'rsa-verification',
            'fixed-output-sha',
            'pointer-parameter-write',
            'foreign-libc-qsort-callback',
            'foreign-libc-environ-static',
            'secure-random-provider',
          ])
          const passes = new Set(lines.filter((line) => line.startsWith('PASS ')).map((line) => line.slice(5)))
          for (const name of baselinePasses) {
            if (!passes.has(name)) throw new Error(`Baseline PASS lost: ${name}`)
          }
          for (const line of lines.filter((line) => line.startsWith('FAIL '))) {
            const name = line.slice(5).split(':', 1)[0]
            if (!acceptedFailures.has(name)) throw new Error(`New corpus failure: ${line}`)
          }
          if (lines.some((line) => /(?:code=RUNTIME_MISMATCH|code=CORPUS_RUNNER_FAILURE|module-source:)/.test(line))) {
            throw new Error('Corpus has a runtime mismatch, runner failure, or module-source gap')
          }
          const timings = lines.filter((line) => line.startsWith('SELFHOST_CASE_TIMING='))
          const outcomes = lines.filter((line) => /^(?:PASS|FAIL|UNSUPPORTED) /.test(line))
          if (timings.length !== outcomes.length || outcomes.length === 0) throw new Error('Incomplete corpus timing receipt')
          console.log(`Preserved ${baselinePasses.length} baseline passes; remaining failures are accepted baseline programs`)
          JS
      - name: Upload corpus build timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selfhost-corpus-timings
          path: ${{ runner.temp }}/selfhost-corpus.log
          retention-days: 7

      - name: Upload native formatter safety and samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-formatter-safety
          path: |
            ${{ runner.temp }}/formatter-safety.log
            ${{ runner.temp }}/formatter-samples.md
          retention-days: 7
