name: Cancel superseded PR runs

# Selfhost runs of one pull request queue behind each other (its `queue: max` concurrency refuses
# cancel-in-progress), so this workflow, which has no concurrency group, cancels a PR's older
# Selfhost runs as soon as a new push arrives.
on:
  pull_request:
    branches:
      - main
    types: [synchronize]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel older Selfhost runs of this pull request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for status in queued in_progress pending waiting; do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/selfhost.yml/runs?event=pull_request&status=$status&per_page=100" \
              --jq '.workflow_runs[] | select(.head_branch == env.BRANCH and .head_sha != env.HEAD_SHA) | .id'
          done | sort -u | while read -r id; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" > /dev/null || true
            echo "Cancelled run $id"
          done
