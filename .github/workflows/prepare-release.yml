name: Prepare compiler release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Stable release or prerelease channel
        type: choice
        options: [stable, beta, rc]
        default: stable

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: prepare-compiler-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Version the compiler and open a release PR
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native build receipts
        run: sudo apt-get install -y time
      - name: Read the seed pin
        id: pin
        run: node compiler/scripts/NativeSeed.mjs outputs compiler/native-seed.json x86_64-unknown-linux-gnu >> "$GITHUB_OUTPUT"
      - name: Download and verify the native seed before execution
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pin.outputs.tag }}
          ASSET: ${{ steps.pin.outputs.asset }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --dir "$RUNNER_TEMP/seed-download"
          mkdir "$RUNNER_TEMP/seed"
          node compiler/scripts/NativeSeed.mjs verify compiler/native-seed.json x86_64-unknown-linux-gnu \
            "$RUNNER_TEMP/seed-download/$ASSET" "$RUNNER_TEMP/seed/compiler"
      - name: Build the release tool from this exact commit
        env:
          SEED_SHA256: ${{ steps.pin.outputs.sha256 }}
        run: |
          set -euo pipefail
          node compiler/scripts/SourceSnapshot.mjs create "$RUNNER_TEMP/authored-inputs" HEAD
          node compiler/scripts/NativeBuild.ts --producer "$RUNNER_TEMP/seed/compiler" --producer-sha256 "$SEED_SHA256" \
            --producer-generation seed --generation N1 --clang "$SILK_TEST_CLANG" \
            --snapshot "$RUNNER_TEMP/authored-inputs" --output "$RUNNER_TEMP/release-tool" \
            --corpus-source "$GITHUB_WORKSPACE/corpus/native/trivial-features/main.silk"
      - name: Consume pending changes and open the release PR
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          args=()
          if [ "$CHANNEL" != stable ]; then args=(--tag "$CHANNEL"); fi
          "$RUNNER_TEMP/release-tool/N1" changes --dir compiler version "${args[@]}"
          "$RUNNER_TEMP/release-tool/N1" changes --dir compiler release --json > "$RUNNER_TEMP/release.json"
          version=$(jq -er .version "$RUNNER_TEMP/release.json")
          git add compiler/silk.toml compiler/src/ReleaseVersion.silk compiler/CHANGELOG.md compiler/.changes
          if git diff --cached --quiet; then
            echo '::error::No pending changes or prerelease promotion to prepare.'
            exit 1
          fi
          branch="release/compiler-v$version"
          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Release Silk $version"
          # Never force-push or replace a release PR that is already under review.
          git push origin "HEAD:refs/heads/$branch"
          {
            printf 'Prepare Silk %s from the pending compiler changes.\n\n' "$version"
            printf 'This commits the manifest, generated version module, TOML history and generated changelog together. After review and merge, run **Selfhost Silk** on main with **publish** enabled. No tag or release has been published yet.\n\n'
            jq -r .notes "$RUNNER_TEMP/release.json"
          } > "$RUNNER_TEMP/release-pr.md"
          pr=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --draft \
            --title "Release Silk $version" --body-file "$RUNNER_TEMP/release-pr.md")
          # Commits made with GITHUB_TOKEN do not trigger pull_request workflows automatically.
          gh workflow run selfhost.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          printf '### Prepared Silk %s\n\n%s\n\nSelfhost verification dispatched; review and merge before publication.\n' \
            "$version" "$pr" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve release-tool build receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-release-preparation
          path: |
            ${{ runner.temp }}/release-tool/*.json
            ${{ runner.temp }}/release-tool/*.bin
          if-no-files-found: ignore
          retention-days: 7
