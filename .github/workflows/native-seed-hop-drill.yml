name: Native seed hop drill

# Scheduled workflows run from the default branch; the chain they replay lives on `selfhost`.
# Rebuilds the current pinned seed's own source with the seed that source pinned (one hop of the
# recovery procedure in compiler/docs/native-seed-chain.md#hop-replay) and requires the rebuilt
# N2 to emit the compiler's LLVM IR byte for byte as the published seed does.
on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-seed-hop-drill
  cancel-in-progress: false

jobs:
  drill:
    name: Replay the current seed from its predecessor
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: selfhost
          fetch-depth: 0
      - name: Find the current seed and the source it was built from
        id: hop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(jq -er .seed.tag compiler/native-seed.json)"
          mkdir -p "$RUNNER_TEMP/current"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern native-seed.json --dir "$RUNNER_TEMP/current"
          source="$(jq -er .seed.sourceCommit "$RUNNER_TEMP/current/native-seed.json")"
          { echo "tag=$tag"; echo "source=$source"; } >> "$GITHUB_OUTPUT"
      # The source commit's own pin names the seed that built N1 for it: the previous hop.
      - name: Check out the current seed's source
        env:
          SOURCE: ${{ steps.hop.outputs.source }}
        run: git checkout --detach "$SOURCE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/setup-linux-llvm
      - name: Install GNU time for native process receipts
        run: sudo apt-get install -y time
      - name: Download and verify both seeds before execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            local pin="$1" name="$2" tag asset
            tag="$(jq -er .seed.tag "$pin")"
            asset="$(jq -er .seed.asset "$pin")"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/$name-download"
            mkdir -p "$RUNNER_TEMP/seeds"
            node compiler/scripts/NativeSeed.mjs verify "$pin" "$RUNNER_TEMP/$name-download/$asset" "$RUNNER_TEMP/seeds/$name"
          }
          verify compiler/native-seed.json previous
          verify "$RUNNER_TEMP/current/native-seed.json" current
      - name: Rebuild N1 and N2 from the previous seed and compare with the published seed
        env:
          SILKC_CLANG: ${{ env.SILK_TEST_CLANG }}
          TAG: ${{ steps.hop.outputs.tag }}
          SOURCE: ${{ steps.hop.outputs.source }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/drill"
          mkdir -p "$out"
          args=(--stdlib "$GITHUB_WORKSPACE/packages/compiler/stdlib" --optimization speed --debug false)
          stage() {
            local name="$1"
            shift
            /usr/bin/time -f '%e %M' -o "$out/$name-time.txt" "$@" > "$out/$name.log" 2>&1 || {
              tail -n 60 "$out/$name.log"
              echo "::error title=Hop drill stage $name failed::See the native-seed-hop-drill artifact."
              exit 1
            }
          }
          cd compiler
          stage n1 "$RUNNER_TEMP/seeds/previous" build src/main.silk -o "$out/N1" "${args[@]}"
          stage n2 "$out/N1" build src/main.silk -o "$out/N2" "${args[@]}"
          stage n2-ir "$out/N2" build src/main.silk -o "$out/n2.ll" --emit llvm-ir "${args[@]}"
          stage published-ir "$RUNNER_TEMP/seeds/current" build src/main.silk -o "$out/published.ll" --emit llvm-ir "${args[@]}"
          identical=true
          cmp -s "$out/n2.ll" "$out/published.ll" || identical=false
          jq -n --arg tag "$TAG" --arg source "$SOURCE" --arg previous "$(jq -er .seed.tag native-seed.json)" \
            --arg n2sha "$(sha256sum "$out/n2.ll" | cut -d' ' -f1)" \
            --arg publishedsha "$(sha256sum "$out/published.ll" | cut -d' ' -f1)" \
            --argjson identical "$identical" \
            '{seed: $tag, source: $source, previous: $previous, identical: $identical,
              irSha256: {replayedN2: $n2sha, published: $publishedsha}}' | tee "$out/receipt.json"
          if [ "$identical" != true ]; then
            diff "$out/published.ll" "$out/n2.ll" | head -n 200 | cut -c 1-300 > "$out/ir-diff.txt" || true
            echo "::error title=Hop replay diverged::The replayed N2 and the published seed emit different compiler IR; the chain no longer replays from its predecessor."
            exit 1
          fi
      - name: Preserve the drill receipt and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-seed-hop-drill
          path: |
            ${{ runner.temp }}/drill/*.json
            ${{ runner.temp }}/drill/*.log
            ${{ runner.temp }}/drill/*.txt
          if-no-files-found: ignore
          retention-days: 90
