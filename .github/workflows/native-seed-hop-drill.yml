name: Native seed hop drill

# GitHub schedules run on main. Execute the matching workflow on selfhost so its pin schema,
# history reader, and verification tooling always come from the same compiler branch.
on:
  schedule:
    - cron: '41 6 * * 2'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: native-seed-hop-drill-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    name: Run the selfhost workflow
    # Only main's copy dispatches. A copy that reaches selfhost through a sync must not re-dispatch
    # itself there.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the matching workflow on selfhost
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run native-seed-hop-drill.yml --repo "$GITHUB_REPOSITORY" --ref selfhost
