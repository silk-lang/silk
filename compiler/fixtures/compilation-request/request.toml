version = 1
name = "request-fixture"
artifact = "executable"
root = "/REQUEST_ROOT/main.silk"
output = "/REQUEST_ROOT/program"
stdlib = "/STDLIB_ROOT"
emit = "final"
[profile]
target = "x86_64-unknown-linux-gnu"
cpu-features = []
libc = "gnu"
entry = "default"
runtime = "default"
link = "dynamic"
code-model = "small"
relocation = "static"
optimization = "none"
debug = false
safety = "checked"
threading = "single"
sanitizers = []
unwind = "none"
backend = "llvm"
[[packages]]
name = "request-fixture"
version = "0.1.0"
directory = "/REQUEST_ROOT"
source = "/REQUEST_ROOT"
dependencies = [{ name = "dep", package = "request-dependency@0.1.0" }]
exports = []
parameters = []
modules = [{ name = "generated", source = "/REQUEST_ROOT/generated-source.silk" }]
[[packages]]
name = "request-dependency"
version = "0.1.0"
directory = "/REQUEST_ROOT/dependency"
source = "/REQUEST_ROOT/dependency"
dependencies = []
exports = ["value.silk"]
modules = []
parameters = [{ name = "answer", module = "value.silk", type = "i32", description = "The configured answer.", required = false, supplied-path = false, value = { type = "Integer", decimal = "42" } }]
[composition]
runtime = { package = "silk", module = "silk/platform/native/start.silk" }
support = []
retention = []
[composition.storage]
create = { package = "silk", module = "silk/concurrency/execution_storage.silk", declaration = "silk_execution_storage_create" }
acquire = { package = "silk", module = "silk/concurrency/execution_storage.silk", declaration = "silk_execution_storage_acquire" }
release = { package = "silk", module = "silk/concurrency/execution_storage.silk", declaration = "silk_execution_storage_release" }
destroy = { package = "silk", module = "silk/concurrency/execution_storage.silk", declaration = "silk_execution_storage_destroy" }
[native]
sources = [{ path = "/REQUEST_ROOT/native.c", language = "c", flags = [], include = [] }]
link = []
