# Edits `silk check --replay` applies to the compiler package, one per edit kind. lexer/Span.silk
# is imported by most of the compiler. The added declaration is what the header-new-type and
# delete edits change, and the renamed module leaves main.silk's import of it unresolved.

[[edit]]
kind = "trivia"
module = "lexer/Span.silk"
find = "impl Span {\n"
replace = "// A comment the replay adds.\nimpl Span {\n"

[[edit]]
kind = "body"
module = "lexer/Span.silk"
find = "return Span { start: start, end: end }"
replace = "return Span { end: end, start: start }"

[[edit]]
kind = "header-same-type"
module = "lexer/Span.silk"
find = "pub fn make(start: usize, end: usize) -> Span {\n    return Span { end: end, start: start }"
replace = "pub fn make(first: usize, last: usize) -> Span {\n    return Span { end: last, start: first }"

[[edit]]
kind = "add"
module = "lexer/Span.silk"
find = "impl Span {\n"
replace = "impl Span {\n  /// A declaration the replay adds.\n  pub fn replayProbe() -> i32 { return 1 }\n\n"

[[edit]]
kind = "header-new-type"
module = "lexer/Span.silk"
find = "pub fn replayProbe() -> i32 { return 1 }"
replace = "pub fn replayProbe() -> i64 { return 1 }"

[[edit]]
kind = "delete"
module = "lexer/Span.silk"
find = "  /// A declaration the replay adds.\n  pub fn replayProbe() -> i64 { return 1 }\n\n"
replace = ""

[[edit]]
kind = "rename"
module = "ReleaseVersion.silk"
to = "ReleaseVersionRenamed.silk"
