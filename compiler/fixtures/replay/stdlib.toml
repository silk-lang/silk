# Edits `silk check --replay` applies to the standard library checked as a root package
# (compiler/fixtures/stdlib-root), one per edit kind. silk/collections/bytes.silk is read by most modules.
# The added declaration is what the header-new-type and delete edits change, and the renamed
# module leaves its importers' imports unresolved.

[[edit]]
kind = "trivia"
module = "silk/collections/bytes.silk"
find = "  /// Returns the number of bytes.\n"
replace = "  // A comment the replay adds.\n  /// Returns the number of bytes.\n"

[[edit]]
kind = "body"
module = "silk/collections/bytes.silk"
find = "let _appended = run Bytes.append(&mut result, values)"
replace = "let _added = run Bytes.append(&mut result, values)"

[[edit]]
kind = "header-same-type"
module = "silk/collections/bytes.silk"
find = "pub fn truncate(self: &mut Self, length: usize) -> () {\n    return List<u8>.truncate(&mut self.values, length)"
replace = "pub fn truncate(self: &mut Self, limit: usize) -> () {\n    return List<u8>.truncate(&mut self.values, limit)"

[[edit]]
kind = "directive"
module = "silk/collections/bytes.silk"
find = "  pub fn truncate(self: &mut Self, limit: usize) -> () {"
replace = "  @inline\n  pub fn truncate(self: &mut Self, limit: usize) -> () {"

[[edit]]
