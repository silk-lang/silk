[package]
name = "effect-http-hyper"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1.5"
hyper = { version = "1.11.1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
tokio = { version = "1", features = ["macros", "net", "rt"] }

[profile.release]
debug = 1
