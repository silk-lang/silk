# Canonical silk.toml schema. Embedded by driver.ManifestSchema; edit this file, not a copy.
# See reference/modules-names-and-visibility.md for semantic checks outside JSON Schema.

"$schema" = "https://json-schema.org/draft/2020-12/schema"
"$id" = "https://silklang.org/schemas/manifest"
"title" = "Silk package and workspace manifest"
"description" = "Structural schema for silk.toml. Filesystem resolution, dependency graphs, source-kind/spelling constraints and target/profile compatibility remain compiler checks. The tool member is opaque and excluded from manifest validation before mapping TOML to JSON."
"type" = "object"
"additionalProperties" = false
"allOf" = [{ "title" = "a package or workspace manifest, with a [package] or [workspace] table", "anyOf" = [{ "required" = ["package"] }, { "required" = ["workspace"] }] }, { "if" = { "not" = { "required" = ["package"] } }, "then" = { "properties" = { "config" = { "title" = "empty, as only a package takes config", "maxProperties" = 0 }, "profiles" = { "additionalProperties" = { "properties" = { "config" = { "title" = "empty, as only a package takes config", "maxProperties" = 0 } } } } } } }]

[properties]
"package" = { "$ref" = "#/$defs/package" }
"build" = { "$ref" = "#/$defs/build" }
"dependencies" = { "$ref" = "#/$defs/dependencies" }
"workspace" = { "$ref" = "#/$defs/workspace" }
"release" = { "$ref" = "#/$defs/release" }
"config" = { "$ref" = "#/$defs/config" }
"profiles" = { "$ref" = "#/$defs/profiles" }
"native" = { "$ref" = "#/$defs/native" }
"unstable" = { "$ref" = "#/$defs/unstable" }
"component" = { "$ref" = "#/$defs/component" }
"tool" = true
"generate" = { "type" = "array", "items" = { "$ref" = "#/$defs/generator" } }
"post-init" = { "type" = "array", "items" = { "$ref" = "#/$defs/postInit" } }

["$defs"."text"]
"type" = "string"

["$defs"."nonemptyText"]
"title" = "nonempty text without NUL characters"
"type" = "string"
"minLength" = 1
"pattern" = "^[^\\u0000]*$"

["$defs"."argument"]
"title" = "text without NUL characters"
"type" = "string"
"pattern" = "^[^\\u0000]*$"

["$defs"."strings"]
"type" = "array"
"items" = { "$ref" = "#/$defs/text" }

["$defs"."packageName"]
"title" = "a package name: a lowercase ASCII letter, then lowercase letters, digits, _ or -, other than self, silk and silkc"
"type" = "string"
"pattern" = "^[a-z][a-z0-9_-]*$"
"not" = { "enum" = ["self", "silk", "silkc"] }

["$defs"."identifier"]
"title" = "an identifier: an ASCII letter or _, then letters, digits or _"
"type" = "string"
"pattern" = "^[A-Za-z_][A-Za-z0-9_]*$"

["$defs"."moduleName"]
"title" = "a module name in import spelling, such as codec.Json"
"type" = "string"
"pattern" = "^[A-Za-z_][A-Za-z0-9_]*(\\.[A-Za-z_][A-Za-z0-9_]*)*$"

["$defs"."semver"]
"title" = "a full semantic version, such as 0.1.0"
"type" = "string"
"pattern" = "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?(\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?$"

["$defs"."relativeDirectory"]
"title" = "a directory relative to the manifest"
"type" = "string"
"minLength" = 1
"pattern" = "^(?![/\\\\])(?!.:[/\\\\])[^\\u0000]*$"
"description" = "Manifest-relative directory. Normalization and confinement, including balanced parent components, are checked by the compiler."

["$defs"."nativePath"]
"title" = "a relative slash-separated path with no empty, . or .. components"
"type" = "string"
"pattern" = "^(?!/)(?!.*(?:^|/)\\.{1,2}(?:/|$))[^/\\u0000]+(?:/[^/\\u0000]+)*$"
"description" = "A nonempty slash-separated native path; no empty, dot, or parent components. Archive references are resolved by the compiler."

["$defs"."target"]
"enum" = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2", "wasm64-unknown-unknown"]

["$defs"."targetSelector"]
"title" = "host or a target name"
"anyOf" = [{ "const" = "host" }, { "$ref" = "#/$defs/target" }]

["$defs"."package"]
"type" = "object"
"additionalProperties" = false
"description" = "A package identity and its source layout. Versions and source files need not be written when defaults suffice."
"required" = ["name"]

["$defs"."package".properties]
"name" = { "$ref" = "#/$defs/packageName" }
"version" = { "$ref" = "#/$defs/semver", "default" = "0.0.0" }
"silk-version" = { "$ref" = "#/$defs/semver" }
"source" = { "$ref" = "#/$defs/nonemptyText", "default" = "src", "description" = "Import root, resolved against the package directory; absolute and parent-relative roots are accepted." }
"main" = { "$ref" = "#/$defs/nonemptyText", "description" = "Root module path resolved against source. The compiler checks that its normalized path stays inside that source root." }
"kind" = { "enum" = ["executable", "library", "static-library", "shared-library", "object"], "default" = "executable" }
"exports" = { "type" = "array", "items" = { "$ref" = "#/$defs/moduleName" } }
"description" = { "$ref" = "#/$defs/text" }
"license" = { "$ref" = "#/$defs/text" }
"repository" = { "$ref" = "#/$defs/text" }
"homepage" = { "$ref" = "#/$defs/text" }
"authors" = { "$ref" = "#/$defs/strings" }
"keywords" = { "$ref" = "#/$defs/strings" }
"readme" = { "$ref" = "#/$defs/text" }
"include" = { "type" = "array", "items" = { "$ref" = "#/$defs/nonemptyText" }, "description" = "Files and directories, relative to the package directory, that `silk pack` adds to the archive beside the source root." }
"publish" = { "type" = "boolean", "default" = true, "description" = "Whether the package is released; `false` keeps `silk pack` from packing it, as for a workspace's examples." }

["$defs"."build"]
"type" = "object"
"additionalProperties" = false

["$defs"."build".properties]
"targets" = { "type" = "array", "items" = { "$ref" = "#/$defs/targetSelector" }, "minItems" = 1 }
"output-dir" = { "$ref" = "#/$defs/relativeDirectory", "default" = "build" }
"stage" = { "enum" = ["final", "llvm-ir", "llvm-bitcode", "assembly", "object", "wasm-text"] }
"profile" = { "$ref" = "#/$defs/nonemptyText" }
"tools" = { "type" = "array", "items" = { "$ref" = "#/$defs/identifier" } }
"unsandboxed-tools" = { "type" = "boolean" }

["$defs"."dependencyName"]
"title" = "a dependency name: an identifier other than silk, silkc, Intrinsic and self"
"allOf" = [{ "$ref" = "#/$defs/identifier" }, { "not" = { "enum" = ["silk", "silkc", "Intrinsic", "self"] } }]

["$defs"."dependency"]
"title" = "a dependency: { path = ... }, { git = ..., rev = ... } or { url = ..., sha256 = ... }, with an optional package"
"type" = "object"
"additionalProperties" = false
"oneOf" = [{ "required" = ["path"], "not" = { "anyOf" = [{ "required" = ["git"] }, { "required" = ["rev"] }, { "required" = ["url"] }, { "required" = ["sha256"] }] } }, { "required" = ["git", "rev"], "not" = { "anyOf" = [{ "required" = ["url"] }, { "required" = ["sha256"] }] } }, { "required" = ["url", "sha256"], "not" = { "anyOf" = [{ "required" = ["git"] }, { "required" = ["rev"] }] } }]

["$defs"."dependency".properties]
"path" = { "$ref" = "#/$defs/nonemptyText" }
"package" = { "$ref" = "#/$defs/packageName" }
"git" = { "$ref" = "#/$defs/nonemptyText" }
"rev" = { "type" = "string", "title" = "a full commit hash: 40 or 64 lowercase hexadecimal digits", "pattern" = "^(?:[0-9a-f]{40}|[0-9a-f]{64})$" }
"url" = { "type" = "string", "title" = "an https:// or file:/// URL", "minLength" = 9, "pattern" = "^(https://|file:///)", "description" = "Where the package's archive is: a tar.gz or ZIP file, such as one that silk pack writes." }
"sha256" = { "type" = "string", "title" = "a SHA-256 digest: 64 lowercase hexadecimal digits", "pattern" = "^[0-9a-f]{64}$", "description" = "The SHA-256 of the archive at url, in lowercase hexadecimal." }

["$defs"."dependencies"]
"type" = "object"
"propertyNames" = { "$ref" = "#/$defs/dependencyName" }
"additionalProperties" = { "$ref" = "#/$defs/dependency" }

["$defs"."workspace"]
"type" = "object"
"additionalProperties" = false
"description" = "A virtual workspace or a workspace root that is also a package. Member expansion, existence and uniqueness after resolution are compiler checks."
"required" = ["members"]

["$defs"."workspace".properties]
"members" = { "type" = "array", "items" = { "$ref" = "#/$defs/relativeDirectory" } }
"output-dir" = { "$ref" = "#/$defs/relativeDirectory", "default" = "build" }
"silk-version" = { "$ref" = "#/$defs/semver" }

["$defs"."release"]
"type" = "object"
"additionalProperties" = false
"description" = "Release publication settings consumed by silk change; source existence and publication state are not schema constraints."

["$defs"."release".properties]
"repository" = { "type" = "string", "title" = "a GitHub repository such as owner/name", "pattern" = "^(?!\\.{1,2}/)[A-Za-z0-9_.-]+/(?!\\.{1,2}$)[A-Za-z0-9_.-]+$" }
"directory" = { "type" = "string", "title" = "a relative slash-separated directory with no ., .. or control characters", "pattern" = "^(?:(?!\\.{1,2}(?:/|$))[^/\\\\\\u0000-\\u001f\\u007f]+(?:/(?!\\.{1,2}(?:/|$))[^/\\\\\\u0000-\\u001f\\u007f]+)*)?$" }
"version-file" = { "type" = "string", "title" = "a relative path to a .silk file outside .changes", "pattern" = "^(?!.*(?:^|/)(?:\\.{1,2}|\\.[cC][hH][aA][nN][gG][eE][sS])(?:/|$))[^/:\\\\\\u0000-\\u001f\\u007f]+(?:/[^/:\\\\\\u0000-\\u001f\\u007f]+)*\\.silk$" }

["$defs"."bindingScalar"]
"type" = ["integer", "boolean", "string"]

["$defs"."bindingValue"]
"title" = "an integer, a boolean, a string, or an array or table of them"
"anyOf" = [{ "$ref" = "#/$defs/bindingScalar" }, { "type" = "array", "items" = { "$ref" = "#/$defs/bindingValue" } }, { "type" = "object", "additionalProperties" = { "$ref" = "#/$defs/bindingValue" } }]

["$defs"."configNamespace"]
"title" = "a table of parameter values, below a module name such as main"
"type" = "object"
"additionalProperties" = { "title" = "a parameter value: an integer, a boolean, a string, an array of values, or a table of a nested module", "anyOf" = [{ "$ref" = "#/$defs/bindingScalar" }, { "type" = "array", "items" = { "$ref" = "#/$defs/bindingValue" } }, { "$ref" = "#/$defs/configNamespace" }] }

["$defs"."config"]
"type" = "object"
"additionalProperties" = { "$ref" = "#/$defs/configNamespace" }
"description" = "Tables name modules; leaves bind parameters. Records occur inside arrays. TOML integer spelling and parameter types remain compiler checks."

["$defs"."selection"]
"title" = "{ kind = \"default\" }, { kind = \"none\" } or { kind = \"named\", name = ... }"
"oneOf" = [{ "type" = "object", "additionalProperties" = false, "required" = ["kind"], "properties" = { "kind" = { "enum" = ["default", "none"] } } }, { "type" = "object", "additionalProperties" = false, "required" = ["kind", "name"], "properties" = { "kind" = { "const" = "named" }, "name" = { "type" = "string", "title" = "a name of letters, digits and _@.+:/- without ..", "pattern" = "^(?!.*\\.\\.)[A-Za-z0-9_][A-Za-z0-9_@.+:/-]*$" } } }]

["$defs"."memorySize"]
"title" = "a positive size in bytes, KiB, MiB or GiB, such as 256MiB"
"type" = "string"
"pattern" = "^(?!0+(?:KiB|MiB|GiB)?$)[0-9]{1,10}(?:KiB|MiB|GiB)?$"
"description" = "Positive size in bytes or KiB/MiB/GiB. Alignment, scaled bounds and target suitability are compiler checks."

["$defs"."profile"]
"type" = "object"
"additionalProperties" = false
"description" = "A named compilation profile. Cross-field combinations, named selections and target-specific capabilities are checked when the profile is assembled."

["$defs"."profile".properties]
"target" = { "$ref" = "#/$defs/target" }
"cpu" = { "type" = "object", "additionalProperties" = false, "properties" = { "model" = { "$ref" = "#/$defs/text" }, "features" = { "$ref" = "#/$defs/strings" } } }
"deployment" = { "type" = "string", "title" = "an OS version such as 14.0", "pattern" = "^(0|[1-9][0-9]*)(\\.(0|[1-9][0-9]*)){0,2}$" }
"libc" = { "enum" = ["none", "system", "gnu"] }
"artifact" = { "enum" = ["executable", "loadable-module", "static-archive", "object"] }
"entry" = { "$ref" = "#/$defs/selection" }
"runtime" = { "$ref" = "#/$defs/selection" }
"link" = { "enum" = ["static", "dynamic"] }
"code-model" = { "enum" = ["small", "large"] }
"relocation" = { "enum" = ["static", "pic"] }
"optimization" = { "enum" = ["none", "speed", "size"] }
"debug" = { "type" = "boolean" }
"safety" = { "enum" = ["checked", "unchecked"] }
"threading" = { "enum" = ["single", "multi"] }
"sanitizers" = { "type" = "array", "items" = { "enum" = ["address", "thread", "undefined"] } }
"unwind" = { "enum" = ["none", "native"] }
"backend" = { "enum" = ["llvm", "direct"] }
"codegen-units" = { "type" = "integer", "minimum" = 1, "maximum" = 256 }
"max-memory" = { "$ref" = "#/$defs/memorySize" }
"stack-size" = { "$ref" = "#/$defs/memorySize" }
"config" = { "$ref" = "#/$defs/config" }

["$defs"."profiles"]
"type" = "object"
"propertyNames" = { "title" = "a profile name: an ASCII letter, then letters, digits, _ or -", "pattern" = "^[A-Za-z][A-Za-z0-9_-]*$" }
"additionalProperties" = { "$ref" = "#/$defs/profile" }

["$defs"."os"]
"title" = "an operating system (macos, linux, windows or wasi) or a list of them"
"anyOf" = [{ "enum" = ["macos", "linux", "windows", "wasi"] }, { "type" = "array", "items" = { "enum" = ["macos", "linux", "windows", "wasi"] }, "minItems" = 1 }]

["$defs"."libraryName"]
"title" = "a library name without slashes, whitespace or a leading -"
"type" = "string"
"minLength" = 1
"pattern" = "^(?!-)[^/\\\\\\u0000\\t\\n\\r\\f\\v ]+$"

["$defs"."nativeLink"]
"title" = "one of { object = ... }, { static-archive = ... }, { search-path = ... }, { linker-script = ... }, { framework = ... } or { library = ..., mode = ... }, with an optional os"
"oneOf" = [{ "type" = "object", "additionalProperties" = false, "required" = ["object"], "properties" = { "object" = { "$ref" = "#/$defs/nativePath" }, "os" = { "$ref" = "#/$defs/os" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["static-archive"], "properties" = { "static-archive" = { "$ref" = "#/$defs/nativePath" }, "os" = { "$ref" = "#/$defs/os" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["search-path"], "properties" = { "search-path" = { "$ref" = "#/$defs/nativePath" }, "os" = { "$ref" = "#/$defs/os" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["linker-script"], "properties" = { "linker-script" = { "$ref" = "#/$defs/nativePath" }, "os" = { "$ref" = "#/$defs/os" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["framework"], "properties" = { "framework" = { "$ref" = "#/$defs/libraryName" }, "os" = { "$ref" = "#/$defs/os" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["library", "mode"], "properties" = { "library" = { "$ref" = "#/$defs/libraryName" }, "mode" = { "enum" = ["static", "dynamic"] }, "os" = { "$ref" = "#/$defs/os" } } }]

["$defs"."textOrTexts"]
"title" = "a string or an array of strings"
"anyOf" = [{ "$ref" = "#/$defs/text" }, { "$ref" = "#/$defs/strings" }]

["$defs"."nativeSources"]
"title" = "a table with exactly one of c, objc, cpp and objcpp, and optional flags, include and os"
"type" = "object"
"additionalProperties" = false
"oneOf" = [{ "required" = ["c"] }, { "required" = ["objc"] }, { "required" = ["cpp"] }, { "required" = ["objcpp"] }]
"description" = "Exactly one source language. Source glob placement, include paths and the permitted compiler-flag subset are validated by the native build decoder."

["$defs"."nativeSources".properties]
"c" = { "title" = "a native path or a nonempty array of them", "anyOf" = [{ "$ref" = "#/$defs/nativePath" }, { "type" = "array", "items" = { "$ref" = "#/$defs/nativePath" }, "minItems" = 1 }] }
"objc" = { "title" = "a native path or a nonempty array of them", "anyOf" = [{ "$ref" = "#/$defs/nativePath" }, { "type" = "array", "items" = { "$ref" = "#/$defs/nativePath" }, "minItems" = 1 }] }
"cpp" = { "title" = "a native path or a nonempty array of them", "anyOf" = [{ "$ref" = "#/$defs/nativePath" }, { "type" = "array", "items" = { "$ref" = "#/$defs/nativePath" }, "minItems" = 1 }] }
"objcpp" = { "title" = "a native path or a nonempty array of them", "anyOf" = [{ "$ref" = "#/$defs/nativePath" }, { "type" = "array", "items" = { "$ref" = "#/$defs/nativePath" }, "minItems" = 1 }] }
"flags" = { "$ref" = "#/$defs/textOrTexts" }
"include" = { "$ref" = "#/$defs/textOrTexts" }
"os" = { "$ref" = "#/$defs/os" }

["$defs"."archiveVariant"]
"type" = "object"
"additionalProperties" = false
"required" = ["url", "sha256"]

["$defs"."archiveVariant".properties]
"url" = { "type" = "string", "title" = "an https:// or file:/// URL", "minLength" = 9, "pattern" = "^(https://|file:///)" }
"sha256" = { "type" = "string", "title" = "a SHA-256 digest: 64 hexadecimal digits", "pattern" = "^[0-9a-fA-F]{64}$" }
"strip" = { "type" = "integer", "minimum" = 0, "maximum" = 99 }

["$defs"."archive"]
"title" = "an archive: { url = ..., sha256 = ... } with an optional strip, or { targets = { <target> = { url = ..., sha256 = ... } } }"
"oneOf" = [{ "$ref" = "#/$defs/archiveVariant" }, { "type" = "object", "additionalProperties" = false, "required" = ["targets"], "properties" = { "targets" = { "type" = "object", "additionalProperties" = { "$ref" = "#/$defs/archiveVariant" } } } }]

["$defs"."archiveName"]
"title" = "an archive name: a lowercase ASCII letter, then lowercase letters, digits, _ or -"
"type" = "string"
"pattern" = "^[a-z][a-z0-9_-]*$"

["$defs"."supplyTarget"]
"enum" = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]

["$defs"."support"]
"type" = "object"
"additionalProperties" = false
"required" = ["root", "target", "origin"]

["$defs"."support".properties]
"root" = { "$ref" = "#/$defs/text" }
"target" = { "$ref" = "#/$defs/supplyTarget" }
"origin" = { "$ref" = "#/$defs/text" }

["$defs"."platformSupply"]
"title" = "{ kind = \"automatic\" }, { kind = \"native\" }, { kind = \"managed\", name = ... } or { kind = \"explicit\", target = ..., root = ..., linker = ... }"
"oneOf" = [{ "type" = "object", "additionalProperties" = false, "required" = ["kind"], "properties" = { "kind" = { "enum" = ["automatic", "native"] } } }, { "type" = "object", "additionalProperties" = false, "required" = ["kind", "name"], "properties" = { "kind" = { "const" = "managed" }, "name" = { "$ref" = "#/$defs/text" } } }, { "type" = "object", "additionalProperties" = false, "required" = ["kind", "target", "root", "linker"], "properties" = { "kind" = { "const" = "explicit" }, "target" = { "$ref" = "#/$defs/supplyTarget" }, "root" = { "$ref" = "#/$defs/text" }, "linker" = { "$ref" = "#/$defs/text" }, "origin" = { "$ref" = "#/$defs/text" }, "support" = { "type" = "array", "items" = { "$ref" = "#/$defs/support" } } } }]

["$defs"."native"]
"type" = "object"
"additionalProperties" = false

["$defs"."native".properties]
"link" = { "type" = "array", "items" = { "$ref" = "#/$defs/nativeLink" } }
"sources" = { "type" = "array", "items" = { "$ref" = "#/$defs/nativeSources" } }
"archive" = { "type" = "object", "propertyNames" = { "$ref" = "#/$defs/archiveName" }, "additionalProperties" = { "$ref" = "#/$defs/archive" } }
"override" = { "type" = "object", "propertyNames" = { "$ref" = "#/$defs/archiveName" }, "additionalProperties" = { "type" = "object", "additionalProperties" = false, "required" = ["path"], "properties" = { "path" = { "$ref" = "#/$defs/nonemptyText" } } } }
"function-order" = { "$ref" = "#/$defs/nativePath" }
"platform-supply" = { "$ref" = "#/$defs/platformSupply" }

["$defs"."retention"]
"type" = "object"
"additionalProperties" = false
"required" = ["module", "declaration"]

["$defs"."retention".properties]
"module" = { "$ref" = "#/$defs/nonemptyText" }
"declaration" = { "$ref" = "#/$defs/identifier" }

["$defs"."runtime"]
"type" = "object"
"additionalProperties" = false
"required" = ["name", "module"]

["$defs"."runtime".properties]
"name" = { "$ref" = "#/$defs/nonemptyText" }
"module" = { "$ref" = "#/$defs/nonemptyText" }

["$defs"."storageBinding"]
"type" = "object"
"additionalProperties" = false
"required" = ["operation", "module", "declaration"]

["$defs"."storageBinding".properties]
"operation" = { "enum" = ["create", "acquire", "release", "destroy"] }
"module" = { "$ref" = "#/$defs/nonemptyText" }
"declaration" = { "$ref" = "#/$defs/identifier" }

["$defs"."composition"]
"type" = "object"
"additionalProperties" = false
"description" = "Runtime/provider composition. Runtime names, complete storage binding sets and declaration resolution remain compiler checks."

["$defs"."composition".properties]
"runtimes" = { "type" = "array", "items" = { "$ref" = "#/$defs/runtime" } }
"defaults" = { "$ref" = "#/$defs/strings" }
"components" = { "type" = "array", "items" = { "type" = "object", "additionalProperties" = false, "required" = ["capability", "bindings"], "properties" = { "capability" = { "const" = "execution-storage" }, "bindings" = { "type" = "array", "items" = { "$ref" = "#/$defs/storageBinding" } } } } }
"retention" = { "type" = "array", "items" = { "$ref" = "#/$defs/retention" } }
"requirements" = { "type" = "array", "title" = "empty, as requirements are not supported yet", "maxItems" = 0 }

["$defs"."unstable"]
"type" = "object"
"additionalProperties" = false

["$defs"."unstable".properties]
"composition" = { "$ref" = "#/$defs/composition" }

["$defs"."hookPath"]
"title" = "a path below the manifest directory with no empty, . or .. components, backslashes or *"
"type" = "string"
"pattern" = "^(?!/)(?!.:)(?!.*\\\\)(?!.*(?:^|/)\\.{1,2}(?:/|$))[^/\\u0000*]+(?:/[^/\\u0000*]+)*$"

["$defs"."hookOutput"]
"title" = "a path below the manifest directory with no empty, . or .. components or backslashes; only the last component may hold *"
"type" = "string"
"pattern" = "^(?!/)(?!.:)(?!.*\\\\)(?!.*(?:^|/)\\.{1,2}(?:/|$))(?:[^/\\u0000*]+/)*[^/\\u0000]+$"

["$defs"."hookProgram"]
"allOf" = [{ "$ref" = "#/$defs/nonemptyText" }, { "if" = { "pattern" = "/" }, "then" = { "$ref" = "#/$defs/hookPath" } }]

["$defs"."command"]
"title" = "a command: the program, then its arguments"
"type" = "array"
"minItems" = 1
"prefixItems" = [{ "$ref" = "#/$defs/hookProgram" }]
"items" = { "$ref" = "#/$defs/argument" }

["$defs"."generator"]
"type" = "object"
"additionalProperties" = false
"required" = ["run", "outputs"]

["$defs"."generator".properties]
"run" = { "$ref" = "#/$defs/command" }
"outputs" = { "type" = "array", "items" = { "$ref" = "#/$defs/hookOutput" }, "minItems" = 1 }

["$defs"."postInit"]
"type" = "object"
"additionalProperties" = false
"required" = ["run"]

["$defs"."postInit".properties]
"run" = { "$ref" = "#/$defs/command" }
"arguments" = { "type" = "boolean", "default" = false, "description" = "Whether the command also gets the arguments given to `silk init` after `--`." }

["$defs"."component"]
"type" = "object"
"additionalProperties" = false
"required" = ["wit", "world"]

["$defs"."component".properties]
"wit" = { "$ref" = "#/$defs/relativeDirectory" }
"world" = { "$ref" = "#/$defs/nonemptyText" }
